/* ============================================================================
   The Livingstone — hoja de estilo única
   Identidad: el azul marino del escudo con el oro de la cinta, sobre papel frío.
   Display: Abhaya Libre · Interfaz: IBM Plex Sans · Datos: IBM Plex Mono
   ========================================================================== */

/* ---------- 1. Tokens: claro (estado base, siempre completo) -------------- */
:root {
  color-scheme: light;

  --fondo:          #EBEEF3;
  --superficie:     #FFFFFF;
  --superficie-2:   #F4F6FA;
  --superficie-3:   #E6EBF2;
  --tinta:          #111C29;
  --tinta-2:        #45566B;
  --tinta-3:        #6E7F95;
  --linea:          #D9E0E9;
  --linea-fuerte:   #B7C3D2;

  --marca:          #273E55;
  --marca-ink:      #19293A;
  --marca-contraste:#FFFFFF;
  --marca-suave:    #E2E7EE;

  /* Amarillo del colegio, llevado a un dorado cálido: el limón puro no se
     lee sobre blanco. Va de relleno con el marino del escudo encima, como en
     su sitio; para trazos y letra chica va el oro oscuro. */
  --acento:         #8C6A0A;
  --acento-vivo:    #F0C23C;
  --acento-ink:     #2B3D53;
  --acento-suave:   #FBF1D7;

  /* El ámbar de las estrellas no es de la marca: es el único color que lee
     igual de rápido en una valoración, y por eso vive en su propio token. */
  --estrella:       #C8940C;

  --ok:             #1F6F63;
  --ok-suave:       #DCEEEA;
  --aviso:          #9A6410;
  --aviso-suave:    #F8EBD4;
  --crit:           #A9302A;
  --crit-suave:     #F8E1DF;
  --info:           #2C6E9B;
  --info-suave:     #E1EDF5;

  --serie-1: #273E55;
  --serie-2: #4175FC;
  --serie-3: #1F6F63;
  --serie-4: #6C8299;
  --serie-5: #5C3A6E;
  --serie-6: #9C4A3D;

  --sombra-1: 0 1px 2px rgba(17,28,41,.06), 0 1px 3px rgba(17,28,41,.05);
  --sombra-2: 0 4px 14px rgba(17,28,41,.10), 0 1px 3px rgba(17,28,41,.06);
  --sombra-3: 0 18px 48px rgba(17,28,41,.20);

  --r-sm: 4px;
  --r-md: 8px;
  --r-lg: 14px;
  --r-full: 999px;

  --riel-w: 246px;
  --topbar-h: 62px;

  --f-display: "Abhaya Libre", "Iowan Old Style", Georgia, serif;
  --f-ui: "IBM Plex Sans", ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
}

/* ---------- 2. Tokens: oscuro por preferencia del sistema ----------------- */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;

    --fondo:        #0B131C;
    --superficie:   #131E2B;
    --superficie-2: #182635;
    --superficie-3: #1F2F41;
    --tinta:        #E8EEF6;
    --tinta-2:      #A3B4C7;
    --tinta-3:      #7B8CA1;
    --linea:        #26364A;
    --linea-fuerte: #364E68;

    --marca:        #93B4D9;
    --marca-ink:    #B8D0E9;
    --marca-contraste:#0B131C;
    --marca-suave:  #1C2E42;

    --acento:       #EFC85C;
    --acento-vivo:  #F0C23C;
    --acento-ink:   #1E1A08;
    --acento-suave: #3A3112;
    --estrella:     #EFC85C;

    --ok:           #5FC7A5;
    --ok-suave:     #123329;
    --aviso:        #E0AC57;
    --aviso-suave:  #3A2B12;
    --crit:         #EE8C82;
    --crit-suave:   #3C1D1A;
    --info:         #7FB6DE;
    --info-suave:   #16324B;

    --serie-1: #93B4D9;
    --serie-2: #86A9FF;
    --serie-3: #5FC7A5;
    --serie-4: #9FB3C8;
    --serie-5: #C08CBA;
    --serie-6: #E89184;

    --sombra-1: 0 1px 2px rgba(0,0,0,.36);
    --sombra-2: 0 4px 16px rgba(0,0,0,.44);
    --sombra-3: 0 18px 48px rgba(0,0,0,.60);
  }
}

/* ---------- 3. Tokens: oscuro elegido explícitamente ---------------------- */
:root[data-theme="dark"] {
  color-scheme: dark;

  --fondo:        #0B131C;
  --superficie:   #131E2B;
  --superficie-2: #182635;
  --superficie-3: #1F2F41;
  --tinta:        #E8EEF6;
  --tinta-2:      #A3B4C7;
  --tinta-3:      #7B8CA1;
  --linea:        #26364A;
  --linea-fuerte: #364E68;

  --marca:        #93B4D9;
  --marca-ink:    #B8D0E9;
  --marca-contraste:#0B131C;
  --marca-suave:  #1C2E42;

  --acento:       #EFC85C;
  --acento-vivo:  #F0C23C;
  --acento-ink:   #1E1A08;
  --acento-suave: #3A3112;
  --estrella:     #EFC85C;

  --ok:           #5FC7A5;
  --ok-suave:     #123329;
  --aviso:        #E0AC57;
  --aviso-suave:  #3A2B12;
  --crit:         #EE8C82;
  --crit-suave:   #3C1D1A;
  --info:         #7FB6DE;
  --info-suave:   #16324B;

  --serie-1: #93B4D9;
  --serie-2: #86A9FF;
  --serie-3: #5FC7A5;
  --serie-4: #9FB3C8;
  --serie-5: #C08CBA;
  --serie-6: #E89184;

  --sombra-1: 0 1px 2px rgba(0,0,0,.36);
  --sombra-2: 0 4px 16px rgba(0,0,0,.44);
  --sombra-3: 0 18px 48px rgba(0,0,0,.60);
}

/* ---------- 4. Base ------------------------------------------------------- */
*, *::before, *::after { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: var(--fondo);
  color: var(--tinta);
  font-family: var(--f-ui);
  font-size: 15px;
  line-height: 1.55;
  font-feature-settings: "cv05" 1;
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3, h4 { margin: 0; font-weight: 600; text-wrap: balance; letter-spacing: -.011em; }
h1 { font-size: 1.55rem; line-height: 1.2; }
h2 { font-size: 1.2rem;  line-height: 1.25; }
h3 { font-size: 1.02rem; line-height: 1.3; }
h4 { font-size: .92rem;  line-height: 1.35; }
p  { margin: 0 0 .8em; }
p:last-child { margin-bottom: 0; }
a { color: var(--marca); text-decoration-color: color-mix(in srgb, var(--marca) 40%, transparent); text-underline-offset: 2px; }
a:hover { text-decoration-color: currentColor; }
img { max-width: 100%; display: block; }
hr { border: 0; border-top: 1px solid var(--linea); margin: 1.2rem 0; }
small { font-size: .82em; }

::selection { background: var(--marca-suave); color: var(--tinta); }

:where(button, a, input, select, textarea, [tabindex]):focus-visible {
  outline: 2px solid var(--marca);
  outline-offset: 2px;
  border-radius: var(--r-sm);
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

/* ---------- 5. Utilidades ------------------------------------------------- */
.oculto { display: none !important; }
/* Pares para dar la versión corta de un dato en pantallas angostas. */
.solo-angosto { display: none; }
@media (max-width: 760px) {
  .solo-ancho { display: none; }
  .solo-angosto { display: inline; }
}
.txt-c { text-align: center; }
.txt-d { text-align: right; }
.mt-0{margin-top:0}.mt-1{margin-top:.5rem}.mt-2{margin-top:1rem}.mt-3{margin-top:1.6rem}
.mb-0{margin-bottom:0}.mb-1{margin-bottom:.5rem}.mb-2{margin-bottom:1rem}.mb-3{margin-bottom:1.6rem}
.gap-1{gap:.5rem}.gap-2{gap:1rem}.gap-3{gap:1.5rem}
.ancho-total { width: 100%; }
.nowrap { white-space: nowrap; }
.truncar { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.crece { flex: 1 1 auto; min-width: 0; }
.mono { font-family: var(--f-mono); font-size: .88em; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.num  { font-variant-numeric: tabular-nums; text-align: right; }
.silencio { color: var(--tinta-3); }
.etiqueta {
  font-size: .68rem; font-weight: 600; letter-spacing: .1em; text-transform: uppercase;
  color: var(--tinta-3);
}
.destacado { font-family: var(--f-display); font-optical-sizing: auto; }

.fila { display: flex; align-items: center; gap: .6rem; }
.fila.envuelve { flex-wrap: wrap; }
.pila { display: flex; flex-direction: column; gap: .6rem; }
.entre { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
.centro { display: flex; align-items: center; justify-content: center; }

.rejilla { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 1.1rem; }
.col-3  { grid-column: span 3; }
.col-4  { grid-column: span 4; }
.col-6  { grid-column: span 6; }
.col-8  { grid-column: span 8; }
.col-12 { grid-column: span 12; }
@media (max-width: 1080px) { .col-3 { grid-column: span 6; } .col-4 { grid-column: span 6; } }
@media (max-width: 780px)  { .col-3, .col-4, .col-6, .col-8 { grid-column: span 12; } }

/* ---------- 6. Escudo del colegio ---------------------------------------- */
/* El escudo oficial —el mismo del logotipo del 40 aniversario— recortado y
   embebido en base64: la demo sigue siendo un solo archivo, sin red. El texto
   que va dentro de .sello queda como alternativa para lectores de pantalla. */
.sello {

}
.sello-lg { width: 66px; height: 67px; }

.cinta {
  display: inline-flex; align-items: center; gap: .4rem;
  padding: .22rem .6rem;
  border-radius: var(--r-full);
  background: var(--acento-vivo);
  color: var(--acento-ink);
  font-size: .72rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
}

/* ---------- 7. Cascarón de la app ---------------------------------------- */
.shell { display: flex; min-height: 100vh; }

.riel {
  width: var(--riel-w); flex: none;
  background: var(--superficie);
  border-right: 1px solid var(--linea);
  display: flex; flex-direction: column;
  position: sticky; top: 0; height: 100vh;
  z-index: 40;
}
.riel-marca {
  display: flex; align-items: center; gap: .65rem;
  padding: 1rem 1.1rem;
  border-bottom: 1px solid var(--linea);
  min-height: var(--topbar-h);
}
.riel-marca .nombre { font-family: var(--f-display); font-weight: 600; font-size: 1.02rem; line-height: 1.1; }
.riel-marca .ciclo { font-size: .72rem; color: var(--tinta-3); letter-spacing: .04em; }

.riel-nav { padding: .8rem .6rem; overflow-y: auto; flex: 1 1 auto; }
.riel-nav .etiqueta { padding: .6rem .5rem .3rem; display: block; }
.riel-nav-item {
  display: flex; align-items: center; gap: .65rem;
  width: 100%;
  padding: .52rem .6rem;
  margin-bottom: 1px;
  border: 0; border-radius: var(--r-md);
  background: transparent; color: var(--tinta-2);
  font: inherit; font-size: .9rem; font-weight: 500;
  text-align: left; cursor: pointer;
  text-decoration: none;
  transition: background .12s ease, color .12s ease;
}
.riel-nav-item svg { flex: none; opacity: .82; }
.riel-nav-item:hover { background: var(--superficie-2); color: var(--tinta); }
.riel-nav-item[aria-current="page"] {
  background: var(--marca-suave); color: var(--marca-ink); font-weight: 600;
}
.riel-nav-item[aria-current="page"] svg { opacity: 1; }
.riel-nav-item .conteo {
  margin-left: auto; font-family: var(--f-mono); font-size: .74rem;
  background: var(--superficie-3); color: var(--tinta-2);
  padding: 0 .38rem; border-radius: var(--r-full);
}
.riel-pie { border-top: 1px solid var(--linea); padding: .7rem; }
.riel-persona {
  display: flex; align-items: center; gap: .6rem; padding: .4rem .35rem; min-width: 0;
}
.riel-persona .nom { font-size: .85rem; font-weight: 600; }
.riel-persona .rol { font-size: .72rem; color: var(--tinta-3); }

.principal { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }

.topbar {
  position: sticky; top: 0; z-index: 30;
  min-height: var(--topbar-h);
  display: flex; align-items: center; gap: .8rem;
  padding: .6rem 1.4rem;
  background: color-mix(in srgb, var(--fondo) 88%, transparent);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--linea);
}
.topbar h1 { font-size: 1.12rem; }
.topbar .sub { font-size: .78rem; color: var(--tinta-3); }

.contenido { padding: 1.4rem; flex: 1 1 auto; }
.contenedor { max-width: 1180px; margin: 0 auto; }

.btn-menu { display: none; }
@media (max-width: 900px) {
  .riel {
    position: fixed; inset: 0 auto 0 0;
    transform: translateX(-100%);
    transition: transform .2s ease;
    box-shadow: var(--sombra-3);
  }
  .riel.abierto { transform: none; }
  .btn-menu { display: inline-flex; }
  .contenido { padding: 1rem; }
  .topbar { padding: .6rem 1rem; }
}

.velo {
  position: fixed; inset: 0; z-index: 35;
  background: rgba(6, 16, 26, .48);
  border: 0;
}

/* ---------- 8. Secciones y paneles --------------------------------------- */
.seccion { margin-bottom: 1.6rem; }
.seccion:last-child { margin-bottom: 0; }
.seccion-cab {
  display: flex; align-items: flex-end; justify-content: space-between;
  gap: 1rem; flex-wrap: wrap; margin-bottom: .8rem;
}
.seccion-cab h2 { font-family: var(--f-display); font-optical-sizing: auto; font-weight: 600; }
.seccion-cab .sub { font-size: .85rem; color: var(--tinta-3); margin-top: .1rem; }

.panel {
  background: var(--superficie);
  border: 1px solid var(--linea);
  border-radius: var(--r-lg);
  overflow: hidden;
}
.panel-cab {
  display: flex; align-items: center; justify-content: space-between; gap: 1rem;
  padding: .85rem 1.1rem;
  border-bottom: 1px solid var(--linea);
  flex-wrap: wrap;
}
.panel-tit { font-size: .96rem; font-weight: 600; margin: 0; }
.panel-sub { font-size: .78rem; color: var(--tinta-3); margin: .1rem 0 0; }
.panel-acc { display: flex; align-items: center; gap: .45rem; flex-wrap: wrap; }
.panel-cuerpo { padding: 1.1rem; }
.panel-cuerpo.sin-relleno { padding: 0; }
.panel-pie {
  padding: .7rem 1.1rem; border-top: 1px solid var(--linea);
  background: var(--superficie-2); font-size: .82rem; color: var(--tinta-2);
}

.tarjeta {
  background: var(--superficie); border: 1px solid var(--linea);
  border-radius: var(--r-md); padding: .9rem 1rem;
}
.tarjeta-plana { background: var(--superficie-2); border-radius: var(--r-md); padding: .85rem .95rem; }
.caja-suave {
  background: var(--superficie-2); border-radius: var(--r-md);
  padding: .8rem .95rem; border: 1px solid var(--linea);
}
.separador { height: 1px; background: var(--linea); margin: .9rem 0; }

.lista { list-style: none; margin: 0; padding: 0; }
.lista-item {
  display: flex; align-items: center; gap: .8rem;
  padding: .72rem 1.1rem;
  border-bottom: 1px solid var(--linea);
}
.lista-item:last-child { border-bottom: 0; }
.lista-item .crece { min-width: 0; }
.lista-item .t { font-size: .9rem; font-weight: 550; }
.lista-item .d { font-size: .79rem; color: var(--tinta-3); }
a.lista-item, button.lista-item {
  width: 100%; background: none; border-left: 0; border-right: 0; border-top: 0;
  font: inherit; color: inherit; text-align: left; cursor: pointer; text-decoration: none;
}
a.lista-item:hover, button.lista-item:hover { background: var(--superficie-2); }

/* ---------- 9. KPI -------------------------------------------------------- */
.kpi {
  background: var(--superficie); border: 1px solid var(--linea);
  border-radius: var(--r-lg); padding: .95rem 1.05rem;
  display: flex; flex-direction: column; gap: .1rem; height: 100%;
}
.kpi-etiqueta {
  font-size: .7rem; font-weight: 600; letter-spacing: .09em; text-transform: uppercase;
  color: var(--tinta-3); display: flex; align-items: center; gap: .38rem;
}
.kpi-valor {
  font-family: var(--f-display); font-optical-sizing: auto;
  font-size: 1.95rem; font-weight: 600; line-height: 1.12; letter-spacing: -.02em;
  font-variant-numeric: tabular-nums; margin-top: .15rem;
}
.kpi-valor .unidad { font-size: .95rem; font-weight: 500; color: var(--tinta-3); margin-left: .12rem; }
.kpi-sub { font-size: .8rem; color: var(--tinta-2); }
.kpi-pie { margin-top: auto; padding-top: .55rem; font-size: .76rem; color: var(--tinta-3); }
.kpi.v-ok    .kpi-valor { color: var(--ok); }
.kpi.v-aviso .kpi-valor { color: var(--aviso); }
.kpi.v-crit  .kpi-valor { color: var(--crit); }
.kpi.v-marca .kpi-valor { color: var(--marca-ink); }

/* ---------- 10. Tablas ---------------------------------------------------- */
.tabla-envoltura { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.tabla { width: 100%; border-collapse: collapse; font-size: .875rem; }
.tabla th {
  text-align: left; font-weight: 600; font-size: .7rem; letter-spacing: .08em;
  text-transform: uppercase; color: var(--tinta-3);
  padding: .6rem .8rem; border-bottom: 1px solid var(--linea);
  background: var(--superficie-2); white-space: nowrap; position: sticky; top: 0;
}
.tabla td { padding: .62rem .8rem; border-bottom: 1px solid var(--linea); vertical-align: middle; }
.tabla tbody tr:last-child td { border-bottom: 0; }
.tabla tbody tr:hover td { background: var(--superficie-2); }
.tabla th.num, .tabla td.num { text-align: right; }
.tabla th.centro-col, .tabla td.centro-col { text-align: center; }
.tabla td.mono { font-family: var(--f-mono); font-size: .82rem; }
.tabla .fila-atenuada td { opacity: .58; }

.nota-alta  { color: var(--ok);    font-weight: 600; }
.nota-media { color: var(--aviso); font-weight: 600; }
.nota-baja  { color: var(--crit);  font-weight: 600; }

/* ---------- 11. Botones --------------------------------------------------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: .4rem;
  padding: .46rem .85rem;
  border: 1px solid var(--linea-fuerte);
  border-radius: var(--r-md);
  background: var(--superficie);
  color: var(--tinta);
  font: inherit; font-size: .86rem; font-weight: 550;
  cursor: pointer; text-decoration: none; white-space: nowrap;
  transition: background .12s ease, border-color .12s ease, color .12s ease;
}
.btn:hover { background: var(--superficie-2); border-color: var(--tinta-3); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn svg { flex: none; }

.btn-primario { background: var(--marca); border-color: var(--marca); color: var(--marca-contraste); }
.btn-primario:hover { background: var(--marca-ink); border-color: var(--marca-ink); color: var(--marca-contraste); }

.btn-suave { background: var(--marca-suave); border-color: transparent; color: var(--marca-ink); }
.btn-suave:hover { background: color-mix(in srgb, var(--marca-suave) 70%, var(--marca) 12%); border-color: transparent; }

.btn-fantasma { background: transparent; border-color: transparent; color: var(--tinta-2); }
.btn-fantasma:hover { background: var(--superficie-2); border-color: transparent; color: var(--tinta); }

.btn-peligro { background: var(--crit-suave); border-color: transparent; color: var(--crit); }
.btn-peligro:hover { background: var(--crit); border-color: var(--crit); color: var(--superficie); }

.btn-sm { padding: .28rem .58rem; font-size: .78rem; border-radius: var(--r-sm); }
.btn-bloque { width: 100%; }
.btn-icono { padding: .42rem; border-radius: var(--r-md); }
.btn-icono.btn-sm { padding: .28rem; }

/* ---------- 12. Insignias ------------------------------------------------- */
.badge {
  display: inline-flex; align-items: center; gap: .3rem;
  padding: .13rem .5rem;
  border-radius: var(--r-full);
  font-size: .72rem; font-weight: 600; line-height: 1.5;
  white-space: nowrap;
  background: var(--superficie-3); color: var(--tinta-2);
}
.badge-ok     { background: var(--ok-suave);    color: var(--ok); }
.badge-aviso  { background: var(--aviso-suave); color: var(--aviso); }
.badge-crit   { background: var(--crit-suave);  color: var(--crit); }
.badge-info   { background: var(--info-suave);  color: var(--info); }
.badge-marca  { background: var(--marca-suave); color: var(--marca-ink); }
.badge-neutro { background: var(--superficie-3);color: var(--tinta-2); }

.chip {
  display: inline-flex; align-items: center; gap: .3rem;
  padding: .2rem .6rem; border-radius: var(--r-full);
  border: 1px solid var(--linea); background: var(--superficie-2);
  font-size: .78rem; color: var(--tinta-2);
}

/* ---------- 13. Avatares -------------------------------------------------- */
.avatar {
  display: inline-flex; align-items: center; justify-content: center;
  flex: none; overflow: hidden;
  width: 38px; height: 38px; border-radius: var(--r-full);
  background: var(--marca); color: #fff;
  font-weight: 600; font-size: .82rem; letter-spacing: .01em;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.16);
  user-select: none;
}
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.avatar-xs { width: 24px; height: 24px; font-size: .62rem; }
.avatar-sm { width: 30px; height: 30px; font-size: .7rem; }
.avatar-md { width: 44px; height: 44px; font-size: .92rem; }
.avatar-lg { width: 68px; height: 68px; font-size: 1.3rem; }
.avatar-xl { width: 108px; height: 108px; font-size: 2rem; border-radius: 20px; }

/* ---------- 14. Estrellas ------------------------------------------------- */
.estrellas { display: inline-flex; align-items: center; gap: .08rem; color: var(--linea-fuerte); }
.estrellas svg { width: 15px; height: 15px; }
.estrellas.tam-lg svg { width: 20px; height: 20px; }
.estrella-llena { color: var(--estrella); }
.estrellas .valor {
  margin-left: .38rem; font-family: var(--f-mono); font-size: .82rem;
  color: var(--tinta-2); font-variant-numeric: tabular-nums;
}

.estrellas-input { display: inline-flex; flex-direction: row-reverse; gap: .15rem; }
.estrellas-input input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.estrellas-input label { cursor: pointer; color: var(--linea-fuerte); line-height: 1; }
.estrellas-input label svg { width: 26px; height: 26px; }
.estrellas-input input:checked ~ label,
.estrellas-input label:hover, .estrellas-input label:hover ~ label { color: var(--estrella); }
.estrellas-input input:focus-visible + label { outline: 2px solid var(--marca); outline-offset: 2px; }

/* ---------- 15. Pestañas -------------------------------------------------- */
.pestanas {
  display: flex; gap: .2rem; flex-wrap: wrap;
  border-bottom: 1px solid var(--linea);
  margin-bottom: 1.1rem;
}
.pestana {
  border: 0; background: none; font: inherit; font-size: .88rem; font-weight: 550;
  color: var(--tinta-3); cursor: pointer;
  padding: .5rem .8rem; border-bottom: 2px solid transparent; margin-bottom: -1px;
  display: inline-flex; align-items: center; gap: .4rem;
}
.pestana:hover { color: var(--tinta); }
.pestana-activa { color: var(--marca-ink); border-bottom-color: var(--marca); }
.pestana .conteo {
  font-family: var(--f-mono); font-size: .72rem;
  background: var(--superficie-3); color: var(--tinta-2);
  padding: 0 .34rem; border-radius: var(--r-full);
}
.pestana-activa .conteo { background: var(--marca-suave); color: var(--marca-ink); }

/* ---------- 16. Formularios ---------------------------------------------- */
.campo { display: flex; flex-direction: column; gap: .28rem; margin-bottom: .9rem; }
.campo-etiqueta { font-size: .78rem; font-weight: 600; color: var(--tinta-2); }
.campo-ayuda { font-size: .75rem; color: var(--tinta-3); }
.campo-req { color: var(--crit); }

.entrada, .selec, .area {
  width: 100%;
  padding: .46rem .62rem;
  border: 1px solid var(--linea-fuerte);
  border-radius: var(--r-md);
  background: var(--superficie);
  color: var(--tinta);
  font: inherit; font-size: .88rem;
}
.area { resize: vertical; min-height: 84px; line-height: 1.5; }
.entrada:focus, .selec:focus, .area:focus {
  outline: none; border-color: var(--marca);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--marca) 18%, transparent);
}
.entrada::placeholder, .area::placeholder { color: var(--tinta-3); }
.entrada[readonly] { background: var(--superficie-2); color: var(--tinta-2); }
.selec {
  appearance: none;
  padding-right: 1.9rem;
  background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%);
  background-position: calc(100% - 16px) 51%, calc(100% - 11px) 51%;
  background-size: 5px 5px, 5px 5px;
  background-repeat: no-repeat;
}
input.entrada[type="file"] { padding: .34rem .5rem; font-size: .8rem; }
.entrada.mono { font-family: var(--f-mono); }

.checa { display: flex; align-items: flex-start; gap: .55rem; font-size: .86rem; cursor: pointer; }
.checa input { margin: .28rem 0 0; accent-color: var(--marca); width: 16px; height: 16px; flex: none; }

.form-rejilla { display: grid; grid-template-columns: repeat(12, minmax(0,1fr)); gap: 0 1rem; }
.form-acciones { display: flex; gap: .5rem; justify-content: flex-end; flex-wrap: wrap; margin-top: .3rem; }

/* celda de captura de calificaciones */
.celda-nota {
  width: 66px; padding: .28rem .4rem; text-align: right;
  font-family: var(--f-mono); font-size: .84rem;
  border: 1px solid var(--linea); border-radius: var(--r-sm);
  background: var(--superficie); color: var(--tinta);
}
.celda-nota:focus {
  outline: none; border-color: var(--marca);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--marca) 18%, transparent);
}
.celda-nota.cambiada { border-color: var(--acento); background: var(--acento-suave); }

/* ---------- 17. Progreso y gráficas -------------------------------------- */
.progreso {
  height: 6px; border-radius: var(--r-full);
  background: var(--superficie-3); overflow: hidden;
}
.progreso-barra { height: 100%; background: var(--marca); border-radius: inherit; transition: width .35s ease; }
.progreso-barra.v-ok { background: var(--ok); }
.progreso-barra.v-aviso { background: var(--aviso); }
.progreso-barra.v-crit { background: var(--crit); }

.grafica { width: 100%; display: block; overflow: visible; }
.grafica text { font-family: var(--f-ui); fill: var(--tinta-3); font-size: 11px; }
.grafica .eje { stroke: var(--linea); stroke-width: 1; }
.grafica .rejilla-lin { stroke: var(--linea); stroke-width: 1; stroke-dasharray: 2 4; }
.grafica .meta { stroke: var(--acento); stroke-width: 1.5; stroke-dasharray: 5 4; }
.grafica .val { fill: var(--tinta); font-family: var(--f-mono); font-size: 11px; font-weight: 500; }

.leyenda { display: flex; flex-wrap: wrap; gap: .35rem .95rem; margin-top: .7rem; }
.leyenda-item { display: inline-flex; align-items: center; gap: .35rem; font-size: .78rem; color: var(--tinta-2); }
.leyenda-item .punto { width: 9px; height: 9px; border-radius: 3px; flex: none; }

/* ---------- 18. Vacío ----------------------------------------------------- */
.vacio {
  text-align: center; padding: 2.4rem 1.2rem; color: var(--tinta-3);
}
.vacio .ico {
  display: inline-flex; align-items: center; justify-content: center;
  width: 46px; height: 46px; border-radius: var(--r-full);
  background: var(--superficie-3); color: var(--tinta-3); margin-bottom: .7rem;
}
.vacio h4 { color: var(--tinta-2); margin-bottom: .25rem; }
.vacio p { font-size: .86rem; max-width: 44ch; margin: 0 auto; }

/* ---------- 19. Toast y modal -------------------------------------------- */
.toast-zona {
  position: fixed; z-index: 90; bottom: 1.1rem; right: 1.1rem;
  display: flex; flex-direction: column; gap: .5rem; align-items: flex-end;
  pointer-events: none;
}
.toast {
  display: flex; align-items: center; gap: .55rem;
  background: var(--tinta); color: var(--fondo);
  padding: .6rem .9rem; border-radius: var(--r-md);
  box-shadow: var(--sombra-3); font-size: .87rem; font-weight: 500;
  max-width: min(92vw, 400px);
  animation: toast-entra .22s ease both;
}
.toast.v-ok    { background: var(--ok);    color: #fff; }
.toast.v-crit  { background: var(--crit);  color: #fff; }
.toast.v-aviso { background: var(--aviso); color: #fff; }
.toast.saliendo { animation: toast-sale .25s ease both; }
@keyframes toast-entra { from { opacity: 0; transform: translateY(8px); } }
@keyframes toast-sale  { to   { opacity: 0; transform: translateY(6px); } }

.modal-fondo {
  position: fixed; inset: 0; z-index: 80;
  background: rgba(6, 16, 26, .5);
  display: flex; align-items: center; justify-content: center;
  padding: 1.2rem; overflow-y: auto;
  animation: aparece .16s ease both;
}
@keyframes aparece { from { opacity: 0; } }
.modal {
  background: var(--superficie);
  border-radius: var(--r-lg);
  box-shadow: var(--sombra-3);
  width: min(100%, 560px);
  max-height: calc(100vh - 2.4rem);
  display: flex; flex-direction: column;
  animation: modal-entra .2s cubic-bezier(.2,.8,.3,1) both;
}
@keyframes modal-entra { from { opacity: 0; transform: translateY(10px) scale(.985); } }
.modal.ancho { width: min(100%, 860px); }
.modal.angosto { width: min(100%, 420px); }
.modal-cab {
  padding: 1rem 1.2rem .8rem;
  border-bottom: 1px solid var(--linea);
  display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem;
}
.modal-cab h3 { font-family: var(--f-display); font-optical-sizing: auto; font-size: 1.08rem; }
.modal-cab .sub { font-size: .82rem; color: var(--tinta-3); margin-top: .12rem; }
.modal-cuerpo { padding: 1.2rem; overflow-y: auto; }
.modal-pie {
  padding: .8rem 1.2rem; border-top: 1px solid var(--linea);
  display: flex; justify-content: flex-end; gap: .5rem; flex-wrap: wrap;
  background: var(--superficie-2);
}

/* ---------- 20. Migas ----------------------------------------------------- */
.migas { display: flex; align-items: center; gap: .35rem; flex-wrap: wrap; font-size: .8rem; margin-bottom: .7rem; }
.migas a, .migas button {
  color: var(--tinta-3); background: none; border: 0; padding: 0; font: inherit; font-size: inherit;
  cursor: pointer; text-decoration: none;
}
.migas a:hover, .migas button:hover { color: var(--marca); text-decoration: underline; }
.migas .sep { color: var(--linea-fuerte); }
.migas .actual { color: var(--tinta-2); font-weight: 550; }

/* ============================================================================
   21. Sitio público
   ========================================================================== */
.sitio { background: var(--fondo); min-height: 100vh; }

.sitio-nav {
  position: sticky; top: 0; z-index: 30;
  display: flex; align-items: center; justify-content: space-between; gap: 1rem;
  padding: .8rem 1.5rem;
  background: color-mix(in srgb, var(--fondo) 90%, transparent);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--linea);
}
.sitio-nav .marca { display: flex; align-items: center; gap: .65rem; text-decoration: none; color: inherit; }
.sitio-nav .marca .nombre { font-family: var(--f-display); font-weight: 700; font-size: 1.05rem; display: block; }
.sitio-nav .marca .lema { display: block; }
.sitio-nav .enlaces { display: flex; align-items: center; gap: .2rem; }
.sitio-nav .enlaces a, .sitio-nav .enlaces button {
  padding: .4rem .7rem; border-radius: var(--r-md); border: 0; background: none;
  font: inherit; font-size: .87rem; font-weight: 500; color: var(--tinta-2);
  cursor: pointer; text-decoration: none;
}
.sitio-nav .enlaces a:hover, .sitio-nav .enlaces button:hover { background: var(--superficie); color: var(--tinta); }
.sitio-nav .marca .nombre, .sitio-nav .marca .etiqueta { white-space: nowrap; }
/* Con seis secciones en la barra, las opcionales se van antes de que algo se
   parta en dos renglones. */
@media (max-width: 1040px) { .sitio-nav .enlaces .opcional { display: none; } }
@media (max-width: 560px) {
  .sitio-nav { padding: .7rem 1rem; }
  .sitio-nav .enlaces { display: none; }
  /* En teléfono la barra sólo lleva el escudo, el nombre y el acceso; si el
     nombre no cabe, se recorta antes que empujar el botón fuera de pantalla. */
  .sitio-nav .marca { flex: 1 1 auto; min-width: 0; }
  .sitio-nav .marca > span:last-child { min-width: 0; overflow: hidden; }
  .sitio-nav .marca .etiqueta { display: none; }
  .sitio-nav .marca .nombre {
    display: block; font-size: .98rem;
    overflow: hidden; text-overflow: ellipsis;
  }
}

.sitio-cuerpo { max-width: 1080px; margin: 0 auto; padding: 0 1.5rem 3rem; }

.hero {
  padding: 3.2rem 0 2.4rem;
  display: grid; grid-template-columns: 1.35fr .9fr; gap: 2.6rem; align-items: center;
}
@media (max-width: 860px) { .hero { grid-template-columns: 1fr; gap: 1.8rem; padding: 2.2rem 0 1.6rem; } }
.hero-sello { display: flex; align-items: center; gap: .8rem; margin-bottom: 1.1rem; }
.hero-tit {
  font-family: var(--f-display); font-optical-sizing: auto;
  font-size: clamp(2.1rem, 5.2vw, 3.35rem);
  font-weight: 600; line-height: 1.04; letter-spacing: -.025em;
  margin: 0 0 .7rem;
}
.hero-tit em {
  font-style: italic; font-weight: 500;
  color: var(--marca-ink);
}
.hero-sub { font-size: 1.03rem; color: var(--tinta-2); max-width: 46ch; margin: 0 0 1.4rem; }
.hero-datos {
  display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 1px; background: var(--linea);
  border: 1px solid var(--linea); border-radius: var(--r-lg); overflow: hidden;
}
.hero-datos > div { background: var(--superficie); padding: .85rem .9rem; }
.hero-datos .v {
  font-family: var(--f-display); font-optical-sizing: auto;
  font-size: 1.5rem; font-weight: 600; line-height: 1.1; font-variant-numeric: tabular-nums;
}
.hero-datos .e { font-size: .72rem; color: var(--tinta-3); letter-spacing: .05em; text-transform: uppercase; font-weight: 600; }

.hero-tarjeta {
  background: var(--superficie); border: 1px solid var(--linea);
  border-radius: var(--r-lg); padding: 1.3rem; box-shadow: var(--sombra-2);
}
.hero-tarjeta h3 { font-family: var(--f-display); font-optical-sizing: auto; margin-bottom: .2rem; }

.bloque { padding: 2.4rem 0; border-top: 1px solid var(--linea); }
.bloque-tit {
  font-family: var(--f-display); font-optical-sizing: auto;
  font-size: 1.7rem; font-weight: 600; letter-spacing: -.018em; margin: 0 0 .3rem;
}
.bloque .intro { color: var(--tinta-2); max-width: 60ch; margin: 0 0 1.5rem; }

/* El botón sólo aparece en pantalla angosta, y sólo mientras haya algo que
   desplegar: la regla que lo enciende vive en el bloque de teléfono. */
.mas-claustro { display: none; margin-top: .9rem; }

.claustro { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 1.1rem; }
.claustro-item {
  background: var(--superficie); border: 1px solid var(--linea); border-radius: var(--r-lg);
  padding: 1.15rem; display: flex; flex-direction: column; gap: .75rem;
  text-align: left; font: inherit; color: inherit; cursor: pointer; width: 100%;
  transition: border-color .14s ease, transform .14s ease, box-shadow .14s ease;
}
.claustro-item:hover { border-color: var(--linea-fuerte); transform: translateY(-2px); box-shadow: var(--sombra-2); }
.claustro-item .nom { font-family: var(--f-display); font-optical-sizing: auto; font-size: 1.05rem; font-weight: 600; }
.claustro-item .tit { font-size: .8rem; color: var(--tinta-3); }

.oferta { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1px; background: var(--linea); border: 1px solid var(--linea); border-radius: var(--r-lg); overflow: hidden; }
.oferta-item { background: var(--superficie); padding: 1.05rem 1.1rem; display: flex; flex-direction: column; gap: .35rem; }
.oferta-item .cod { font-family: var(--f-mono); font-size: .72rem; color: var(--acento); font-weight: 600; letter-spacing: .04em; }
.oferta-item .nom { font-weight: 600; font-size: .98rem; }
.oferta-item .desc { font-size: .82rem; color: var(--tinta-2); }
.oferta-item .pie { margin-top: auto; padding-top: .5rem; font-size: .78rem; color: var(--tinta-3); display: flex; align-items: center; gap: .45rem; }

.cita {
  border-left: 3px solid var(--acento);
  padding: .2rem 0 .2rem 1.1rem;
  font-family: var(--f-display); font-optical-sizing: auto;
  font-size: 1.16rem; font-style: italic; line-height: 1.45; color: var(--tinta);
}
.cita footer { font-family: var(--f-ui); font-style: normal; font-size: .82rem; color: var(--tinta-3); margin-top: .5rem; }

.sitio-pie {
  border-top: 1px solid var(--linea); background: var(--superficie);
  padding: 2rem 1.5rem;
}
.sitio-pie .interior {
  max-width: 1080px; margin: 0 auto;
  display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.6rem;
}
.sitio-pie h4 { font-size: .74rem; letter-spacing: .09em; text-transform: uppercase; color: var(--tinta-3); margin-bottom: .5rem; }
.sitio-pie p, .sitio-pie li { font-size: .86rem; color: var(--tinta-2); }
.sitio-pie ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: .28rem; }
.sitio-pie .legal { max-width: 1080px; margin: 1.6rem auto 0; padding-top: 1rem; border-top: 1px solid var(--linea); font-size: .78rem; color: var(--tinta-3); }

/* ---------- 22. Acceso ---------------------------------------------------- */
.acceso { min-height: 100vh; display: flex; flex-direction: column; background: var(--fondo); }
.acceso-interior { max-width: 900px; margin: 0 auto; padding: 2.6rem 1.5rem 3rem; width: 100%; }
.acceso-tit { font-family: var(--f-display); font-optical-sizing: auto; font-size: 2rem; font-weight: 600; letter-spacing: -.02em; }
.cuentas { display: grid; grid-template-columns: repeat(auto-fit, minmax(232px, 1fr)); gap: .8rem; }
.cuenta {
  display: flex; align-items: center; gap: .75rem; text-align: left; width: 100%;
  background: var(--superficie); border: 1px solid var(--linea); border-radius: var(--r-lg);
  padding: .85rem .95rem; font: inherit; color: inherit; cursor: pointer;
  transition: border-color .14s ease, transform .14s ease, box-shadow .14s ease;
}
.cuenta:hover { border-color: var(--marca); transform: translateY(-1px); box-shadow: var(--sombra-2); }
.cuenta .nom { font-weight: 600; font-size: .9rem; }
.cuenta .det { font-size: .77rem; color: var(--tinta-3); }
.aviso-demo {
  display: flex; align-items: flex-start; gap: .6rem;
  background: var(--acento-suave); color: var(--tinta);
  border-radius: var(--r-md); padding: .7rem .9rem; font-size: .84rem;
}
.aviso-demo strong { color: inherit; }

/* ---------- 23. Perfil docente público ----------------------------------- */
.perfil-cab {
  display: grid; grid-template-columns: auto 1fr; gap: 1.4rem; align-items: start;
  padding: 1.4rem; background: var(--superficie);
  border: 1px solid var(--linea); border-radius: var(--r-lg);
}
@media (max-width: 620px) { .perfil-cab { grid-template-columns: 1fr; } }
.perfil-cab .nom { font-family: var(--f-display); font-optical-sizing: auto; font-size: 1.6rem; font-weight: 600; letter-spacing: -.02em; line-height: 1.15; }
.perfil-cab .tit { color: var(--tinta-2); font-size: .95rem; }

.linea-tiempo { list-style: none; margin: 0; padding: 0 0 0 1.05rem; border-left: 2px solid var(--linea); }
.linea-tiempo li { position: relative; padding: 0 0 1rem 1rem; }
.linea-tiempo li:last-child { padding-bottom: 0; }
.linea-tiempo li::before {
  content: ""; position: absolute; left: -1.42rem; top: .42rem;
  width: 9px; height: 9px; border-radius: var(--r-full);
  background: var(--superficie); border: 2px solid var(--acento);
}
.linea-tiempo .t { font-weight: 600; font-size: .9rem; }
.linea-tiempo .d { font-size: .8rem; color: var(--tinta-3); }
.linea-tiempo .x { font-size: .84rem; color: var(--tinta-2); margin-top: .18rem; }

.resena {

/* ============================================================================
   20-datos.js — Semilla de la demostración: The Livingstone.
   Declara: const SEMILLA
   Los datos derivados (materias por grado, calificaciones, asistencias,
   entregas, pagos) se generan con un hash determinista: la demo se ve idéntica

const SEMILLA = (function construirSemilla() {

  /* --- ruido determinista: mismo texto, mismo número, siempre --- */
  function h(texto) {
    var x = 2166136261;
    for (var i = 0; i < texto.length; i++) {
      x ^= texto.charCodeAt(i);
      x = Math.imul(x, 16777619);
    }
    return ((x >>> 0) % 100000) / 100000;
  }
  function entre(texto, min, max) { return min + h(texto) * (max - min); }
  function red1(n) { return Math.round(n * 10) / 10; }
  function tope(n, min, max) { return Math.max(min, Math.min(max, n)); }
  function dos(n) { return n < 10 ? '0' + n : String(n); }

  var ACENTOS = { 'á': 'a', 'é': 'e', 'í': 'i', 'ó': 'o', 'ú': 'u', 'ü': 'u', 'ñ': 'n' };

  }
  function usuario(nombre) {
    var p = partesNombre(nombre);
    return llano((p[0] || 'persona') + '.' + (p[1] || '')).replace(/[^a-z0-9.]/g, '').replace(/\.$/, '');
  }
  function inic(nombre) {
    var p = partesNombre(nombre);
    return ((p[0] || '?').charAt(0) + (p[1] || '?').charAt(0)).toUpperCase();
  }
  function archivoCV(nombre) {
    return 'CV_' + llano(partesNombre(nombre).slice(0, 2).join('_')).replace(/[^a-z_]/g, '') + '_2025.pdf';
  }

  var PALETA = ['#273E55', '#4175FC', '#1F6F63', '#6C8299', '#5C3A6E', '#9C4A3D'];
  function color(i) { return PALETA[i % PALETA.length]; }

  var DOM = 'colegiodlivingstone.edu.mx';
  var DOM_AL = 'alumnos.colegiodlivingstone.edu.mx';

/* ===== src/30-store.js ===== */
/* ============================================================================
   30-store.js — Núcleo de datos de The Livingstone.
   Declara: var DB, const HOY, const Store, const Sesion, const Q, const M
   Estado, persistencia, sesión, selectores puros y mutaciones validadas.
   ========================================================================== */

/* Fecha fija de la demostración: viernes 14 de noviembre de 2025, 9:00 h.
   Todo cálculo relativo (vencimientos, días restantes, sellos de captura)
   se hace contra HOY para que la demo sea idéntica en cualquier equipo. */
const HOY = new Date(2025, 10, 14, 9, 0, 0);

/* Estado vivo de la aplicación. Lo puebla Store.cargar() al final del archivo. */
var DB;

/* ---------------------------------------------------------------- Store --- */
const Store = (function () {

  var CLAVE_DB = 'livingstone.db.v5';
  var suscriptores = [];
  var COLECCIONES = [
    'niveles', 'grados',
    'alumnos', 'profesores', 'materias', 'inscripciones', 'evaluaciones',
    'calificaciones', 'asistencias', 'tareas', 'entregas', 'materiales',
    'avisos', 'pagos', 'resenas', 'bitacora'
  ];

  function clonar(valor) { return JSON.parse(JSON.stringify(valor)); }

  /* Garantiza que DB tenga todas las piezas aunque el respaldo venga incompleto. */
  function sanear(datos) {
    if (!datos.escuela || typeof datos.escuela !== 'object') datos.escuela = clonar(SEMILLA.escuela);
    if (!datos.direccion || typeof datos.direccion !== 'object') datos.direccion = clonar(SEMILLA.direccion);
    if (typeof datos.contador !== 'number' || !isFinite(datos.contador)) datos.contador = SEMILLA.contador;
    datos.version = SEMILLA.version;
    COLECCIONES.forEach(function (llave) {
      if (!Array.isArray(datos[llave])) datos[llave] = clonar(SEMILLA[llave] || []);
    });
    return datos;
  }

  return {

    clave: CLAVE_DB,
    clonar: clonar,

    /* Fecha (Date) a cadena 'AAAA-MM-DD' en hora local. Sin argumento, usa HOY. */
    iso: function (fecha) {
      var d = (fecha instanceof Date && isFinite(fecha.getTime())) ? fecha : HOY;
      var mes = d.getMonth() + 1;
      var dia = d.getDate();
      return d.getFullYear() + '-' + (mes < 10 ? '0' + mes : mes) + '-' + (dia < 10 ? '0' + dia : dia);
    },

    cargar: function () {
      var crudo = null;
      var datos = null;
      try { crudo = window.localStorage.getItem(CLAVE_DB); }
      catch (e) { crudo = null; }               /* modo privado o marco restringido */
      if (crudo) {
        try { datos = JSON.parse(crudo); }
        catch (e) { datos = null; }             /* respaldo corrupto: se re-siembra */
      }
      if (!datos || typeof datos !== 'object' || datos.version !== SEMILLA.version) {
        datos = clonar(SEMILLA);
      }
      DB = sanear(datos);
      return DB;
    },

    guardar: function () {
      try { window.localStorage.setItem(CLAVE_DB, JSON.stringify(DB)); }
      catch (e) { /* sin almacenamiento: la demo sigue funcionando en memoria */ }
      suscriptores.slice().forEach(function (fn) {
        try { fn(DB); }
        catch (e) { /* un suscriptor con error no debe tumbar a los demás */ }
      });
    },

    reiniciar: function () {
      try { window.localStorage.removeItem(CLAVE_DB); }
      catch (e) { /* nada que borrar */ }
      DB = sanear(clonar(SEMILLA));
      Sesion.salir();
      Store.guardar();
      return { ok: true };
    },

    suscribir: function (fn) {
      if (typeof fn !== 'function') return function () {};
      suscriptores.push(fn);
      return function () {
        var i = suscriptores.indexOf(fn);
        if (i >= 0) suscriptores.splice(i, 1);
      };
    },

    uid: function (pfx) {
      return String(pfx || 'id') + '-' + (DB.contador++);
    },

    bitacora: function (texto) {
      var s = Sesion.actual();
      DB.bitacora.unshift({
        id: Store.uid('bit'),
        fecha: Store.iso(HOY),
        actorId: s ? s.id : 'sistema',
        texto: String(texto || '')
      });
      if (DB.bitacora.length > 80) DB.bitacora.length = 80;
    }
  };
})();

/* --------------------------------------------------------------- Sesion --- */
const Sesion = (function () {

  var CLAVE = 'livingstone.sesion';
  var cache = null;
  var leida = false;

  function persistir(s) {
    try {
      if (s) window.localStorage.setItem(CLAVE, JSON.stringify(s));
      else window.localStorage.removeItem(CLAVE);
    } catch (e) { /* sin almacenamiento: la sesión vive sólo en memoria */ }
  }

  return {

    actual: function () {
      if (!leida) {
        leida = true;
        cache = null;
        try {
          var crudo = window.localStorage.getItem(CLAVE);
          if (crudo) {
            var s = JSON.parse(crudo);
            if (s && s.rol && s.id) cache = { rol: String(s.rol), id: String(s.id) };
          }
        } catch (e) { cache = null; }
      }
      /* Si la persona ya no existe (demo reiniciada), la sesión se cae sola. */
      if (cache && !Q.persona(cache.rol, cache.id)) {
        cache = null;
        persistir(null);
      }
      return cache;
    },

    entrar: function (rol, id) {
      if (!Q.persona(rol, id)) return false;
      cache = { rol: String(rol), id: String(id) };
      leida = true;
      persistir(cache);
      return true;
    },

    salir: function () {
      cache = null;
      leida = true;
      persistir(null);
      return true;
    },

    persona: function () {
      var s = Sesion.actual();
      return s ? Q.persona(s.rol, s.id) : null;
    }
  };
})();

/* -------------------------------------------------------------------- Q --- */
const Q = (function () {

  var MESES3 = ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic'];
  var CRITERIOS = ['claridad', 'dominio', 'trato', 'puntualidad'];
  var TIPOS_TENDENCIA = { parcial: true, tarea: true, proyecto: true };

  function red1(n) { return Math.round(n * 10) / 10; }
  function cmp(a, b) { return a < b ? -1 : (a > b ? 1 : 0); }
  function txt(v) { return String(v === null || v === undefined ? '' : v); }
  function porNombre(a, b) { return txt(a.nombre).localeCompare(txt(b.nombre), 'es'); }
  function num(v) { var n = Number(v); return isFinite(n) ? n : 0; }

  /* Une los motivos en una frase corta y la deja capitalizada. */
  function frase(lista) {
    var t;
    if (!lista.length) return '';
    if (lista.length === 1) t = lista[0];
    else if (lista.length === 2) t = lista[0] + ' y ' + lista[1];
    else t = lista.slice(0, lista.length - 1).join(', ') + ' y ' + lista[lista.length - 1];
    return t.charAt(0).toUpperCase() + t.slice(1) + '.';
  }

  var api = {

    red1: red1,

    /* ---------------------------------------------------------- entidades */
    alumno: function (id) {
      return DB.alumnos.filter(function (a) { return a.id === id; })[0] || null;
    },
    profesor: function (id) {
      return DB.profesores.filter(function (p) { return p.id === id; })[0] || null;
    },
    materia: function (id) {
      return DB.materias.filter(function (m) { return m.id === id; })[0] || null;
    },
    evaluacion: function (id) {
      return DB.evaluaciones.filter(function (e) { return e.id === id; })[0] || null;
    },
    tarea: function (id) {
      return DB.tareas.filter(function (t) { return t.id === id; })[0] || null;
    },
    persona: function (rol, id) {
      if (rol === 'alumno') return Q.alumno(id);
      if (rol === 'profesor') return Q.profesor(id);
      if (rol === 'direccion') {
        if (!DB.direccion) return null;
        return (!id || DB.direccion.id === id) ? DB.direccion : null;
      }
      return null;
    },

    alumnosActivos: function () {
      return DB.alumnos.filter(function (a) { return a.estatus !== 'baja'; });
    },

    /* ----------------------------------------------------- niveles y grados */
    nivel: function (id) {
      return (DB.niveles || []).filter(function (n) { return n.id === id; })[0] || null;
    },
    grado: function (id) {
      return (DB.grados || []).filter(function (g) { return g.id === id; })[0] || null;
    },

    /* Niveles de preescolar a bachillerato, en orden escolar. */
    niveles: function () {
      return (DB.niveles || []).slice().sort(function (a, b) { return num(a.orden) - num(b.orden); });
    },

    /* Grados del colegio, o sólo los de un nivel, en orden escolar. */
    grados: function (nivelId) {
      var orden = {};
      Q.niveles().forEach(function (n, i) { orden[n.id] = i; });
      return (DB.grados || [])
        .filter(function (g) { return !nivelId || g.nivelId === nivelId; })
        .slice()
        .sort(function (a, b) {
          var d = (orden[a.nivelId] || 0) - (orden[b.nivelId] || 0);
          return d !== 0 ? d : num(a.numero) - num(b.numero);
        });
    },

    gradoDeAlumno: function (alumnoId) {
      var a = Q.alumno(alumnoId);
      return a ? Q.grado(a.gradoId) : null;
    },

    nivelDeGrado: function (gradoId) {
      var g = Q.grado(gradoId);
      return g ? Q.nivel(g.nivelId) : null;
    },

    nivelDeAlumno: function (alumnoId) {
      var g = Q.gradoDeAlumno(alumnoId);
      return g ? Q.nivel(g.nivelId) : null;
    },

    /* '4º de Primaria · grupo A' — texto listo para pintar. */
    etiquetaGrado: function (gradoId) {
      var g = Q.grado(gradoId);
      if (!g) return '—';
      return txt(g.etiqueta) + (g.grupo ? ' · grupo ' + g.grupo : '');
    },

    alumnosDeGrado: function (gradoId) {
      return DB.alumnos.filter(function (a) { return a.gradoId === gradoId; }).sort(porNombre);
    },

    materiasDeGrado: function (gradoId) {
      return DB.materias
        .filter(function (m) { return m.gradoId === gradoId && m.estatus === 'activa'; })
        .sort(porNombre);
    },

    /* Grados en los que un docente imparte al menos una materia activa. */
    gradosDeProfesor: function (profesorId) {
      var vistos = {};
      Q.materiasDeProfesor(profesorId).forEach(function (m) {
        if (m.estatus === 'activa') vistos[m.gradoId] = true;
      });
      return Q.grados().filter(function (g) { return vistos[g.id]; });
    },

    /* Promedio, asistencia y tamaño de un grupo. */
    resumenGrado: function (gradoId) {
      var g = Q.grado(gradoId);
      var als = Q.alumnosDeGrado(gradoId).filter(function (a) { return a.estatus !== 'baja'; });
      var proms = [];
      var presentes = 0;
      var totales = 0;
      als.forEach(function (a) {
        var p = Q.promedioGeneral(a.id);
        if (p !== null) proms.push(p);
        var s = Q.asistencia(a.id);
        presentes += s.presentes;
        totales += s.totales;
      });
      var suma = proms.reduce(function (x, y) { return x + y; }, 0);
      return {
        grado: g,
        nivel: g ? Q.nivel(g.nivelId) : null,
        tutor: g ? Q.profesor(g.tutorId) : null,
        alumnos: als.length,
        materias: Q.materiasDeGrado(gradoId).length,
        promedio: proms.length ? red1(suma / proms.length) : null,
        asistencia: totales > 0 ? Math.round(presentes / totales * 100) : 0
      };
    },

    /* Un renglón por nivel: alumnos, grados, promedio y colegiatura. */
    resumenNiveles: function () {
      return Q.niveles().map(function (n) {
        var grados = Q.grados(n.id);
        var proms = [];
        var alumnos = 0;
        var presentes = 0;
        var totales = 0;
        grados.forEach(function (g) {
          Q.alumnosDeGrado(g.id).forEach(function (a) {
            if (a.estatus === 'baja') return;
            alumnos++;
            var p = Q.promedioGeneral(a.id);
            if (p !== null) proms.push(p);
            var s = Q.asistencia(a.id);
            presentes += s.presentes;
            totales += s.totales;
          });
        });
        var suma = proms.reduce(function (x, y) { return x + y; }, 0);
        return {
          nivel: n,
          grados: grados.length,
          alumnos: alumnos,
          materias: DB.materias.filter(function (m) { return m.nivelId === n.id && m.estatus === 'activa'; }).length,
          promedio: proms.length ? red1(suma / proms.length) : null,
          asistencia: totales > 0 ? Math.round(presentes / totales * 100) : 0
        };
      });
    },

    /* Colegiatura mensual que le toca a un alumno según su nivel y su beca. */
    colegiaturaDe: function (alumnoId) {
      var a = Q.alumno(alumnoId);
      var n = Q.nivelDeAlumno(alumnoId);
      var base = (n && num(n.colegiatura)) || num(DB.escuela.colegiaturaMensual);
      var beca = a ? num(a.becaPct) : 0;
      return Math.round(base * (1 - beca / 100));
    },

    /* ------------------------------------------------------------ relaciones */
    materiasDeAlumno: function (alumnoId) {
      var ids = {};
      DB.inscripciones.forEach(function (i) {
        if (i.alumnoId === alumnoId) ids[i.materiaId] = true;
      });
      return DB.materias.filter(function (m) { return ids[m.id]; }).sort(porNombre);
    },

    materiasDeProfesor: function (profesorId) {
      return DB.materias.filter(function (m) { return m.profesorId === profesorId; }).sort(porNombre);
    },

    alumnosDeMateria: function (materiaId) {
      var ids = {};
      DB.inscripciones.forEach(function (i) {
        if (i.materiaId === materiaId) ids[i.alumnoId] = true;
      });
      return DB.alumnos.filter(function (a) { return ids[a.id]; }).sort(porNombre);
    },

    evaluacionesDeMateria: function (materiaId) {
      return DB.evaluaciones
        .filter(function (e) { return e.materiaId === materiaId; })
        .sort(function (a, b) { return cmp(txt(a.fecha), txt(b.fecha)); });
    },

    tareasDeMateria: function (materiaId) {
      return DB.tareas
        .filter(function (t) { return t.materiaId === materiaId; })
        .sort(function (a, b) { return cmp(txt(a.vence), txt(b.vence)); });
    },

    materialesDeMateria: function (materiaId) {
      return DB.materiales
        .filter(function (m) { return m.materiaId === materiaId; })
        .sort(function (a, b) { return cmp(txt(b.subidoEl), txt(a.subidoEl)); });
    },

    entrega: function (tareaId, alumnoId) {
      return DB.entregas.filter(function (e) {
        return e.tareaId === tareaId && e.alumnoId === alumnoId;
      })[0] || null;
    },

    entregasDeTarea: function (tareaId) {
      return DB.entregas.filter(function (e) { return e.tareaId === tareaId; });
    },

    /* ------------------------------------------------------------ académico */
    nota: function (alumnoId, evaluacionId) {
      return DB.calificaciones.filter(function (c) {
        return c.alumnoId === alumnoId && c.evaluacionId === evaluacionId;
      })[0] || null;
    },

    promedioMateria: function (alumnoId, materiaId) {
      var suma = 0;
      var pesos = 0;
      Q.evaluacionesDeMateria(materiaId).forEach(function (ev) {
        var c = Q.nota(alumnoId, ev.id);

            (materia ? materia.nombre : 'la materia') + ' a ' + alumno.nombre + '.');
          Store.guardar();
        }
        return bien({ valor: null });
      }

      var n = aNumero(valor);
      if (isNaN(n)) return mal('La calificación debe ser un número entre 0 y 10.');
      if (n < 0 || n > 10) return mal('La calificación debe estar entre 0 y 10.');
      n = Q.red1(n);

      var quien = actorId(materia ? materia.profesorId : 'dir-01');
      var cal = Q.nota(alumnoId, evaluacionId);
      if (cal) {
        cal.valor = n;
        cal.capturadaEl = hoyISO();
        cal.capturadaPor = quien;
      } else {
        DB.calificaciones.push({
          id: Store.uid('cal'),
          alumnoId: alumnoId,
          evaluacionId: evaluacionId,
          valor: n,
          capturadaEl: hoyISO(),
          capturadaPor: quien
        });
      }
      Store.bitacora('Capturó ' + n.toFixed(1) + ' en «' + ev.nombre + '» de ' +
        (materia ? materia.nombre : 'la materia') + ' a ' + alumno.nombre + '.');
      Store.guardar();
      return bien({ valor: n });
    },

    /* ---------------------------------------------------------- evaluaciones */
    crearEvaluacion: function (materiaId, datos) {
      var d = datos || {};
      var materia = Q.materia(materiaId);
      if (!materia) return mal('No se encontró la materia.');
      if (vacio(d.nombre)) return mal('Escribe el nombre de la evaluación.');

      var tipo = texto(d.tipo) || 'parcial';
      if (TIPOS_EVAL.indexOf(tipo) < 0) return mal('El tipo de evaluación no es válido.');

      var peso = aNumero(d.peso);
      if (isNaN(peso)) return mal('Escribe el peso de la evaluación.');
      if (peso > 1) peso = peso / 100;           /* admite 25 además de 0.25 */
      if (peso <= 0 || peso > 1) return mal('El peso debe ser mayor que 0 y hasta 100%.');

      var fecha = esISO(d.fecha) ? texto(d.fecha) : hoyISO();

      var ev = {
        id: Store.uid('ev'),
        materiaId: materiaId,
        nombre: texto(d.nombre),
        tipo: tipo,
        peso: Math.round(peso * 100) / 100,
        fecha: fecha
      };
      DB.evaluaciones.push(ev);
      Store.bitacora('Creó la evaluación «' + ev.nombre + '» en ' + materia.nombre + '.');
      Store.guardar();
      return bien({ id: ev.id });
    },

    actualizarEvaluacion: function (id, datos) {
      var d = datos || {};
      var ev = Q.evaluacion(id);
      if (!ev) return mal('No se encontró la evaluación.');

      if (d.nombre !== undefined) {
        if (vacio(d.nombre)) return mal('El nombre de la evaluación no puede quedar vacío.');
        ev.nombre = texto(d.nombre);
      }
      if (d.tipo !== undefined) {
        var tipo = texto(d.tipo);
        if (TIPOS_EVAL.indexOf(tipo) < 0) return mal('El tipo de evaluación no es válido.');
        ev.tipo = tipo;
      }
      if (d.peso !== undefined) {
        var peso = aNumero(d.peso);
        if (isNaN(peso)) return mal('El peso debe ser un número.');
        if (peso > 1) peso = peso / 100;
        if (peso <= 0 || peso > 1) return mal('El peso debe ser mayor que 0 y hasta 100%.');
        ev.peso = Math.round(peso * 100) / 100;
      }
      if (d.fecha !== undefined) {
        if (!esISO(d.fecha)) return mal('La fecha debe tener el formato AAAA-MM-DD.');
        ev.fecha = texto(d.fecha);
      }

      var materia = Q.materia(ev.materiaId);
      Store.bitacora('Actualizó la evaluación «' + ev.nombre + '» de ' +
        (materia ? materia.nombre : 'una materia') + '.');
      Store.guardar();
      return bien({ id: ev.id });
    },

    eliminarEvaluacion: function (id) {
      var ev = Q.evaluacion(id);
      if (!ev) return mal('No se encontró la evaluación.');
      var materia = Q.materia(ev.materiaId);
      quitar(DB.calificaciones, function (c) { return c.evaluacionId === id; });
      quitar(DB.evaluaciones, function (e) { return e.id === id; });
      Store.bitacora('Eliminó la evaluación «' + ev.nombre + '» de ' +
        (materia ? materia.nombre : 'una materia') + ' y sus calificaciones.');
      Store.guardar();
      return bien();
    },

    /* --------------------------------------------------------------- materias */
    crearMateria: function (datos) {
      var d = datos || {};
      if (vacio(d.nombre)) return mal('Escribe el nombre de la materia.');
      var codigo = texto(d.codigo).toUpperCase();
      if (codigo === '') return mal('Escribe la clave de la materia.');
      var repetida = DB.materias.filter(function (m) {
        return texto(m.codigo).toUpperCase() === codigo;
      })[0];
      if (repetida) return mal('Ya existe una materia con la clave ' + codigo + '.');

      var profesor = Q.profesor(texto(d.profesorId));
      if (!profesor) return mal('Elige una persona docente válida.');

      var grado = Q.grado(texto(d.gradoId));
      if (!grado) return mal('Elige el grado escolar al que pertenece la materia.');

      var creditos = aNumero(d.creditos);
      if (isNaN(creditos) || creditos <= 0) creditos = 5;
      var cupo = aNumero(d.cupo);
      if (isNaN(cupo) || cupo <= 0) cupo = grado.cupo || 24;

      var horario = aHorario(d.horario);
      if (!horario && !vacio(d.dia) && !vacio(d.inicio)) {
        horario = [{ dia: texto(d.dia), inicio: texto(d.inicio), fin: texto(d.fin) }];
      }

      var materia = {
        id: Store.uid('mat'),
        codigo: codigo,
        nombre: texto(d.nombre),
        gradoId: grado.id,
        nivelId: grado.nivelId,
        profesorId: profesor.id,
        creditos: Math.round(creditos),
        aula: texto(d.aula) || grado.aula || 'Por asignar',
        cupo: Math.round(cupo),
        horario: horario || [],
        sesiones: (horario || []).length,
        area: texto(d.area) || 'general',
        descripcion: texto(d.descripcion),
        color: texto(d.color) || colorDe(DB.materias.length),
        estatus: 'activa'
      };
      DB.materias.push(materia);

      /* La materia forma parte del plan del grado: entra todo el grupo. */
      var inscritos = 0;
      Q.alumnosDeGrado(grado.id).forEach(function (a) {
        if (a.estatus === 'baja') return;
        DB.inscripciones.push({ id: Store.uid('ins'), alumnoId: a.id, materiaId: materia.id });
        DB.asistencias.push({
          id: Store.uid('as'), alumnoId: a.id, materiaId: materia.id, presentes: 0, totales: 0
        });
        inscritos++;
      });

      Store.bitacora('Dio de alta la materia ' + materia.codigo + ' — ' + materia.nombre +
        ' en ' + grado.etiqueta + ', con ' + inscritos + ' alumnos inscritos.');
      Store.guardar();
      return bien({ id: materia.id, inscritos: inscritos });
    },

    actualizarMateria: function (id, datos) {
      var d = datos || {};
      var materia = Q.materia(id);
      if (!materia) return mal('No se encontró la materia.');

      if (d.codigo !== undefined) {
        var codigo = texto(d.codigo).toUpperCase();
        if (codigo === '') return mal('La clave de la materia no puede quedar vacía.');
        var choque = DB.materias.filter(function (m) {
          return m.id !== id && texto(m.codigo).toUpperCase() === codigo;
        })[0];
        if (choque) return mal('Ya existe otra materia con la clave ' + codigo + '.');
        materia.codigo = codigo;
      }
      if (d.nombre !== undefined) {
        if (vacio(d.nombre)) return mal('El nombre de la materia no puede quedar vacío.');
        materia.nombre = texto(d.nombre);
      }
      if (d.profesorId !== undefined) {
        var profesor = Q.profesor(texto(d.profesorId));
        if (!profesor) return mal('Elige una persona docente válida.');
        materia.profesorId = profesor.id;
      }
      if (d.creditos !== undefined) {
        var creditos = aNumero(d.creditos);
        if (isNaN(creditos) || creditos <= 0) return mal('Los créditos deben ser un número mayor que 0.');
        materia.creditos = Math.round(creditos);
      }
      if (d.cupo !== undefined) {
        var cupo = aNumero(d.cupo);
        if (isNaN(cupo) || cupo <= 0) return mal('El cupo debe ser un número mayor que 0.');
        var inscritos = Q.alumnosDeMateria(id).length;
        if (cupo < inscritos) return mal('El cupo no puede ser menor que las ' + inscritos + ' personas ya inscritas.');
        materia.cupo = Math.round(cupo);
      }
      if (d.gradoId !== undefined && !vacio(d.gradoId)) {
        var destino = Q.grado(texto(d.gradoId));
        if (!destino) return mal('Ese grado escolar no existe.');
        materia.gradoId = destino.id;
        materia.nivelId = destino.nivelId;
      }
      if (d.aula !== undefined) materia.aula = texto(d.aula);
      if (d.descripcion !== undefined) materia.descripcion = texto(d.descripcion);
      if (d.color !== undefined && !vacio(d.color)) materia.color = texto(d.color);
      if (d.estatus !== undefined) {
        var estatus = texto(d.estatus);
        if (['activa', 'archivada'].indexOf(estatus) < 0) return mal('El estatus de la materia no es válido.');
        materia.estatus = estatus;
      }
      var horario = aHorario(d.horario);
      if (horario) {
        materia.horario = horario;
        materia.sesiones = horario.length;
      }

      Store.bitacora('Actualizó la materia ' + materia.codigo + ' — ' + materia.nombre + '.');
      Store.guardar();
      return bien({ id: materia.id });
    },

    archivarMateria: function (id) {
      var materia = Q.materia(id);
      if (!materia) return mal('No se encontró la materia.');
      if (materia.estatus === 'archivada') return mal('Esa materia ya está archivada.');
      materia.estatus = 'archivada';
      Store.bitacora('Archivó la materia ' + materia.codigo + ' — ' + materia.nombre + '.');
      Store.guardar();
      return bien();
    },

    /* ---------------------------------------------------------- inscripciones */
    inscribir: function (alumnoId, materiaId) {
      var alumno = Q.alumno(alumnoId);
      var materia = Q.materia(materiaId);
      if (!alumno) return mal('No se encontró a esa persona.');
      if (!materia) return mal('No se encontró la materia.');
      if (materia.estatus !== 'activa') return mal('Esa materia está archivada.');
      if (alumno.estatus === 'baja') return mal('No se puede inscribir a alguien dado de baja.');

      var ya = DB.inscripciones.filter(function (i) {
        return i.alumnoId === alumnoId && i.materiaId === materiaId;
      })[0];
      if (ya) return mal(alumno.nombre + ' ya está inscrita o inscrito en ' + materia.nombre + '.');

      var inscritos = Q.alumnosDeMateria(materiaId).length;
      if (materia.cupo && inscritos >= materia.cupo) {
        return mal('La materia ya alcanzó su cupo de ' + materia.cupo + '.');
      }

      DB.inscripciones.push({ id: Store.uid('ins'), alumnoId: alumnoId, materiaId: materiaId });

      var tieneAsistencia = DB.asistencias.filter(function (a) {
        return a.alumnoId === alumnoId && a.materiaId === materiaId;
      })[0];
      if (!tieneAsistencia) {
        DB.asistencias.push({
          id: Store.uid('as'), alumnoId: alumnoId, materiaId: materiaId, presentes: 0, totales: 0
        });
      }

      /* Entregas pendientes sólo de lo que todavía no vence. */
      var hoy = hoyISO();
      DB.tareas.forEach(function (t) {
        if (t.materiaId !== materiaId || texto(t.vence) < hoy) return;
        if (Q.entrega(t.id, alumnoId)) return;
        DB.entregas.push({
          id: Store.uid('ent'), tareaId: t.id, alumnoId: alumnoId,
          estado: 'pendiente', fecha: null, calificacion: null
        });
      });

      Store.bitacora('Inscribió a ' + alumno.nombre + ' en ' + materia.nombre + '.');
      Store.guardar();
      return bien();
    },

    desinscribir: function (alumnoId, materiaId) {
      var alumno = Q.alumno(alumnoId);
      var materia = Q.materia(materiaId);
      if (!alumno) return mal('No se encontró a esa persona.');
      if (!materia) return mal('No se encontró la materia.');

      var fuera = quitar(DB.inscripciones, function (i) {
        return i.alumnoId === alumnoId && i.materiaId === materiaId;
      });
      if (!fuera) return mal(alumno.nombre + ' no está inscrita o inscrito en ' + materia.nombre + '.');

      var evs = {};
      DB.evaluaciones.forEach(function (e) { if (e.materiaId === materiaId) evs[e.id] = true; });
      var tars = {};
      DB.tareas.forEach(function (t) { if (t.materiaId === materiaId) tars[t.id] = true; });

      quitar(DB.calificaciones, function (c) { return c.alumnoId === alumnoId && evs[c.evaluacionId]; });
      quitar(DB.entregas, function (e) { return e.alumnoId === alumnoId && tars[e.tareaId]; });
      quitar(DB.asistencias, function (a) { return a.alumnoId === alumnoId && a.materiaId === materiaId; });

      Store.bitacora('Dio de baja a ' + alumno.nombre + ' de ' + materia.nombre + '.');
      Store.guardar();
      return bien();
    },

    /* --------------------------------------------------------------- alumnos */
    crearAlumno: function (datos) {
      var d = datos || {};
      if (vacio(d.nombre)) return mal('Escribe el nombre completo.');
      if (!vacio(d.email)) {
        if (texto(d.email).indexOf('@') < 0) return mal('El correo no tiene un formato válido.');
      }
      var beca = aNumero(d.becaPct);

      var alumno = {

        foto: null,

        telefono: texto(d.telefono),

          nombre: texto(tutor.nombre) || texto(d.tutorNombre),

        },

      };

      Store.guardar();

    actualizarAlumno: function (id, datos) {
      var d = datos || {};
      var alumno = Q.alumno(id);
      if (!alumno) return mal('No se encontró a esa persona.');

      if (d.nombre !== undefined) {
        if (vacio(d.nombre)) return mal('El nombre no puede quedar vacío.');
        alumno.nombre = texto(d.nombre);
        alumno.iniciales = iniciales(alumno.nombre);
      }
      if (d.email !== undefined) {
        if (vacio(d.email) || texto(d.email).indexOf('@') < 0) return mal('El correo no tiene un formato válido.');
        alumno.email = texto(d.email);
      }
      if (d.telefono !== undefined) alumno.telefono = texto(d.telefono);
      if (d.nacimiento !== undefined) {
        if (!vacio(d.nacimiento) && !esISO(d.nacimiento)) return mal('La fecha de nacimiento debe ser AAAA-MM-DD.');
        alumno.nacimiento = texto(d.nacimiento);
      }
      /* Cambiar de grado rehace la inscripción con el plan del grado nuevo. */
      var cambioGrado = null;
      if (d.gradoId !== undefined && texto(d.gradoId) !== texto(alumno.gradoId)) {
        var destino = Q.grado(texto(d.gradoId));
        if (!destino) return mal('Ese grado escolar no existe.');
        cambioGrado = destino;

      }
      if (d.ingreso !== undefined) {
        if (!esISO(d.ingreso)) return mal('La fecha de ingreso debe ser AAAA-MM-DD.');
        alumno.ingreso = texto(d.ingreso);
      }
      if (d.becaPct !== undefined) {
        var beca = aNumero(d.becaPct);
        if (isNaN(beca) || beca < 0 || beca > 100) return mal('La beca debe estar entre 0 y 100%.');
        alumno.becaPct = Math.round(beca);
      }
      if (d.estatus !== undefined) {
        var estatus = texto(d.estatus);
        if (ESTATUS_ALUMNO.indexOf(estatus) < 0) return mal('El estatus no es válido.');
        alumno.estatus = estatus;
      }
      if (d.notas !== undefined) alumno.notas = texto(d.notas);

      var t = d.tutor;
      if (t || d.tutorNombre !== undefined || d.tutorTelefono !== undefined ||
        d.tutorEmail !== undefined || d.tutorParentesco !== undefined) {
        t = t || {};
        var previo = alumno.tutor || {};
        alumno.tutor = {
          nombre: texto(t.nombre !== undefined ? t.nombre : (d.tutorNombre !== undefined ? d.tutorNombre : previo.nombre)),
          parentesco: texto(t.parentesco !== undefined ? t.parentesco : (d.tutorParentesco !== undefined ? d.tutorParentesco : previo.parentesco)),
          telefono: texto(t.telefono !== undefined ? t.telefono : (d.tutorTelefono !== undefined ? d.tutorTelefono : previo.telefono)),
          email: texto(t.email !== undefined ? t.email : (d.tutorEmail !== undefined ? d.tutorEmail : previo.email))
        };
      }

      if (cambioGrado) {
        var mov = sincronizarGrado(alumno);
        Store.bitacora('Cambió a ' + alumno.nombre + ' a ' + cambioGrado.etiqueta +
          ': ' + mov.altas + ' materias nuevas y ' + mov.bajas + ' dadas de baja.');
      } else {
        Store.bitacora('Actualizó el expediente de ' + alumno.nombre + '.');

      return bien({ id: alumno.id });
