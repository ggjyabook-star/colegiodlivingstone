      if (d.estatus !== undefined) {
        var estatus = texto(d.estatus);
        if (['activo', 'baja'].indexOf(estatus) < 0) return mal('El estatus no es válido.');
        profesor.estatus = estatus;
      }
      var areas = aLista(d.areas);
      if (areas) profesor.areas = areas;
      if (d.perfilPublico !== undefined) profesor.perfilPublico = aBool(d.perfilPublico);

      Store.bitacora('Actualizó el expediente de ' + profesor.nombre + '.');
      Store.guardar();
      return bien({ id: profesor.id });
    },

    actualizarPerfilProfesor: function (id, datos) {
      var d = datos || {};
      var profesor = Q.profesor(id);
      if (!profesor) return mal('No se encontró a esa persona docente.');

      if (d.titulo !== undefined) profesor.titulo = texto(d.titulo);
      if (d.bio !== undefined) {
        if (texto(d.bio).length > 900) return mal('La semblanza no debe pasar de 900 caracteres.');
        profesor.bio = texto(d.bio);
      }
      if (d.telefono !== undefined) profesor.telefono = texto(d.telefono);
      if (d.oficina !== undefined) profesor.oficina = texto(d.oficina);
      if (d.horarioAsesoria !== undefined) profesor.horarioAsesoria = texto(d.horarioAsesoria);
      if (d.perfilPublico !== undefined) profesor.perfilPublico = aBool(d.perfilPublico);

      var areas = aLista(d.areas);
      if (areas) profesor.areas = areas;
      var formacion = aFormacion(d.formacion);
      if (formacion) profesor.formacion = formacion;
      var experiencia = aExperiencia(d.experiencia);
      if (experiencia) profesor.experiencia = experiencia;

      Store.bitacora('Actualizó su perfil público docente.');
      Store.guardar();
      return bien({ id: profesor.id });
    },

    subirFoto: function (rol, id, dataUrl) {
      var persona = Q.persona(rol, id);
      if (!persona) return mal('No se encontró a esa persona.');
      if (dataUrl === null || dataUrl === '' || dataUrl === undefined) {
        persona.foto = null;
        Store.bitacora('Quitó la fotografía de ' + persona.nombre + '.');
        Store.guardar();
        return bien();
      }
      var url = String(dataUrl);
      if (url.indexOf('data:image') !== 0) return mal('El archivo debe ser una imagen.');
      if (url.length > 4000000) return mal('La imagen es demasiado grande: elige una de menos de 3 MB.');
      persona.foto = url;
      Store.bitacora('Actualizó la fotografía de ' + persona.nombre + '.');
      Store.guardar();
      return bien();
    },

    subirCV: function (profesorId, archivo) {
      var profesor = Q.profesor(profesorId);
      if (!profesor) return mal('No se encontró a esa persona docente.');
      if (!archivo || vacio(archivo.nombre)) return mal('Elige un archivo antes de guardar.');
      profesor.cv = {
        nombre: texto(archivo.nombre),
        tamano: texto(archivo.tamano) || '—',
        actualizado: hoyISO(),
        url: archivo.url || null
      };
      Store.bitacora('Subió el currículum «' + profesor.cv.nombre + '».');
      Store.guardar();
      return bien();
    },

    /* ---------------------------------------------------------------- tareas */
    crearTarea: function (materiaId, datos) {
      var d = datos || {};
      var materia = Q.materia(materiaId);
      if (!materia) return mal('No se encontró la materia.');
      if (vacio(d.titulo)) return mal('Escribe el título de la tarea.');
      if (!esISO(d.vence)) return mal('Elige la fecha de entrega (AAAA-MM-DD).');

      var puntos = aNumero(d.puntos);
      if (isNaN(puntos) || puntos <= 0) puntos = 10;

      var tarea = {
        id: Store.uid('tar'),
        materiaId: materiaId,
        titulo: texto(d.titulo),
        descripcion: texto(d.descripcion),
        tipo: texto(d.tipo) || 'tarea',
        vence: texto(d.vence),
        puntos: Math.round(puntos),
        publicadaEl: hoyISO(),
        archivo: d.archivo && !vacio(d.archivo.nombre)
          ? { nombre: texto(d.archivo.nombre), tamano: texto(d.archivo.tamano) || '—' }
          : null
      };
      DB.tareas.push(tarea);

      var inscritos = Q.alumnosDeMateria(materiaId);
      inscritos.forEach(function (a) {
        DB.entregas.push({
          id: Store.uid('ent'),
          tareaId: tarea.id,
          alumnoId: a.id,
          estado: 'pendiente',
          fecha: null,
          calificacion: null
        });
      });

      Store.bitacora('Publicó la tarea «' + tarea.titulo + '» en ' + materia.nombre +
        ' para ' + inscritos.length + ' personas.');
      Store.guardar();
      return bien({ id: tarea.id, entregas: inscritos.length });
    },

    marcarEntrega: function (tareaId, alumnoId, estado, calificacion) {
      var tarea = Q.tarea(tareaId);
      var alumno = Q.alumno(alumnoId);
      if (!tarea) return mal('No se encontró la tarea.');
      if (!alumno) return mal('No se encontró a esa persona.');

      var nuevo = texto(estado);
      if (ESTADOS_ENTREGA.indexOf(nuevo) < 0) return mal('El estado de la entrega no es válido.');

      var cal = calificacion;
      if (cal === '' || cal === null || cal === undefined) {
        cal = null;
      } else {
        var n = aNumero(cal);
        if (isNaN(n)) return mal('La calificación debe ser un número entre 0 y 10.');
        if (n < 0 || n > 10) return mal('La calificación debe estar entre 0 y 10.');
        cal = Q.red1(n);
      }

      var entrega = Q.entrega(tareaId, alumnoId);
      if (!entrega) {
        entrega = {
          id: Store.uid('ent'), tareaId: tareaId, alumnoId: alumnoId,
          estado: 'pendiente', fecha: null, calificacion: null
        };
        DB.entregas.push(entrega);
      }

      entrega.estado = nuevo;
      entrega.calificacion = cal;
      if (nuevo === 'entregada' || nuevo === 'revisada') {
        if (!entrega.fecha) entrega.fecha = hoyISO();
      } else if (nuevo === 'pendiente') {
        entrega.fecha = null;
      }

      Store.bitacora('Marcó como «' + nuevo + '» la entrega de «' + tarea.titulo +
        '» de ' + alumno.nombre + (cal === null ? '' : ' con ' + cal.toFixed(1)) + '.');
      Store.guardar();
      return bien();
    },

    /* ------------------------------------------------------------- materiales */
    subirMaterial: function (materiaId, datos) {
      var d = datos || {};
      var materia = Q.materia(materiaId);
      if (!materia) return mal('No se encontró la materia.');
      if (vacio(d.titulo)) return mal('Escribe el título del material.');

      var tipo = texto(d.tipo) || 'pdf';
      if (TIPOS_MATERIAL.indexOf(tipo) < 0) return mal('El tipo de material no es válido.');

      var material = {
        id: Store.uid('mtr'),
        materiaId: materiaId,
        titulo: texto(d.titulo),
        tipo: tipo,
        descripcion: texto(d.descripcion),
        subidoEl: hoyISO(),
        tamano: texto(d.tamano) || '—',
        autorId: actorId(materia.profesorId),
        url: d.url || null
      };
      DB.materiales.push(material);
      Store.bitacora('Subió «' + material.titulo + '» a ' + materia.nombre + '.');
      Store.guardar();
      return bien({ id: material.id });
    },

    eliminarMaterial: function (id) {
      var material = DB.materiales.filter(function (m) { return m.id === id; })[0];
      if (!material) return mal('No se encontró el material.');
      var materia = Q.materia(material.materiaId);
      quitar(DB.materiales, function (m) { return m.id === id; });
      Store.bitacora('Eliminó «' + material.titulo + '» de ' +
        (materia ? materia.nombre : 'una materia') + '.');
      Store.guardar();
      return bien();
    },

    /* ----------------------------------------------------------------- avisos */
    publicarAviso: function (datos) {
      var d = datos || {};
      if (vacio(d.titulo)) return mal('Escribe el título del aviso.');
      if (vacio(d.cuerpo)) return mal('Escribe el contenido del aviso.');

      var ambito = texto(d.ambito) || 'escuela';
      if (['escuela', 'materia'].indexOf(ambito) < 0) return mal('El ámbito del aviso no es válido.');

      var materiaId = null;
      if (ambito === 'materia') {
        var materia = Q.materia(texto(d.materiaId));
        if (!materia) return mal('Elige la materia del aviso.');
        materiaId = materia.id;
      }

      var prioridad = texto(d.prioridad) || 'normal';
      if (['normal', 'alta'].indexOf(prioridad) < 0) prioridad = 'normal';

      var s = Sesion.actual();
      var aviso = {
        id: Store.uid('av'),
        autorId: s ? s.id : DB.direccion.id,
        autorRol: s ? s.rol : 'direccion',
        ambito: ambito,
        materiaId: materiaId,
        titulo: texto(d.titulo),
        cuerpo: texto(d.cuerpo),
        fecha: hoyISO(),
        prioridad: prioridad
      };
      DB.avisos.unshift(aviso);
      Store.bitacora('Publicó el aviso «' + aviso.titulo + '».');
      Store.guardar();
      return bien({ id: aviso.id });
    },

    /* ------------------------------------------------------------------ pagos */
    registrarPago: function (pagoId, datos) {
      var d = datos || {};
      var pago = DB.pagos.filter(function (p) { return p.id === pagoId; })[0];
      if (!pago) return mal('No se encontró el pago.');
      if (pago.estado === 'pagado') return mal('Ese pago ya está registrado como pagado.');

      pago.estado = 'pagado';
      pago.pagadoEl = hoyISO();
      pago.metodo = texto(d.metodo) || 'Transferencia SPEI';
      if (!vacio(d.referencia)) pago.referencia = texto(d.referencia);
      pago.recargo = 0;

      var alumno = Q.alumno(pago.alumnoId);
      Store.bitacora('Registró el pago de «' + pago.concepto + '»' +
        (alumno ? ' de ' + alumno.nombre : '') + '.');
      Store.guardar();
      return bien({ id: pago.id });
    },

    generarColegiaturas: function (periodo) {
      var per = texto(periodo);
      var m = /^(\d{4})-(\d{2})([a-z]?)$/.exec(per);
      if (!m) return mal('El periodo debe tener el formato AAAA-MM.');
      var mesIndice = parseInt(m[2], 10) - 1;
      if (mesIndice < 0 || mesIndice > 11) return mal('El mes del periodo no es válido.');

      var concepto = 'Colegiatura de ' + MESES[mesIndice] + ' ' + m[1];
      var vence = m[1] + '-' + m[2] + '-05';
      var base = Number(DB.escuela.colegiaturaMensual) || 0;
      if (base <= 0) return mal('Define primero la colegiatura mensual en los datos de la escuela.');

      var generados = 0;
      Q.alumnosActivos().forEach(function (a) {
        var ya = DB.pagos.filter(function (p) {
          return p.alumnoId === a.id && texto(p.periodo) === per;
        })[0];
        if (ya) return;
        /* Cada nivel tiene su propia cuota; la beca se aplica sobre ella. */
        DB.pagos.push({
          id: Store.uid('pag'),
          alumnoId: a.id,
          concepto: concepto,
          periodo: per,
          monto: Q.colegiaturaDe(a.id),
          vence: vence,
          estado: 'pendiente',
          pagadoEl: null,
          metodo: null,
          referencia: 'TLV-' + per.replace('-', '') + '-' + texto(a.matricula).replace('L-', ''),
          recargo: 0
        });
        generados++;
      });

      if (!generados) return mal('Ese periodo ya está generado para todas las personas activas.');
      Store.bitacora('Generó ' + generados + ' recibos de «' + concepto + '».');
      Store.guardar();
      return bien({ generados: generados, concepto: concepto });
    },

    /* ---------------------------------------------------------------- reseñas */
    crearResena: function (datos) {
      var d = datos || {};
      var profesor = Q.profesor(texto(d.profesorId));
      var alumno = Q.alumno(texto(d.alumnoId));
      if (!profesor) return mal('No se encontró a esa persona docente.');
      if (!alumno) return mal('No se encontró a esa persona inscrita.');
      if (Q.resenaDe(alumno.id, profesor.id)) {
        return mal('Ya escribiste una reseña para ' + profesor.nombre + '.');
      }

      var estrellas = aNumero(d.estrellas);
      if (isNaN(estrellas)) return mal('Elige cuántas estrellas das.');
      estrellas = Math.round(estrellas);
      if (estrellas < 1 || estrellas > 5) return mal('Las estrellas van de 1 a 5.');

      var comentario = texto(d.comentario);
      if (comentario.length < 10) return mal('Escribe un comentario de al menos 10 caracteres.');
      if (comentario.length > 800) return mal('El comentario no debe pasar de 800 caracteres.');

      var materiaId = null;
      if (!vacio(d.materiaId)) {
        var materia = Q.materia(texto(d.materiaId));
        if (!materia) return mal('Elige una materia válida.');
        materiaId = materia.id;
      }

      var entrada = d.criterios || d;
      var criterios = {};
      var errorCriterio = null;
      CRITERIOS.forEach(function (k) {
        var v = aNumero(entrada[k]);
        if (isNaN(v)) v = estrellas;
        v = Math.round(v);
        if (v < 1 || v > 5) errorCriterio = 'Los criterios se califican del 1 al 5.';
        criterios[k] = v;
      });
      if (errorCriterio) return mal(errorCriterio);

      var resena = {
        id: Store.uid('res'),
        profesorId: profesor.id,
        alumnoId: alumno.id,
        materiaId: materiaId,
        estrellas: estrellas,
        criterios: criterios,
        comentario: comentario,
        fecha: hoyISO(),
        estado: 'pendiente',
        anonima: aBool(d.anonima),
        respuesta: null
      };
      DB.resenas.push(resena);
      Store.bitacora('Envió una reseña de ' + profesor.nombre + '; queda pendiente de moderación.');
      Store.guardar();
      return bien({ id: resena.id });
    },

    moderarResena: function (id, estado) {
      var resena = DB.resenas.filter(function (r) { return r.id === id; })[0];
      if (!resena) return mal('No se encontró la reseña.');
      var nuevo = texto(estado);
      if (['publica', 'oculta'].indexOf(nuevo) < 0) return mal('Sólo se puede publicar u ocultar una reseña.');
      if (resena.estado === nuevo) return mal('La reseña ya está en ese estado.');
      resena.estado = nuevo;
      var profesor = Q.profesor(resena.profesorId);
      Store.bitacora((nuevo === 'publica' ? 'Publicó' : 'Ocultó') + ' una reseña de ' +
        (profesor ? profesor.nombre : 'una persona docente') + '.');
      Store.guardar();
      return bien();
    },

    responderResena: function (id, texto_) {
      var resena = DB.resenas.filter(function (r) { return r.id === id; })[0];
      if (!resena) return mal('No se encontró la reseña.');
      var cuerpo = texto(texto_);
      if (cuerpo === '') return mal('Escribe una respuesta antes de enviarla.');
      if (cuerpo.length > 600) return mal('La respuesta no debe pasar de 600 caracteres.');
      resena.respuesta = { texto: cuerpo, fecha: hoyISO() };
      var profesor = Q.profesor(resena.profesorId);
      Store.bitacora('Respondió una reseña de ' +
        (profesor ? profesor.nombre : 'una persona docente') + '.');
      Store.guardar();
      return bien();
    },

    /* ---------------------------------------------------------------- escuela */
    actualizarEscuela: function (datos) {
      var d = datos || {};
      var cadenas = ['nombre', 'nombreLargo', 'lema', 'ciclo', 'direccion', 'ciudad', 'telefono',
        'telefono2', 'whatsapp', 'email', 'buzon', 'sitio', 'horarioAtencion', 'acercaDe',
        'mision', 'vision', 'excelencia', 'sello', 'diasHabiles', 'moneda'];
      if (d.nombre !== undefined && vacio(d.nombre)) return mal('El nombre de la escuela no puede quedar vacío.');

      if (d.colegiaturaMensual !== undefined) {
        var cuota = aNumero(d.colegiaturaMensual);
        if (isNaN(cuota) || cuota <= 0) return mal('La colegiatura debe ser un número mayor que 0.');
        DB.escuela.colegiaturaMensual = Math.round(cuota);
      }
      if (d.recargoPct !== undefined) {
        var recargo = aNumero(d.recargoPct);
        if (isNaN(recargo) || recargo < 0 || recargo > 50) return mal('El recargo debe estar entre 0 y 50%.');
        DB.escuela.recargoPct = Math.round(recargo);
      }
      if (d.fundacion !== undefined) {
        var anio = aNumero(d.fundacion);
        if (isNaN(anio) || anio < 1800 || anio > 2100) return mal('El año de fundación no es válido.');
        DB.escuela.fundacion = Math.round(anio);
      }
      cadenas.forEach(function (k) {
        if (d[k] !== undefined) DB.escuela[k] = texto(d[k]);
      });

      Store.bitacora('Actualizó los datos generales del colegio.');
      Store.guardar();
      return bien();
    },

    /* ------------------------------------------------------------- asistencia */
    actualizarAsistencia: function (alumnoId, materiaId, presentes, totales) {
      var alumno = Q.alumno(alumnoId);
      var materia = Q.materia(materiaId);
      if (!alumno) return mal('No se encontró a esa persona.');
      if (!materia) return mal('No se encontró la materia.');

      var p = aNumero(presentes);
      var t = aNumero(totales);
      if (isNaN(p) || isNaN(t)) return mal('Las sesiones deben ser números.');
      p = Math.round(p);
      t = Math.round(t);
      if (p < 0 || t < 0) return mal('Las sesiones no pueden ser negativas.');
      if (p > t) return mal('Las asistencias no pueden ser más que las sesiones impartidas.');

      var fila = DB.asistencias.filter(function (a) {
        return a.alumnoId === alumnoId && a.materiaId === materiaId;
      })[0];
      if (fila) {
        fila.presentes = p;
        fila.totales = t;
      } else {
        DB.asistencias.push({
          id: Store.uid('as'), alumnoId: alumnoId, materiaId: materiaId, presentes: p, totales: t
        });
      }

      Store.bitacora('Ajustó la asistencia de ' + alumno.nombre + ' en ' + materia.nombre +
        ' a ' + p + ' de ' + t + '.');
      Store.guardar();
      return bien({ pct: t > 0 ? Math.round(p / t * 100) : 0 });
    }
  };

  /* Ninguna mutación lanza: un error inesperado se devuelve como {ok:false}. */
  Object.keys(api).forEach(function (nombre) {
    var original = api[nombre];
    api[nombre] = function () {
      try {
        var r = original.apply(api, arguments);
        return (r && typeof r === 'object') ? r : { ok: true };
      } catch (e) {
        return { ok: false, error: 'No se pudo completar la operación. Inténtalo de nuevo.' };
      }
    };
  });

  return api;
})();

/* ------------------------------------------------------------ componentes -- */
const U = (function () {

  var contador = 0;
  function nuevoId(pfx) { contador += 1; return (pfx || 'u') + '-' + contador; }
  function r2(n) { return Math.round(n * 100) / 100; }

  var MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio',
    'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
  var MESES_C = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
  var DIAS = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];

  /* --- escapado ---------------------------------------------------------- */

  /* Estricto: para atributos y para cualquier texto que venga de DB. */
  function esc(v) {
    if (v === null || v === undefined) return '';
    return String(v)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  /* Para nodos de texto: idempotente, no vuelve a escapar entidades ya escritas. */
  function escT(v) {
    if (v === null || v === undefined) return '';
    return String(v)
      .replace(/&(?!(?:[a-zA-Z][a-zA-Z0-9]{1,8}|#\d{1,6}|#x[0-9a-fA-F]{1,6});)/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }

  function attr(obj) {
    if (!obj) return '';
    var salida = [];
    Object.keys(obj).forEach(function (k) {
      var v = obj[k];
      if (v === null || v === undefined || v === false) return;
      if (v === true) { salida.push(k); return; }
      if (typeof v === 'object') {
        /* Comillas simples + entidades: data-args sobrevive cualquier contenido. */
        salida.push(k + "='" + esc(JSON.stringify(v)) + "'");
      } else {
        salida.push(k + '="' + esc(v) + '"');
      }
    });
    return salida.length ? ' ' + salida.join(' ') : '';
  }

  /* --- iconos ------------------------------------------------------------ */

  function icono(nombre, tam) {
    var d = Object.prototype.hasOwnProperty.call(ICONOS, nombre) ? ICONOS[nombre] : null;
    if (typeof d !== 'string') d = ICONOS.punto;
    var t = tam || 17;
    return '<svg width="' + t + '" height="' + t + '" viewBox="0 0 24 24" fill="none" ' +
      'stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" ' +
      'aria-hidden="true" focusable="false">' + d + '</svg>';
  }

  /* --- identidad --------------------------------------------------------- */

  function iniciales(nombre) {
    var partes = String(nombre || '').trim().split(/\s+/).filter(function (p) {
      return p && !/^(mtro|mtra|lic|dr|dra|ing|prof|profa|arq|c)\.?$/i.test(p);
    });
    if (!partes.length) return '—';
    /* Con nombre compuesto (4 palabras o más) toma nombre + primer apellido. */
    var segunda = partes.length >= 4 ? partes[2] : partes[1];
    return (partes[0].charAt(0) + (segunda ? segunda.charAt(0) : '')).toUpperCase();
  }

  function avatar(persona, tam) {
    var cls = 'avatar' + (tam ? ' avatar-' + esc(tam) : '');
    if (!persona) {
      return '<span class="' + cls + '" style="background:var(--superficie-3);color:var(--tinta-3)" ' +
        'aria-hidden="true">—</span>';
    }
    if (persona.foto) {
      return '<span class="' + cls + '" title="' + esc(persona.nombre) + '">' +
        '<img src="' + esc(persona.foto) + '" alt=""></span>';
    }
    var ini = persona.iniciales || iniciales(persona.nombre);
    var fondo = persona.color || 'var(--marca)';
    return '<span class="' + cls + '" style="background:' + esc(fondo) + '" ' +
      'title="' + esc(persona.nombre) + '">' + escT(ini) + '</span>';
  }

  /* --- insignias --------------------------------------------------------- */

  function badge(texto, variante) {
    return '<span class="badge badge-' + esc(variante || 'neutro') + '">' + escT(texto) + '</span>';
  }

  function chip(texto, variante) {
    var color = { ok: 'var(--ok)', aviso: 'var(--aviso)', crit: 'var(--crit)',
      info: 'var(--info)', marca: 'var(--marca-ink)' }[variante];

  /* --- números, fechas --------------------------------------------------- */

    var num = Number(n);
    if (!isFinite(num)) num = 0;

      if (dias === 1) return 'mañana';

  function notaTexto(n) {

  function panel(o) {
    o = o || {};
    var cab = '';
    if (o.titulo || o.sub || o.acciones) {
      cab = '<div class="panel-cab"><div>' +
        (o.titulo ? '<h3 class="panel-tit">' + escT(o.titulo) + '</h3>' : '') +
        (o.sub ? '<p class="panel-sub">' + escT(o.sub) + '</p>' : '') +
        '</div>' +
        (o.acciones ? '<div class="panel-acc">' + juntar(o.acciones) + '</div>' : '') +
        '</div>';
    }
    return '<div class="panel' + (o.clase ? ' ' + esc(o.clase) : '') + '">' + cab +
      '<div class="panel-cuerpo' + (o.sinRelleno ? ' sin-relleno' : '') + '">' + (o.cuerpo || '') + '</div>' +
      (o.pie ? '<div class="panel-pie">' + o.pie + '</div>' : '') +
      '</div>';
  }

  function juntar(v) {
    if (v === null || v === undefined) return '';
    return Array.isArray(v) ? v.join('') : String(v);
  }

  function vacio(o) {
    o = o || {};
    return '<div class="vacio">' +
      '<div class="ico">' + icono(o.icono || 'portapapeles', 22) + '</div>' +
      '<h4>' + escT(o.titulo || 'Sin información') + '</h4>' +
      (o.texto ? '<p>' + escT(o.texto) + '</p>' : '') +
      (o.accion ? '<div class="mt-2">' + juntar(o.accion) + '</div>' : '') +
      '</div>';
  }

  function kpi(o) {
    o = o || {};
    return '<div class="kpi' + (o.variante ? ' v-' + esc(o.variante) : '') +
      (o.clase ? ' ' + esc(o.clase) : '') + '">' +
      '<div class="kpi-etiqueta">' + (o.icono ? icono(o.icono, 13) : '') +
      '<span>' + escT(o.etiqueta) + '</span></div>' +
      '<div class="kpi-valor">' + (o.valor === null || o.valor === undefined ? '—' : o.valor) + '</div>' +
      (o.sub ? '<div class="kpi-sub">' + escT(o.sub) + '</div>' : '') +
      (o.pie ? '<div class="kpi-pie">' + o.pie + '</div>' : '') +
      '</div>';
  }

  function progreso(pct, variante) {
    var p = Number(pct);
    if (!isFinite(p)) p = 0;
    p = Math.max(0, Math.min(100, p));
    return '<div class="progreso" role="progressbar" aria-valuenow="' + Math.round(p) +
      '" aria-valuemin="0" aria-valuemax="100">' +
      '<div class="progreso-barra' + (variante ? ' v-' + esc(variante) : '') +
      '" style="width:' + r2(p) + '%"></div></div>';
  }

  /* --- tabla ------------------------------------------------------------- */

  function claseCol(c, esCelda) {
    var l = [];
    var a = c.align || '';
    if (a === 'der' || a === 'right' || a === 'num') l.push('num');
    else if (a === 'centro' || a === 'center') l.push('centro-col');
    if (esCelda && c.mono) l.push('mono');
    if (c.clase) l.push(c.clase);
    return l.join(' ');
  }

  function tabla(o) {
    o = o || {};
    var columnas = o.columnas || [];
    var filas = o.filas || [];
    if (!filas.length || !columnas.length) {
      return vacio({ icono: o.iconoVacio || 'portapapeles', titulo: 'Sin registros', texto: o.vacio || '' });
    }
    var cabeza = columnas.map(function (c) {
      var cls = claseCol(c, false);
      return '<th' + (cls ? ' class="' + cls + '"' : '') +
        (c.ancho ? ' style="width:' + esc(c.ancho) + '"' : '') + '>' + escT(c.titulo) + '</th>';
    }).join('');

    var cuerpo = filas.map(function (f) {
      var celdas = columnas.map(function (c) {
        var v = f[c.clave];
        var cls = claseCol(c, true);
        var contenido = c.html ? (v === null || v === undefined ? '' : v) : escT(v);
        return '<td' + (cls ? ' class="' + cls + '"' : '') + '>' + contenido + '</td>';
      }).join('');
      return '<tr' + (f._clase ? ' class="' + esc(f._clase) + '"' : '') + attr(f._attr) + '>' +
        celdas + '</tr>';
    }).join('');

    return '<div class="tabla-envoltura"><table class="tabla' + (o.clase ? ' ' + esc(o.clase) : '') + '">' +
      '<thead><tr>' + cabeza + '</tr></thead><tbody>' + cuerpo + '</tbody></table></div>';
  }

  /* --- estrellas --------------------------------------------------------- */

  /* `total` es el tamaño de la escala: cuántas estrellas se pintan (5 por
     omisión). Quien necesite mostrar el número de reseñas lo escribe aparte. */
  function estrellas(valor, o) {
    o = o || {};
    var escala = Math.round(Number(o.total));
    if (!isFinite(escala) || escala < 1) escala = 5;
    if (escala > 10) escala = 10;
    var v = Number(valor);
    if (!isFinite(v)) v = 0;
    v = Math.max(0, Math.min(escala, v));
    var llenas = Math.round(v);
    var piezas = '';
    for (var i = 1; i <= escala; i++) {
      piezas += '<span' + (i <= llenas ? ' class="estrella-llena"' : '') + '>' + icono('estrella', 15) + '</span>';
    }
    return '<span class="estrellas' + (o.tam === 'lg' ? ' tam-lg' : '') + '" role="img" ' +
      'aria-label="' + esc(v.toFixed(1) + ' de ' + escala) + '">' +
      piezas + (o.sinValor ? '' : '<span class="valor">' + escT(v.toFixed(1)) + '</span>') + '</span>';
  }

  function estrellasInput(nombre, valor) {
    var base = nuevoId('est');
    var v = Number(valor) || 0;
    var piezas = '';
    for (var n = 5; n >= 1; n--) {
      var id = base + '-' + n;
      piezas += '<input type="radio" id="' + id + '" name="' + esc(nombre) + '" value="' + n + '"' +
        (n === v ? ' checked' : '') + '>' +
        '<label for="' + id + '" title="' + n + ' de 5" aria-label="' + n + ' de 5">' +
        icono('estrella', 26) + '</label>';
    }
    return '<div class="estrellas-input" role="radiogroup" aria-label="Calificación">' + piezas + '</div>';
  }

  /* --- gráficas ---------------------------------------------------------- */

  function sinDatos(o, texto) {
    return vacio({
      icono: 'grafica',
      titulo: (o && o.vacio) || 'Sin datos que graficar',
      texto: texto || 'Todavía no hay información suficiente para esta gráfica.'
    });
  }

  function abreSvg(w, h, etiqueta) {
    return '<svg class="grafica" viewBox="0 0 ' + r2(w) + ' ' + r2(h) + '" ' +
      'preserveAspectRatio="xMidYMid meet" role="img" aria-label="' + esc(etiqueta) + '">';
  }

  /* Barras horizontales con etiqueta a la izquierda y valor al final. */
  function barras(o) {
    o = o || {};
    var series = (o.series || []).filter(Boolean);
    if (!series.length) return sinDatos(o);

    var valores = series.map(function (s) { return Number(s.valor) || 0; });
    var conMeta = typeof o.meta === 'number' && isFinite(o.meta);
    var max = Number(o.max);
    if (!isFinite(max) || max <= 0) {
      max = Math.max.apply(null, valores.concat(conMeta ? [Number(o.meta)] : []));
    }
    if (!isFinite(max) || max <= 0) max = 1;

    var textos = valores.map(function (v) { return fmt(v, o.formato); });
    var anchoValor = Math.max(38, Math.max.apply(null, textos.map(function (t) { return t.length; })) * 6.2 + 8);
    var W = 340;
    var anchoEtiqueta = 94;
    var x0 = anchoEtiqueta + 8;
    var largoMax = W - anchoValor - x0;
    if (largoMax < 60) { anchoEtiqueta = 70; x0 = 78; largoMax = W - anchoValor - x0; }

    var padTop = 6;
    var padBot = conMeta ? 20 : 6;
    var altoFila = 26;
    var H = padTop + series.length * altoFila + padBot;
    if (o.alto && Number(o.alto) > padTop + padBot + series.length * 14) {
      H = Number(o.alto);
      altoFila = (H - padTop - padBot) / series.length;
    }

    var cuerpo = series.map(function (s, i) {
      var cy = padTop + i * altoFila + altoFila / 2;
      var w = Math.max(0, Math.min(1, valores[i] / max)) * largoMax;
      var et = recorta(s.etiqueta, 22);
      var ajuste = et.length * 5.7 > anchoEtiqueta
        ? ' textLength="' + anchoEtiqueta + '" lengthAdjust="spacingAndGlyphs"' : '';
      return '<rect x="' + x0 + '" y="' + r2(cy - 6) + '" width="' + r2(largoMax) + '" height="12" rx="3" ' +
          'fill="var(--superficie-3)"/>' +
        (w > 0.6 ? '<rect x="' + x0 + '" y="' + r2(cy - 6) + '" width="' + r2(w) + '" height="12" rx="3" ' +
          'fill="' + esc(colorSerie(i, s.color)) + '"/>' : '') +
        '<text x="' + anchoEtiqueta + '" y="' + r2(cy + 3.8) + '" text-anchor="end"' + ajuste + '>' +
          escT(et) + '</text>' +
        /* El valor va al final del carril, no de la barra: así nunca lo cruza la línea de meta. */
        '<text class="val" x="' + r2(x0 + largoMax + 7) + '" y="' + r2(cy + 3.8) + '">' + escT(textos[i]) + '</text>';
    }).join('');

    var meta = '';
    if (conMeta) {
      var xm = r2(x0 + Math.max(0, Math.min(1, Number(o.meta) / max)) * largoMax);
      meta = '<line class="meta" x1="' + xm + '" y1="' + padTop + '" x2="' + xm + '" y2="' + r2(H - padBot + 3) + '"/>' +
        '<text x="' + xm + '" y="' + r2(H - 4) + '" text-anchor="middle">meta ' + escT(fmt(o.meta, o.formato)) + '</text>';
    }

    var resumen = series.map(function (s, i) { return recorta(s.etiqueta, 24) + ': ' + textos[i]; }).join(', ');
    return abreSvg(W, H, 'Gráfica de barras. ' + resumen) + cuerpo + meta + '</svg>';
  }

  /* Columnas verticales con eje inferior. */
  function columnas(o) {
    o = o || {};
    var series = (o.series || []).filter(Boolean);
    if (!series.length) return sinDatos(o);

    var valores = series.map(function (s) { return Number(s.valor) || 0; });
    var max = Number(o.max);
    if (!isFinite(max) || max <= 0) max = Math.max.apply(null, valores);
    if (!isFinite(max) || max <= 0) max = 1;

    var W = 340, padL = 10, padR = 10, padT = 22;
    var n = series.length;
    var hueco = (W - padL - padR) / n;
    var etiquetas = series.map(function (s) { return String(s.etiqueta === null || s.etiqueta === undefined ? '' : s.etiqueta); });
    var largoMax = Math.max.apply(null, etiquetas.map(function (e) { return e.length; }));
    var rotar = largoMax * 5.6 > hueco - 4;
    var padBot = rotar ? 46 : 26;
    var H = Number(o.alto) > 90 ? Number(o.alto) : 190;
    var base = H - padBot;
    var util = base - padT;
    var ancho = Math.min(34, hueco * 0.62);

    var cuerpo = series.map(function (s, i) {
      var cx = padL + i * hueco + hueco / 2;
      var alto = Math.max(0, Math.min(1, valores[i] / max)) * util;
      var y = base - alto;
      var texto = fmt(valores[i], o.formato);
      var et = rotar ? recorta(etiquetas[i], 13) : etiquetas[i];
      var etiqueta = rotar
        ? '<text x="' + r2(cx) + '" y="' + r2(base + 13) + '" text-anchor="end" ' +
          'transform="rotate(-38 ' + r2(cx) + ' ' + r2(base + 13) + ')">' + escT(et) + '</text>'
        : '<text x="' + r2(cx) + '" y="' + r2(base + 15) + '" text-anchor="middle">' + escT(et) + '</text>';
      return (alto > 0.6 ? '<rect x="' + r2(cx - ancho / 2) + '" y="' + r2(y) + '" width="' + r2(ancho) +
          '" height="' + r2(alto) + '" rx="3" fill="' + esc(colorSerie(i, s.color)) + '"/>' : '') +
        /* El valor sólo se pinta si cabe dentro del hueco de la columna. */
        (texto.length * 5.8 <= hueco ? '<text class="val" x="' + r2(cx) + '" y="' + r2(y - 6) +
          '" text-anchor="middle">' + escT(texto) + '</text>' : '') + etiqueta;
    }).join('');

    var eje = '<line class="eje" x1="' + padL + '" y1="' + r2(base) + '" x2="' + (W - padR) + '" y2="' + r2(base) + '"/>';
    var resumen = series.map(function (s, i) { return etiquetas[i] + ': ' + fmt(valores[i], o.formato); }).join(', ');
    return abreSvg(W, H, 'Gráfica de columnas. ' + resumen) + eje + cuerpo + '</svg>';
  }

  /* Línea con área en degradado, rejilla y puntos marcados. */
  function linea(o) {
    o = o || {};
    var pts = (o.puntos || []).filter(Boolean);
    if (!pts.length) return sinDatos(o);

    var vals = pts.map(function (p) { return Number(p.valor) || 0; });
    var mx = (o.max !== null && o.max !== undefined && isFinite(o.max)) ? Number(o.max) : Math.max.apply(null, vals);
    var mn = (o.min !== null && o.min !== undefined && isFinite(o.min)) ? Number(o.min) : Math.min.apply(null, vals);
    if (!isFinite(mx)) mx = 1;
    if (!isFinite(mn)) mn = 0;
    if (mx - mn < 0.0001) { mx = mx + 1; mn = Math.max(0, mn - 1); }
    if (mx - mn < 0.0001) mx = mn + 1;

    var etiquetasY = [0, 1, 2, 3].map(function (k) { return fmt(mn + (mx - mn) * k / 3, o.formato); });
    var padL = Math.max(28, Math.max.apply(null, etiquetasY.map(function (t) { return t.length; })) * 6.2 + 10);
    var W = 360, padR = 14, padT = 18, padBot = 26;
    var H = Number(o.alto) > 90 ? Number(o.alto) : 180;
    var base = H - padBot, techo = padT;
    var util = W - padL - padR;

    function px(i) { return pts.length === 1 ? padL + util / 2 : padL + util * i / (pts.length - 1); }
    function py(v) { return base - ((v - mn) / (mx - mn)) * (base - techo); }

    var rejilla = [0, 1, 2, 3].map(function (k) {
      var y = r2(py(mn + (mx - mn) * k / 3));
      return '<line class="rejilla-lin" x1="' + padL + '" y1="' + y + '" x2="' + (W - padR) + '" y2="' + y + '"/>' +
        '<text x="' + r2(padL - 7) + '" y="' + r2(y + 3.6) + '" text-anchor="end">' + escT(etiquetasY[k]) + '</text>';
    }).join('');

    var trazo = pts.map(function (p, i) {
      return (i ? 'L' : 'M') + r2(px(i)) + ' ' + r2(py(vals[i]));
    }).join(' ');
    var area = trazo + ' L' + r2(px(pts.length - 1)) + ' ' + r2(base) + ' L' + r2(px(0)) + ' ' + r2(base) + ' Z';

    var idGrad = nuevoId('degradado');
    var defs = '<defs><linearGradient id="' + idGrad + '" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0" stop-color="var(--marca)" stop-opacity="0.30"/>' +
      '<stop offset="1" stop-color="var(--marca)" stop-opacity="0"/></linearGradient></defs>';

    var meta = '';
    if (typeof o.meta === 'number' && isFinite(o.meta) && o.meta >= mn && o.meta <= mx) {
      var ym = r2(py(Number(o.meta)));
      meta = '<line class="meta" x1="' + padL + '" y1="' + ym + '" x2="' + (W - padR) + '" y2="' + ym + '"/>';
    }

    var ultimo = pts.length - 1;
    var marcas = pts.map(function (p, i) {
      var x = r2(px(i)), y = r2(py(vals[i]));
      var esUlt = i === ultimo;
      return '<circle cx="' + x + '" cy="' + y + '" r="' + (esUlt ? 4.6 : 3) + '" ' +
        'fill="' + (esUlt ? 'var(--marca)' : 'var(--superficie)') + '" stroke="var(--marca)" stroke-width="1.6"/>';
    }).join('');

    var xUlt = px(ultimo);
    var valorUlt = '<text class="val" x="' + r2(ultimo === 0 ? xUlt : xUlt + 2) + '" y="' + r2(py(vals[ultimo]) - 10) +
      '" text-anchor="' + (ultimo === 0 ? 'middle' : 'end') + '">' + escT(fmt(vals[ultimo], o.formato)) + '</text>';

    var ejeX = pts.map(function (p, i) {
      if (pts.length > 9 && i % 2 === 1) return '';
      return '<text x="' + r2(px(i)) + '" y="' + r2(H - 8) + '" text-anchor="middle">' +
        escT(recorta(p.etiqueta, 9)) + '</text>';
    }).join('');

    var resumen = pts.map(function (p, i) { return recorta(p.etiqueta, 14) + ': ' + fmt(vals[i], o.formato); }).join(', ');
    /* Con un solo punto no hay trazo ni área que dibujar: sólo el marcador. */
    var trazos = pts.length < 2 ? '' :
      '<path d="' + area + '" fill="url(#' + idGrad + ')" stroke="none"/>' +
      '<path d="' + trazo + '" fill="none" stroke="var(--marca)" stroke-width="2.2" ' +
      'stroke-linecap="round" stroke-linejoin="round"/>';

    return abreSvg(W, H, 'Gráfica de línea. ' + resumen) + defs + rejilla + meta +
      trazos + marcas + valorUlt + ejeX + '</svg>';
  }

  /* Anillo de progreso. */
  function anillo(pct, o) {
    o = o || {};
    var p = Number(pct);
    if (!isFinite(p)) p = 0;
    p = Math.max(0, Math.min(100, p));
    var tam = Number(o.tam) > 0 ? Number(o.tam) : 132;
    var radio = 52, circ = 2 * Math.PI * radio;
    var lleno = circ * p / 100;
    var etiqueta = (o.etiqueta === null || o.etiqueta === undefined) ? Math.round(p) + '%' : String(o.etiqueta);
    var yValor = o.sub ? 62 : 70;

    return '<svg class="grafica" viewBox="0 0 128 128" preserveAspectRatio="xMidYMid meet" ' +
      'style="width:' + tam + 'px;height:' + tam + 'px;margin:0 auto" role="img" ' +
      'aria-label="' + esc(etiqueta + (o.sub ? '. ' + o.sub : '')) + '">' +
      '<circle cx="64" cy="64" r="' + radio + '" fill="none" stroke="var(--superficie-3)" stroke-width="11"/>' +
      (p > 0 ? '<circle cx="64" cy="64" r="' + radio + '" fill="none" stroke="' + colorVar(o.variante) + '" ' +
        'stroke-width="11" stroke-linecap="round" stroke-dasharray="' + r2(lleno) + ' ' + r2(circ - lleno) + '" ' +
        'transform="rotate(-90 64 64)"/>' : '') +
      '<text x="64" y="' + yValor + '" text-anchor="middle" ' +
        'style="fill:var(--tinta);font-family:var(--f-display);font-size:27px;font-weight:600">' +
        escT(etiqueta) + '</text>' +
      (o.sub ? '<text x="64" y="82" text-anchor="middle" style="font-size:11px">' + escT(recorta(o.sub, 22)) + '</text>' : '') +
      '</svg>';
  }

  /* Dona con hueco al centro y leyenda debajo. */
  function dona(o) {
    o = o || {};
    var todos = (o.segmentos || []).filter(Boolean);
    if (!todos.length) return sinDatos(o);
    var centro = o.centro || {};
    var tam = Number(o.tam) > 0 ? Number(o.tam) : 156;
    var radio = 46, circ = 2 * Math.PI * radio;
    var visibles = todos.filter(function (s) { return (Number(s.valor) || 0) > 0; });
    var total = visibles.reduce(function (a, s) { return a + (Number(s.valor) || 0); }, 0);

    var arcos = '';
    if (total > 0) {
      var acumulado = 0;
      arcos = todos.map(function (s, i) {
        var v = Number(s.valor) || 0;
        if (v <= 0) return '';
        var frac = v / total;
        var largo = Math.max(0.5, frac * circ - (visibles.length > 1 ? 2.2 : 0));
        var pieza = '<circle cx="64" cy="64" r="' + radio + '" fill="none" stroke="' + esc(colorSerie(i, s.color)) + '" ' +
          'stroke-width="20" stroke-dasharray="' + r2(largo) + ' ' + r2(circ - largo) + '" ' +
          'stroke-dashoffset="' + r2(-acumulado) + '" transform="rotate(-90 64 64)"/>';
        acumulado += frac * circ;
        return pieza;
      }).join('');
    }

    var resumen = todos.map(function (s) {
      return String(s.etiqueta) + ': ' + fmt(s.valor, o.formato);
    }).join(', ');

    var svg = '<svg class="grafica" viewBox="0 0 128 128" preserveAspectRatio="xMidYMid meet" ' +
      'style="width:' + tam + 'px;height:' + tam + 'px" role="img" aria-label="' + esc('Gráfica de dona. ' + resumen) + '">' +
      '<circle cx="64" cy="64" r="' + radio + '" fill="none" stroke="var(--superficie-3)" stroke-width="20"/>' +
      arcos +
      (centro.valor !== null && centro.valor !== undefined
        ? '<text x="64" y="' + (centro.sub ? 62 : 69) + '" text-anchor="middle" ' +
          'style="fill:var(--tinta);font-family:var(--f-display);font-size:23px;font-weight:600">' +
          escT(centro.valor) + '</text>' : '') +
      (centro.sub ? '<text x="64" y="80" text-anchor="middle" style="font-size:10.5px">' +
        escT(recorta(centro.sub, 20)) + '</text>' : '') +
      '</svg>';

    var leyenda = '<div class="leyenda">' + todos.map(function (s, i) {
      return '<span class="leyenda-item"><span class="punto" style="background:' + esc(colorSerie(i, s.color)) + '"></span>' +
        escT(s.etiqueta) + ' <strong>' + escT(fmt(s.valor, o.formato)) + '</strong></span>';
    }).join('') + '</div>';

    return '<div><div class="centro">' + svg + '</div>' + leyenda + '</div>';
  }

  /* --- formularios ------------------------------------------------------- */

  function opcionesHtml(opciones, valor, placeholder) {
    var html = '';
    var hayValor = valor !== null && valor !== undefined && valor !== '';
    if (placeholder) {
      html += '<option value=""' + (hayValor ? '' : ' selected') + '>' + escT(placeholder) + '</option>';
    }
    html += (opciones || []).map(function (op) {
      var v = (op && typeof op === 'object') ? op.valor : op;
      var t = (op && typeof op === 'object') ? (op.texto === undefined ? op.valor : op.texto) : op;
      var sel = hayValor && String(valor) === String(v) ? ' selected' : '';
      return '<option value="' + esc(v) + '"' + sel + '>' + escT(t) + '</option>';
    }).join('');
    return html;
  }

  var TIPOS_INPUT = {
    texto: 'text', numero: 'number', fecha: 'date', hora: 'time',
    correo: 'email', tel: 'tel', archivo: 'file', color: 'color', clave: 'password'
  };

  function campo(o) {
    o = o || {};
    var tipo = o.tipo || 'texto';
    var id = o.id || nuevoId('campo');
    var nombre = o.nombre || id;
    var extra = attr(o.attrs) +
      (o.cambio ? ' data-cambio="' + esc(o.cambio) + '"' : '') +
      (o.entrada ? ' data-entrada="' + esc(o.entrada) + '"' : '') +
      (o.deshabilitado ? ' disabled' : '') +
      (o.soloLectura ? ' readonly' : '') +
      (o.requerido ? ' required' : '');
    var marca = o.requerido ? ' <span class="campo-req">*</span>' : '';
    var ayuda = o.ayuda ? '<div class="campo-ayuda" id="' + id + '-ayuda">' + escT(o.ayuda) + '</div>' : '';
    var descrito = o.ayuda ? ' aria-describedby="' + id + '-ayuda"' : '';
    var control, interior;

    if (tipo === 'checa') {
      interior = '<label class="checa" for="' + id + '">' +
        '<input type="checkbox" id="' + id + '" name="' + esc(nombre) + '" value="1"' +
        (o.valor ? ' checked' : '') + descrito + extra + '>' +
        '<span>' + escT(o.etiqueta) + marca + '</span></label>' + ayuda;
    } else {
      if (tipo === 'area') {
        control = '<textarea class="area" id="' + id + '" name="' + esc(nombre) + '" rows="' + (o.filas || 4) + '"' +
          (o.placeholder ? ' placeholder="' + esc(o.placeholder) + '"' : '') + descrito + extra + '>' +
          escT(o.valor) + '</textarea>';
      } else if (tipo === 'selec') {
        control = '<select class="selec" id="' + id + '" name="' + esc(nombre) + '"' + descrito + extra + '>' +
          opcionesHtml(o.opciones, o.valor, o.placeholder) + '</select>';
      } else {
        var t = TIPOS_INPUT[tipo] || 'text';
        control = '<input class="entrada' + (o.mono ? ' mono' : '') + '" type="' + t + '" id="' + id + '" ' +
          'name="' + esc(nombre) + '"' +
          (t === 'file' ? '' : ' value="' + esc(o.valor) + '"') +
          (o.placeholder && t !== 'file' && t !== 'color' ? ' placeholder="' + esc(o.placeholder) + '"' : '') +
          (o.min !== undefined && o.min !== null ? ' min="' + esc(o.min) + '"' : '') +
          (o.max !== undefined && o.max !== null ? ' max="' + esc(o.max) + '"' : '') +
          (o.paso !== undefined && o.paso !== null ? ' step="' + esc(o.paso) + '"' : '') +
          (t === 'file' && o.acepta ? ' accept="' + esc(o.acepta) + '"' : '') +
          descrito + extra + '>';
      }
      interior = '<label class="campo-etiqueta" for="' + id + '">' + escT(o.etiqueta) + marca + '</label>' +
        control + ayuda;
    }

    return '<div class="col-' + (o.col || 12) + '"><div class="campo">' + interior + '</div></div>';
  }

  function form(o) {
    o = o || {};
    var acciones = o.acciones
      ? juntar(o.acciones)
      : '<button type="submit" class="btn btn-primario">Guardar</button>';
    return '<form id="' + esc(o.id || nuevoId('form')) + '"' +
      (o.accion ? ' data-envio="' + esc(o.accion) + '"' : '') + attr(o.attrs) +
      ' class="form-rejilla' + (o.clase ? ' ' + esc(o.clase) : '') + '">' +
      juntar(o.campos) +
      '<div class="col-12 form-acciones">' + acciones + '</div>' +
      '</form>';
  }

  /* --- navegación -------------------------------------------------------- */

  function pestanas(items, activo, accion) {
    var lista = (items || []).filter(Boolean);
    return '<div class="pestanas" role="tablist">' + lista.map(function (it) {
      var esActiva = String(it.id) === String(activo);
      return '<button type="button" class="pestana' + (esActiva ? ' pestana-activa' : '') + '" ' +
        'role="tab" aria-selected="' + (esActiva ? 'true' : 'false') + '"' +
        (accion ? ' data-accion="' + esc(accion) + '"' + attr({ 'data-args': { id: it.id } }) : '') + '>' +
        (it.icono ? icono(it.icono, 15) : '') + escT(it.texto) +
        (it.conteo === null || it.conteo === undefined ? '' : '<span class="conteo">' + escT(it.conteo) + '</span>') +
        '</button>';
    }).join('') + '</div>';
  }

  function migas(items) {
    var lista = (items || []).filter(Boolean);
    if (!lista.length) return '';
    return '<nav class="migas" aria-label="Ruta">' + lista.map(function (it, i) {
      var sep = i ? '<span class="sep" aria-hidden="true">/</span>' : '';
      var ultimo = i === lista.length - 1;
      if (ultimo || !it.ruta) {
        return sep + '<span class="actual"' + (ultimo ? ' aria-current="page"' : '') + '>' + escT(it.texto) + '</span>';
      }
      return sep + '<a href="' + esc(it.ruta) + '">' + escT(it.texto) + '</a>';
    }).join('') + '</nav>';
  }

  /* --- avisos flotantes -------------------------------------------------- */

  var ICONO_TOAST = { ok: 'cheque', crit: 'alerta', aviso: 'alerta', info: 'info' };

  function toast(mensaje, variante) {
    var zona = document.getElementById('toasts');
    if (!zona) return;
    while (zona.children.length >= 3) zona.removeChild(zona.firstElementChild);
    var el = document.createElement('div');
    el.className = 'toast' + (variante ? ' v-' + variante : '');
    el.setAttribute('role', variante === 'crit' ? 'alert' : 'status');
    el.innerHTML = icono(ICONO_TOAST[variante] || 'info', 16) + '<span>' + escT(mensaje) + '</span>';
    zona.appendChild(el);
    window.setTimeout(function () {
      if (!el.parentNode) return;
      el.className += ' saliendo';
      window.setTimeout(function () {
        if (el.parentNode) el.parentNode.removeChild(el);
      }, 260);
    }, 3600);
  }

  /* --- modal ------------------------------------------------------------- */

  var modalAbierto = null;
  var focoPrevio = null;
  var overflowPrevio = '';

  function enfocables(raiz) {
    var sel = 'a[href], button:not([disabled]), input:not([disabled]):not([type="hidden"]), ' +
      'select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])';
    return Array.prototype.slice.call(raiz.querySelectorAll(sel));
  }

  function modal(o) {
    o = o || {};
    var contenedor = document.getElementById('modales');
    if (!contenedor) return;
    if (!modalAbierto) {
      focoPrevio = document.activeElement;
      overflowPrevio = document.body.style.overflow;
    }
    contenedor.innerHTML = '';

    var ancho = o.ancho === 'ancho' ? ' ancho' : (o.ancho === 'angosto' ? ' angosto' : '');
    var fondo = document.createElement('div');
    fondo.className = 'modal-fondo';
    fondo.innerHTML =
      '<div class="modal' + ancho + '" role="dialog" aria-modal="true" ' +
        'aria-label="' + esc(o.titulo || 'Ventana') + '">' +
        '<div class="modal-cab"><div>' +
          '<h3>' + escT(o.titulo || '') + '</h3>' +
          (o.sub ? '<div class="sub">' + escT(o.sub) + '</div>' : '') +
        '</div>' +
        '<button type="button" class="btn btn-fantasma btn-icono" data-accion="app:cerrarModal" ' +
          'data-cerrar-modal="1" aria-label="Cerrar">' + icono('equis', 18) + '</button>' +
        '</div>' +
        '<div class="modal-cuerpo">' + (o.cuerpo || '') + '</div>' +
        (o.acciones ? '<div class="modal-pie">' + juntar(o.acciones) + '</div>' : '') +
      '</div>';

    contenedor.appendChild(fondo);
    document.body.style.overflow = 'hidden';
    modalAbierto = fondo;

    fondo.addEventListener('mousedown', function (ev) {
      if (ev.target === fondo) cerrarModal();
    });
    /* Todos los controles de cierre, no sólo el primero: la «Cancelar» de
       U.confirmar también lleva data-cerrar-modal. */
    Array.prototype.forEach.call(fondo.querySelectorAll('[data-cerrar-modal]'), function (b) {
      b.addEventListener('click', function () { cerrarModal(); });
    });

    var cuerpo = fondo.querySelector('.modal-cuerpo');
    var candidatos = cuerpo ? enfocables(cuerpo) : [];
    if (!candidatos.length) candidatos = enfocables(fondo);
    if (candidatos.length && candidatos[0].focus) {
      try { candidatos[0].focus(); } catch (e) { /* sin foco disponible */ }
    }
  }

  function cerrarModal() {
    var contenedor = document.getElementById('modales');
    if (contenedor) contenedor.innerHTML = '';
    if (!modalAbierto) return;
    modalAbierto = null;
    document.body.style.overflow = overflowPrevio;
    if (focoPrevio && focoPrevio.focus && document.body.contains(focoPrevio)) {
      try { focoPrevio.focus(); } catch (e) { /* el elemento ya no existe */ }
    }
    focoPrevio = null;
  }

  function confirmar(o) {
    o = o || {};
    var idOk = nuevoId('ok');
    modal({
      titulo: o.titulo || 'Confirmar',
      ancho: 'angosto',
      cuerpo: '<p>' + escT(o.texto || '¿Deseas continuar?') + '</p>',
      acciones:
        '<button type="button" class="btn" data-accion="app:cerrarModal" data-cerrar-modal="1">' +
          escT(o.textoCancelar || 'Cancelar') + '</button>' +
        '<button type="button" id="' + idOk + '" class="btn ' + (o.peligro ? 'btn-peligro' : 'btn-primario') + '"' +
          (o.accion ? ' data-accion="' + esc(o.accion) + '"' : '') +
          attr({ 'data-args': o.args || {} }) + '>' +
          escT(o.textoOk || 'Aceptar') + '</button>'
    });
    var propio = modalAbierto;
    var boton = document.getElementById(idOk);
    if (boton) {
      boton.addEventListener('click', function () {
        /* Cierra después de que la acción global haya corrido. */
        window.setTimeout(function () {
          if (modalAbierto === propio) cerrarModal();
        }, 0);
      });
    }
  }

  /* Escape y trampa de foco: se registran una sola vez. */
  document.addEventListener('keydown', function (ev) {
    if (!modalAbierto) return;
    if (ev.key === 'Escape') {
      ev.preventDefault();
      cerrarModal();
      return;
    }
    if (ev.key !== 'Tab') return;
    var lista = enfocables(modalAbierto);
    if (!lista.length) return;
    var primero = lista[0], ultimo = lista[lista.length - 1];
    if (ev.shiftKey && document.activeElement === primero) {
      ev.preventDefault();
      ultimo.focus();
    } else if (!ev.shiftKey && document.activeElement === ultimo) {
      ev.preventDefault();
      primero.focus();
    }
  });

  /* --- archivos ---------------------------------------------------------- */

  function leerArchivo(input, cb) {
    if (!input || !input.files || !input.files.length || typeof cb !== 'function') return;
    var archivo = input.files[0];
    var lector = new FileReader();
    lector.onload = function () {
      cb({
        nombre: archivo.name,
        tamano: tamano(archivo.size),
        tipo: archivo.type || '',
        url: String(lector.result)
      });
    };
    lector.readAsDataURL(archivo);
  }

  return {
    esc: esc,
    attr: attr,
    icono: icono,
    avatar: avatar,
    badge: badge,
    chip: chip,
    kpi: kpi,
    tabla: tabla,
    barras: barras,
    columnas: columnas,
    linea: linea,
    anillo: anillo,
    dona: dona,
    estrellas: estrellas,
    estrellasInput: estrellasInput,
    moneda: moneda,
    fecha: fecha,
    notaTexto: notaTexto,
    claseNota: claseNota,
    seccion: seccion,
    panel: panel,
    vacio: vacio,
    campo: campo,
    form: form,
    pestanas: pestanas,
    migas: migas,
    toast: toast,
    modal: modal,
    cerrarModal: cerrarModal,
    confirmar: confirmar,
    leerArchivo: leerArchivo,
    tamano: tamano,
    iniciales: iniciales,
    progreso: progreso
  };
})();

/* ===== src/50-publico.js ===== */
/* ============================================================================
   50-publico.js — Sitio público de The Livingstone.
   Declara: const VistaPublica
   Portada (#/publico) y perfil docente público (#/publico/profesor?id=pr-01).
   No usa riel: dibuja su propia barra superior y su propio pie.
   ========================================================================== */

const VistaPublica = (function () {

  /* Ancla que quedó pendiente cuando se pidió un bloque desde otra ruta. */
  var anclaPendiente = '';
  /* Última ruta montada, para decidir si conviene subir el scroll. */
  var ultimaClave = '';
  /* En pantalla angosta el claustro abre con tres perfiles; el resto se pide. */
  var CLAUSTRO_VISIBLE = 3;
  var claustroAbierto = false;

  /* Reinicios mínimos para usar <button> con apariencia de bloque. */
  var RESET_BOTON  = 'border:0;font:inherit;color:inherit;text-align:left;width:100%;cursor:pointer';
  var RESET_MARCA  = 'border:0;background:none;padding:0;font:inherit;color:inherit;cursor:pointer';
  var RESET_ENLACE = 'border:0;background:none;padding:0;font:inherit;color:inherit;cursor:pointer;' +
                     'text-align:left;text-decoration:underline;text-underline-offset:2px';
  /* Compensa la barra superior pegajosa al saltar a un ancla. */
  var ANCLA = 'scroll-margin-top:84px';

  /* ---------------------------------------------------------------- helpers */

  function recortar(texto, limite) {
    var t = String(texto == null ? '' : texto);
    if (t.length <= limite) return t;
    return t.slice(0, limite).replace(/\s+\S*$/, '') + '…';
  }

  function porFechaDesc(a, b) {
    return a.fecha < b.fecha ? 1 : (a.fecha > b.fecha ? -1 : 0);
  }

  function activa(m) { return m.estatus === 'activa'; }

  function desplazar(el) {
    var quieto = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
    if (el.scrollIntoView) el.scrollIntoView({ behavior: quieto ? 'auto' : 'smooth', block: 'start' });
    else window.scrollTo(0, 0);
  }

  function avisosEscuela(n) {
    return DB.avisos
      .filter(function (a) { return a.ambito === 'escuela'; })
      .sort(porFechaDesc)
      .slice(0, n);
  }

  function materiasActivas() { return DB.materias.filter(activa); }

  function profesoresPublicos() {
    return DB.profesores.filter(function (p) { return p.perfilPublico && p.estatus !== 'baja'; });
  }

  function alumnosInscritos() {
    return DB.alumnos.filter(function (a) { return a.estatus !== 'baja'; });
  }

  function anosDeTrayectoria() { return HOY.getFullYear() - DB.escuela.fundacion; }

  function horarioLegible(m) {
    return (m.horario || []).map(function (h) { return h.dia + ' ' + h.inicio + '–' + h.fin; }).join(' · ');
  }

  /* Rating público con forma garantizada, aunque el profesor no tenga reseñas. */
  function ratingPublico(id) {
    var r = Q.ratingProfesor(id, true) || {};
    var c = r.criterios || {};
    return {
      promedio: typeof r.promedio === 'number' && isFinite(r.promedio) ? r.promedio : 0,
      total: r.total || 0,
      distribucion: r.distribucion || [0, 0, 0, 0, 0],
      criterios: {
        claridad: typeof c.claridad === 'number' ? c.claridad : 0,
        dominio: typeof c.dominio === 'number' ? c.dominio : 0,
        trato: typeof c.trato === 'number' ? c.trato : 0,
        puntualidad: typeof c.puntualidad === 'number' ? c.puntualidad : 0
      }
    };
  }

  function becas() {
    var con = alumnosInscritos().filter(function (a) { return a.becaPct > 0; });
    var max = 0;
    con.forEach(function (a) { if (a.becaPct > max) max = a.becaPct; });
    return { cuantos: con.length, max: max };
  }

  function plural(n, uno, muchos) { return n + ' ' + (n === 1 ? uno : muchos); }

  function dato(etiqueta, valor) {
    var v = String(valor == null ? '' : valor).trim();
    return '<div class="dato"><span class="e">' + U.esc(etiqueta) + '</span>' +
           '<span class="v">' + U.esc(v || '—') + '</span></div>';
  }

  function lineaContacto(icono, texto) {
    return '<div class="fila gap-1" style="align-items:flex-start">' +
      '<span style="color:var(--tinta-3);display:flex">' + U.icono(icono, 15) + '</span>' +
      '<span style="font-size:.85rem">' + U.esc(texto) + '</span></div>';
  }

  /* Una foto del colegio, si está declarada para esa clave. Si no, nada:
     el bloque se dibuja igual sin ella. */
  function foto(clave, clase, alto) {
    var f = (typeof FOTOS === 'object' && FOTOS) ? FOTOS[clave] : null;
    if (!f || !f.archivo) return '';
    return '<img class="' + clase + '" src="' + U.esc(f.archivo) + '" alt="' + U.esc(f.alt || '') + '"' +
      (alto ? ' style="height:' + alto + '"' : '') + ' loading="lazy" decoding="async">';
  }

  /* Las notas para padres: contenido editorial del sitio, de la más nueva a la
     más vieja. Si el archivo de notas no está, el sitio se dibuja sin ellas. */
  function notas() {
    if (typeof NOTAS !== 'object' || !NOTAS || !NOTAS.length) return [];
    return NOTAS.slice().sort(porFechaDesc);
  }

  function nota(id) {
    var todas = notas();
    for (var i = 0; i < todas.length; i++) if (todas[i].id === id) return todas[i];
    return null;
  }

  /* Quien firma la nota: alguien del claustro o la dirección. */
  function autorDe(n) {
    var id = n && n.autorId ? n.autorId : '';
    if (!id) return null;
    if (id === 'dir-01' || (DB.direccion && DB.direccion.id === id)) return DB.direccion;
    return Q.profesor(id) || null;
  }

  /* El único formato que aceptan los textos de una nota: **negritas**.
     Se escapa primero y se marca después, para que nadie inyecte etiquetas. */
  function enfasis(texto) {
    return U.esc(String(texto == null ? '' : texto))
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  }

  function enlaceRuta(ruta, texto, clase, estilo) {
    return '<button type="button" class="' + clase + '"' + (estilo ? ' style="' + estilo + '"' : '') +
      ' data-accion="app:ir" ' + U.attr({ 'data-args': { ruta: ruta } }) + '>' +
      U.esc(texto) + '</button>';
  }

  function enlaceAncla(id, texto, clase, estilo) {
    return '<button type="button" class="' + clase + '"' + (estilo ? ' style="' + estilo + '"' : '') +
      ' data-accion="pub:ancla" ' + U.attr({ 'data-args': { id: id } }) + '>' +
      U.esc(texto) + '</button>';
  }

  /* ------------------------------------------------------- barra y pie ---- */

  function navSitio() {
    var e = DB.escuela;
    return `
      <header class="sitio-nav">
        <button type="button" class="marca" style="${RESET_MARCA}" data-accion="pub:ancla"
                ${U.attr({ 'data-args': { id: 'cima' } })} aria-label="Ir al inicio del sitio">
          <span class="sello">${U.esc(e.sello)}</span>
          <span>
            <span class="nombre">${U.esc(e.nombre)}</span>
            <span class="etiqueta lema">${U.esc(e.lema)}</span>
          </span>
        </button>
        <div class="fila gap-1">
          <nav class="enlaces" aria-label="Secciones del sitio">
            ${enlaceAncla('colegio', 'Conócenos', 'opcional')}
            ${enlaceAncla('oferta', 'Oferta educativa', 'opcional')}
            ${enlaceAncla('claustro', 'Claustro', '')}
            ${enlaceRuta('#/publico/notas', 'Notas para padres', '')}
            ${enlaceAncla('alianzas', 'Alianzas', 'opcional')}
            ${enlaceAncla('after', 'After Class', 'opcional')}
            ${enlaceAncla('admisiones', 'Informes', 'opcional')}
          </nav>
          <button type="button" class="btn btn-fantasma btn-sm btn-icono" data-accion="app:tema"
                  aria-label="${U.esc(App.tituloTema())}" title="${U.esc(App.tituloTema())}">
            ${U.icono(App.iconoTema(), 16)}
          </button>
          <button type="button" class="btn btn-primario btn-sm" data-accion="pub:acceder">
            ${U.icono('candado', 15)} Acceder al portal
          </button>
        </div>
      </header>`;
  }

  function pieSitio() {
    var e = DB.escuela;
    return `
      <footer class="sitio-pie">
        <div class="interior">
          <div>
            <div class="fila gap-1 mb-1">
              <span class="sello">${U.esc(e.sello)}</span>
              <span class="destacado" style="font-weight:700;font-size:1.1rem">${U.esc(e.nombre)}</span>
            </div>
            <p>${U.esc(e.lema)}</p>
            <p class="silencio">Ciclo escolar ${U.esc(e.ciclo)} · desde ${e.fundacion}</p>
          </div>
          <div>
            <h4>El colegio</h4>
            <ul>
              <li>${enlaceAncla('colegio', 'Conócenos', '', RESET_ENLACE)}</li>
              <li>${enlaceAncla('oferta', 'Oferta educativa', '', RESET_ENLACE)}</li>
              <li>${enlaceAncla('claustro', 'Claustro docente', '', RESET_ENLACE)}</li>
              <li>${enlaceRuta('#/publico/notas', 'Notas para padres', '', RESET_ENLACE)}</li>
              <li>${enlaceAncla('alianzas', 'Nuestras alianzas', '', RESET_ENLACE)}</li>
              <li>${enlaceAncla('after', 'After Class', '', RESET_ENLACE)}</li>
              <li>${enlaceAncla('admisiones', 'Informes y admisiones', '', RESET_ENLACE)}</li>
            </ul>
          </div>
          <div>
            <h4>Contacto</h4>
            <ul>
              <li>${U.esc(e.direccion)}</li>
              <li>${U.esc(e.ciudad)}</li>
              <li>${U.esc(e.telefono)} · ${U.esc(e.telefono2)}</li>
              <li>WhatsApp ${U.esc(e.whatsapp)}</li>
              <li>${U.esc(e.email)}</li>
              <li>${U.esc(e.sitio)}</li>
            </ul>
          </div>
          <div>
            <h4>Te escuchamos</h4>
            <ul>
              <li>Buzón directo: ${U.esc(e.buzon)}</li>
              <li>${U.esc(e.horarioAtencion)}</li>
              ${(e.redes || []).map(function (r) {
                return '<li>' + U.esc(r.nombre) + ' · ' + U.esc(r.usuario) + '</li>';
              }).join('')}
            </ul>
          </div>
        </div>
        <p class="legal">
          © ${HOY.getFullYear()} ${U.esc(e.nombre)}. Demostración de producto: el portal, las personas,
          las calificaciones, los pagos y las reseñas son ficticios y se generaron para mostrar cómo
          funciona el sistema escolar. Los datos institucionales del colegio son públicos; ningún alumno,
          docente o importe corresponde a una persona real.
        </p>
      </footer>`;
  }

  function hero() {

  /* ------------------------------------------------------ una nota entera - */

  /* Dibuja un bloque del cuerpo. Lo que no reconoce, lo ignora en silencio. */
  function bloqueDeNota(b) {
    if (!b || !b.t) return '';
    if (b.t === 'p') return '<p>' + enfasis(b.x) + '</p>';
    if (b.t === 'h') return '<h2>' + enfasis(b.x) + '</h2>';
    if (b.t === 'lista') {
      return '<ul class="nota-lista">' + (b.x || []).map(function (i) {
        return '<li>' + enfasis(i) + '</li>';
      }).join('') + '</ul>';
    }
    if (b.t === 'pasos') {
      return '<ol class="nota-pasos">' + (b.x || []).map(function (i) {
        return '<li><span class="t">' + enfasis(i.t) + '</span>' +
               '<span class="d">' + enfasis(i.x) + '</span></li>';
      }).join('') + '</ol>';
    }
    if (b.t === 'dato') {
      return '<aside class="nota-dato">' +
        '<span class="ico">' + U.icono('info', 16) + '</span>' +
        '<div>' + enfasis(b.x) + '</div></aside>';
    }
    if (b.t === 'cita') {
      return '<blockquote class="cita nota-cita">&#8220;' + enfasis(b.x) + '&#8221;' +
        (b.de ? '<footer>' + U.esc(b.de) + '</footer>' : '') + '</blockquote>';
    }
    if (b.t === 'tabla') {
      return '<div class="tabla-envoltura nota-tabla"><table class="tabla"><thead><tr>' +
        (b.cab || []).map(function (c) { return '<th>' + U.esc(c) + '</th>'; }).join('') +
        '</tr></thead><tbody>' +
        (b.filas || []).map(function (f) {
          return '<tr>' + f.map(function (c, i) {
            return '<td' + (i ? ' class="num mono"' : '') + '>' + enfasis(c) + '</td>';
          }).join('') + '</tr>';
        }).join('') +
        '</tbody></table></div>';
    }
    return '';
  }

  function firmaDeNota(n) {
    var a = autorDe(n);
    if (!a) return '';
    var esDocente = a.rol === 'profesor';
    return `
      <div class="nota-firma">
        ${U.avatar(a, 'lg')}

          <div class="etiqueta">Escrito por</div>
          <div class="nom">${U.esc(a.nombre)}</div>

  function panelResumenRating(r) {
    var barras = '';
    var i, n, pct;
    for (i = 5; i >= 1; i--) {
      n = r.distribucion[i - 1] || 0;
      pct = r.total ? Math.round((n / r.total) * 100) : 0;
      barras += `
        <div class="barra-criterio">
          <span class="silencio">${i === 1 ? '1 estrella' : i + ' estrellas'}</span>
          ${U.progreso(pct)}
          <span class="n">${n}</span>
        </div>`;
    }
    var criterios = [
      { e: 'Claridad', v: r.criterios.claridad },
      { e: 'Dominio', v: r.criterios.dominio },
      { e: 'Trato', v: r.criterios.trato },
      { e: 'Puntualidad', v: r.criterios.puntualidad }
    ].map(function (c) {
      return `
        <div class="barra-criterio">
          <span class="silencio">${c.e}</span>
          ${U.progreso(Math.round((c.v / 5) * 100))}
          <span class="n">${c.v.toFixed(1)}</span>
        </div>`;
    }).join('');

    return `
      <div class="panel">
        <div class="panel-cuerpo">
          <div class="txt-c">
            <div class="destacado" style="font-size:3rem;font-weight:600;line-height:1">
              ${r.total ? r.promedio.toFixed(1) : '—'}
            </div>
            ${U.estrellas(r.total ? r.promedio : 0, { tam: 'lg' })}
            <div class="silencio mt-1" style="font-size:.82rem">
              ${r.total ? 'Promedio de ' + plural(r.total, 'reseña pública', 'reseñas públicas')
                        : 'Todavía sin reseñas públicas'}
            </div>
          </div>
          <div class="separador"></div>
          <div class="etiqueta mb-1">Distribución</div>
          <div class="pila gap-1">${barras}</div>
          <div class="separador"></div>
          <div class="etiqueta mb-1">Criterios evaluados</div>
          <div class="pila gap-1">${criterios}</div>
        </div>
      </div>`;
  }

  function resenaHTML(p, rs) {
    var materia = Q.materia(rs.materiaId);
    var nombreMateria = materia ? materia.nombre : 'una materia';
    var alumno = rs.anonima ? null : Q.alumno(rs.alumnoId);
    var quien = rs.anonima ? 'Alumno de ' + nombreMateria : (alumno ? alumno.nombre : 'Alumno del colegio');
    var retrato = alumno
      ? U.avatar(alumno, 'sm')
      : '<span class="avatar avatar-sm" style="background:var(--superficie-3);color:var(--tinta-2)">' +
        U.icono('usuario', 15) + '</span>';
    var resp = rs.respuesta;
    var textoResp = resp ? (typeof resp === 'string' ? resp : resp.texto) : '';
    var fechaResp = resp && typeof resp === 'object' && resp.fecha ? resp.fecha : '';
    return `
      <article class="resena">
        <div class="entre">
          <div class="fila gap-1">
            ${retrato}
            <div>
              <div style="font-weight:600;font-size:.9rem">${U.esc(quien)}</div>
              <div class="meta">${U.esc(nombreMateria)} · ${U.fecha(rs.fecha, 'corta')}</div>
            </div>
          </div>
          ${U.estrellas(rs.estrellas, {})}
        </div>
        <p class="cuerpo">${U.esc(rs.comentario)}</p>
        ${textoResp ? `
          <div class="respuesta">
            <span class="quien">

    var r = ratingPublico(p.id);
    var materias = Q.materiasDeProfesor(p.id).filter(activa);
    var resenas = Q.resenasDeProfesor(p.id, 'publica').slice().sort(porFechaDesc);

    return `

        ${navSitio()}
        <div class="sitio-cuerpo">

          ${bloqueSemblanza(p)}

          ${bloqueTrayectoria(p)}

          </section>
        </div>
        ${pieSitio()}
