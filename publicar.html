  /* ========================================================== ACADÉMICO ==== */

  function distribucionColegio() {
    var b = [
      { etiqueta: '9.0 a 10', valor: 0 },
      { etiqueta: '8.0 a 8.9', valor: 0 },
      { etiqueta: '7.0 a 7.9', valor: 0 },
      { etiqueta: '6.0 a 6.9', valor: 0 },
      { etiqueta: 'Menos de 6', valor: 0 }
    ];
    DB.calificaciones.forEach(function (c) {
      var v = Number(c.valor);
      if (isNaN(v)) return;
      if (v >= 9) b[0].valor++;
      else if (v >= 8) b[1].valor++;
      else if (v >= 7) b[2].valor++;
      else if (v >= 6) b[3].valor++;
      else b[4].valor++;
    });
    return b;
  }

  function seccionAcademico() {
    var k = Q.kpisEscuela() || {};
    var activas = materiasActivas();
    var dist = distribucionColegio();
    var totalCal = dist.reduce(function (s, x) { return s + x.valor; }, 0);
    var reprobados = dist[4].valor;
    var maxDist = dist.reduce(function (s, x) { return Math.max(s, x.valor); }, 0);
    var h = [];

    h.push('<div class="col-3">' + U.kpi({
      etiqueta: 'Promedio general', icono: 'grafica', variante: varNota(k.promedioGeneral),
      valor: U.notaTexto(k.promedioGeneral), sub: 'Colegio completo'
    }) + '</div>');
    h.push('<div class="col-3">' + U.kpi({
      etiqueta: 'Calificaciones capturadas', icono: 'portapapeles', variante: 'marca',
      valor: totalCal, sub: 'En ' + activas.length + ' materias'
    }) + '</div>');
    h.push('<div class="col-3">' + U.kpi({
      etiqueta: 'Notas reprobatorias', icono: 'alerta', variante: reprobados ? 'crit' : 'ok',
      valor: reprobados, sub: totalCal ? Math.round(reprobados / totalCal * 100) + '% del total' : 'Sin capturas'
    }) + '</div>');
    h.push('<div class="col-3">' + U.kpi({
      etiqueta: 'Asistencia global', icono: 'cheque', variante: varPct(pctNum(k.asistencia), 90, 80),
      valor: pctNum(k.asistencia) + '%', sub: 'Todas las materias'
    }) + '</div>');

    h.push('<div class="col-6">' + U.panel({
      titulo: 'Promedio por materia',
      sub: 'Meta institucional: 8.0',
      cuerpo: graficaPromedioMaterias()
    }) + '</div>');

    h.push('<div class="col-6">' + U.panel({
      titulo: 'Distribución de calificaciones',
      sub: 'Todas las capturas del colegio, agrupadas por rango',
      cuerpo: U.columnas({ series: dist, max: maxDist }) +
        '<div class="separador"></div>' +
        '<div class="datos-rejilla">' + dist.map(function (x) {
          return '<div class="dato"><span class="e">' + esc(x.etiqueta) + '</span><span class="v mono">' +
            x.valor + (totalCal ? ' · ' + Math.round(x.valor / totalCal * 100) + '%' : '') + '</span></div>';
        }).join('') + '</div>'
    }) + '</div>');

    h.push('<div class="col-6">' + U.panel({
      titulo: 'Asistencia por materia',
      sub: 'Umbral de alerta: 80%',
      cuerpo: U.barras({
        series: activas.map(function (m) {
          var p = asistenciaDeMateria(m.id);
          return { etiqueta: m.nombre, valor: p, color: p >= 90 ? 'var(--ok)' : (p >= 80 ? 'var(--aviso)' : 'var(--crit)') };
        }),
        max: 100, meta: 90, formato: fmtPct
      })
    }) + '</div>');

    /* Comparativa docente */
    var filasProf = DB.profesores.map(function (p) {
      var r = Q.ratingProfesor(p.id, false) || {};
      var mats = Q.materiasDeProfesor(p.id);
      return {
        profesor: celdaPersona(p, esc(p.titulo || '')),
        grupos: '<span class="mono">' + mats.length + '</span>',
        alumnos: '<span class="mono">' + alumnosDeProfesor(p.id) + '</span>',
        promedio: nota(promedioProfesor(p.id)),
        asistencia: '<span class="mono">' + (mats.length
          ? Math.round(mats.reduce(function (s, m) { return s + asistenciaDeMateria(m.id); }, 0) / mats.length)
          : 0) + '%</span>',
        valoracion: U.estrellas(num(r.promedio)) + '<div><small class="silencio">' + num(r.total) + ' reseñas</small></div>'
      };
    });

    h.push('<div class="col-6">' + U.panel({
      titulo: 'Comparativa del claustro',
      sub: 'Carga, resultados y valoración de cada persona docente',
      cuerpo: tabla([
        { clave: 'profesor', titulo: 'Persona docente', html: true },
        { clave: 'grupos', titulo: 'Grupos', align: 'num', html: true },
        { clave: 'alumnos', titulo: 'Alumnos', align: 'num', html: true },
        { clave: 'promedio', titulo: 'Promedio', align: 'num', html: true },
        { clave: 'asistencia', titulo: 'Asistencia', align: 'num', html: true },
        { clave: 'valoracion', titulo: 'Valoración', html: true }
      ], filasProf, 'Sin claustro registrado.')
    }) + '</div>');

    /* Avance de captura */
    var filasCap = activas.map(function (m) {
      var c = capturaMateria(m);
      var pr = Q.profesor(m.profesorId);
      return {
        materia: '<div><strong>' + esc(m.nombre) + '</strong><div><small class="silencio mono">' + esc(m.codigo) + '</small></div></div>',
        profesor: esc(pr ? pr.nombre : '—'),
        esperado: '<span class="mono">' + c.hechas + ' / ' + c.esperadas + '</span>' +
          '<div><small class="silencio">' + c.debidas + ' de ' + c.evaluaciones + ' evaluaciones ya aplicadas</small></div>',
        avance: '<div style="min-width:130px">' + U.progreso(c.pct, c.pct >= 100 ? 'ok' : (c.pct >= 80 ? 'aviso' : 'crit')) +
          '<small class="mono silencio">' + c.pct + '%</small></div>',
        ciclo: '<span class="mono">' + c.totalCiclo + '</span>',
        estado: c.pct >= 100 ? U.badge('Al corriente', 'ok') : (c.pct >= 80 ? U.badge('Con rezago', 'aviso') : U.badge('Atrasada', 'crit'))
      };
    });

    h.push('<div class="col-12">' + U.panel({
      titulo: 'Avance de captura de calificaciones',
      sub: 'Notas capturadas sobre las esperadas al ' + U.fecha(isoHoy(), 'larga') +
        ' — sólo cuentan las evaluaciones cuya fecha ya pasó',
      cuerpo: tabla([
        { clave: 'materia', titulo: 'Materia', html: true },
        { clave: 'profesor', titulo: 'Imparte', html: true },
        { clave: 'esperado', titulo: 'Capturadas / esperadas', align: 'num', html: true },
        { clave: 'avance', titulo: 'Avance', html: true },
        { clave: 'ciclo', titulo: 'Total del ciclo', align: 'num', html: true },
        { clave: 'estado', titulo: 'Estado', html: true }
      ], filasCap, 'No hay materias activas.')
    }) + '</div>');

    return U.seccion({
      titulo: 'Académico',
      sub: 'Resultados del colegio y vigilancia de la captura de calificaciones',
      cuerpo: '<div class="rejilla">' + h.join('') + '</div>'
    });
  }

  function seccionResenas() {
    var todas = DB.resenas.slice().sort(function (a, b) {
      return a.fecha < b.fecha ? 1 : (a.fecha > b.fecha ? -1 : 0);
    });
    var porProfesor = estado.fResProfesor === 'todos' ? todas : todas.filter(function (r) {
      return r.profesorId === estado.fResProfesor;
    });
    var conteo = { todas: porProfesor.length, pendiente: 0, publica: 0, oculta: 0 };
    porProfesor.forEach(function (r) {
      if (conteo[r.estado] !== undefined) conteo[r.estado]++;
    });
    var lista = estado.fResEstado === 'todas' ? porProfesor : porProfesor.filter(function (r) {
      return r.estado === estado.fResEstado;
    });

    var pestanas = [
      { id: 'todas', texto: 'Todas', n: conteo.todas },
      { id: 'pendiente', texto: 'Pendientes', n: conteo.pendiente },
      { id: 'publica', texto: 'Publicadas', n: conteo.publica },
      { id: 'oculta', texto: 'Ocultas', n: conteo.oculta }
    ].map(function (t) {
      return '<button type="button" class="pestana' + (estado.fResEstado === t.id ? ' pestana-activa' : '') + '" ' +
        'data-accion="dir:filtroResenaEstado" ' + U.attr({ 'data-args': { v: t.id } }) + '>' +
        esc(t.texto) + '<span class="conteo">' + t.n + '</span></button>';
    }).join('');

    var filtroProf = '<select class="selec" style="width:auto;min-width:240px" aria-label="Filtrar por persona docente" ' +
      'data-cambio="dir:filtroResenaProfesor">' +
      opciones([{ v: 'todos', t: 'Todo el claustro' }].concat(DB.profesores.map(function (p) {
        return { v: p.id, t: p.nombre };
      })), estado.fResProfesor) + '</select>';

    var cuerpo = lista.length ? lista.map(function (r) {
      var pr = Q.profesor(r.profesorId);
      var al = Q.alumno(r.alumnoId);
      var m = Q.materia(r.materiaId);
      var autor = r.anonima
        ? '<span class="chip">' + U.icono('usuario', 14) + ' Reseña anónima</span>'
        : (al ? '<span class="fila gap-1">' + U.avatar(al, 'xs') + '<span>' + esc(al.nombre) + '</span></span>'
              : '<span class="silencio">Autor no disponible</span>');
      var acc = r.estado === 'publica'
        ? '<button type="button" class="btn btn-sm btn-peligro" data-accion="dir:pedirOcultar" ' +
          U.attr({ 'data-args': { id: r.id } }) + '>' + U.icono('ojo-cerrado', 15) + ' Ocultar</button>'
        : (r.estado === 'pendiente'
          ? '<span class="silencio"><small>Sólo ' + esc(pr ? pr.nombre : 'la persona docente') + ' puede publicarla</small></span>'
          : '<span class="silencio"><small>Fuera del perfil público</small></span>');
      return '<div class="resena">' +
        '<div class="entre envuelve">' +
        '<div class="fila envuelve gap-1">' + U.estrellas(num(r.estrellas)) + badgeResena(r.estado) +
        (m ? U.chip(m.codigo + ' · ' + m.nombre) : '') + '</div>' +
        '<div class="fila gap-1">' + acc + '</div>' +
        '</div>' +
        '<div class="cuerpo">' + esc(r.comentario) + '</div>' +

    var items = lista.length ? lista.map(function (av) {
      var autor = quien(av.autorId);
      var m = av.materiaId ? Q.materia(av.materiaId) : null;

        '<div class="fila envuelve gap-1"><span class="t">' + esc(av.titulo) + '</span>' +
        (av.prioridad === 'alta' ? U.badge('Prioridad alta', 'crit') : U.badge('Normal', 'neutro')) +
        (av.ambito === 'escuela' ? U.chip('Todo el colegio') : U.chip(m ? m.codigo + ' · ' + m.nombre : 'Materia')) +
        '</div>' +
        '<div class="d">' + esc(autor ? autor.nombre : 'Dirección') + ' · ' + esc(U.fecha(av.fecha, 'relativa')) + '</div>' +
        '<p class="mt-1">' + esc(av.cuerpo) + '</p>' +

    }).join('') : '';

    var opcAmbito = [{ v: 'escuela', t: 'Todo el colegio' }].concat(materiasActivas().map(function (m) {

    return U.seccion({
      titulo: 'Avisos',
      sub: 'Comunicación oficial del colegio',
      cuerpo: '<div class="rejilla">' +
        '<div class="col-8">' + U.panel({

          cuerpo: items ? '<ul class="lista">' + items + '</ul>' : U.vacio({
            icono: 'campana', titulo: 'Sin avisos', texto: 'Publica el primero desde el formulario de la derecha.'

            acciones: btnEnviar('Publicar aviso')

          }) +

        })
    });

  function modalColegiaturas() {
    var lista = periodosCiclo();
    var opcs = lista.map(function (p) {
      var ya = DB.pagos.filter(function (x) { return x.periodo === p; }).length;
      return { v: p, t: mesLargo(p) + (ya ? ' · ' + ya + ' ya generadas' : ' · sin generar') };
    });
    var sugerido = '';
    lista.forEach(function (p) {
      if (!sugerido && !DB.pagos.some(function (x) { return x.periodo === p; })) sugerido = p;
    });
    if (!sugerido) sugerido = lista[lista.length - 1];

    U.modal({
      titulo: 'Generar colegiaturas',
      sub: 'Se crea un cargo pendiente por cada alumno activo',
      cuerpo: '<div class="caja-suave mb-2">Colegiatura base ' + U.moneda(num(DB.escuela.colegiaturaMensual)) +
        ', menos la beca de cada alumno. No se duplican los cargos que ya existan en el periodo.</div>' +
        forma({
          accion: 'dir:generarColegiaturas',
          campos: campo({ nombre: 'periodo', tipo: 'selec', etiqueta: 'Periodo', valor: sugerido, col: 'col-12', id: 'gc-per', opciones: opcs }),
          acciones: btnCancelar() + btnEnviar('Generar')
        })
    });
  }

  /* ============================================================ ACCIONES ==== */

  var acciones = {

    /* --- alumnos --- */
    'dir:buscarAlumno': function (args, ev, el) {
      estado.qAlumno = el.value;
      estado.foco = 'dir-busca-alumno';
      App.refrescar();
    },
    'dir:filtroEstatus': function (args, ev, el) {
      estado.fEstatus = el.value;
      estado.foco = null;
      App.refrescar();
    },
    'dir:nuevoAlumno': function () { modalAlumno(null); },
    'dir:editarAlumno': function (args) {
      var a = Q.alumno(args.id);
      if (!a) { U.toast('No encontramos ese alumno.', 'crit'); return; }
      modalAlumno(a);
    },
    'dir:crearAlumno': function (args) {
      var datos = datosAlumnoDeForma((args && args.datos) || {});
      if (!validaAlumno(datos)) return;
      tras(M.crearAlumno(datos), 'Alumno dado de alta.');
    },
    'dir:guardarAlumno': function (args) {
      var datos = datosAlumnoDeForma((args && args.datos) || {});
      if (!validaAlumno(datos)) return;
      tras(M.actualizarAlumno(args.id, datos), 'Datos del alumno actualizados.');
    },
    'dir:guardarNotas': function (args) {
      var d = (args && args.datos) || {};
      tras(M.actualizarAlumno(args.id, { notas: String(d.notas || '') }), 'Notas internas guardadas.');
    },
    'dir:menuEstatus': function (args) {
      var a = Q.alumno(args.id);
      if (!a) { U.toast('No encontramos ese alumno.', 'crit'); return; }
      modalEstatus(a);
    },
    'dir:pedirEstatus': function (args) {
      var a = Q.alumno(args.id);
      if (!a) return;
      var textos = {
        activo: 'Recupera el acceso completo y vuelve a contar en los indicadores del colegio.',
        condicionado: 'Queda bajo seguimiento académico: conserva sus materias y aparece marcado en el tablero.',
        baja: 'Sale del padrón activo, deja de contar en los indicadores y ya no se le generan colegiaturas.'
      };
      U.cerrarModal();
      U.confirmar({
        titulo: 'Cambiar el estatus de ' + a.nombre,
        texto: 'Pasará de «' + a.estatus + '» a «' + args.estatus + '». ' + (textos[args.estatus] || ''),
        textoOk: 'Cambiar estatus',
        peligro: args.estatus === 'baja',
        accion: 'dir:cambiarEstatus',
        args: { id: a.id, estatus: args.estatus }
      });
    },
    'dir:cambiarEstatus': function (args) {
      tras(M.cambiarEstatusAlumno(args.id, args.estatus), 'Estatus actualizado.');
    },
    'dir:inscribir': function (args) {
      var d = (args && args.datos) || {};
      if (!d.materiaId) { U.toast('Elige una materia.', 'crit'); return; }
      tras(M.inscribir(args.id, d.materiaId), 'Alumno inscrito en la materia.');
    },
    'dir:pedirBaja': function (args) {
      var a = Q.alumno(args.id), m = Q.materia(args.materiaId);
      if (!a || !m) return;
      U.confirmar({
        titulo: 'Dar de baja de la materia',
        texto: a.nombre + ' dejará de aparecer en las listas de ' + m.nombre +
          '. Sus calificaciones y su asistencia de esa materia dejan de contar en el promedio general.',
        textoOk: 'Dar de baja',
        peligro: true,
        accion: 'dir:desinscribir',
        args: { id: a.id, materiaId: m.id }
      });
    },
    'dir:desinscribir': function (args) {
      tras(M.desinscribir(args.id, args.materiaId), 'Alumno dado de baja de la materia.');
    },

    /* --- profesores --- */
    'dir:nuevoProfesor': function () { modalProfesor(null); },
    'dir:crearProfesor': function (args) {
      var datos = datosProfesorDeForma((args && args.datos) || {});
      if (!validaProfesor(datos)) return;
      tras(M.crearProfesor(datos), 'Persona docente dada de alta.');
    },
    'dir:guardarProfesor': function (args) {
      var d = (args && args.datos) || {};
      var datos = datosProfesorDeForma(d);
      if (!validaProfesor(datos)) return;
      /* Sólo se tocan los campos que el formulario en turno realmente trae:
         así una forma corta nunca borra el horario de asesoría ni el perfil público. */
      if (d.horarioAsesoria !== undefined) datos.horarioAsesoria = String(d.horarioAsesoria).trim();
      if (d.perfilPublico !== undefined) datos.perfilPublico = !!d.perfilPublico;
      tras(M.actualizarProfesor(args.id, datos), 'Datos de la persona docente actualizados.');
    },
    'dir:asignarMateria': function (args) {
      var d = (args && args.datos) || {};
      if (!d.materiaId) { U.toast('Elige una materia.', 'crit'); return; }
      tras(M.actualizarMateria(d.materiaId, { profesorId: args.id }), 'Materia reasignada.');
    },
    'dir:reasignarMateria': function (args, ev, el) {
      tras(M.actualizarMateria(args.id, { profesorId: el.value }), 'Materia reasignada.');
    },

    /* --- materias --- */
    'dir:nuevaMateria': function () { modalMateria(); },
    'dir:crearMateria': function (args) {
      var d = (args && args.datos) || {};
      var datos = {
        codigo: String(d.codigo || '').trim().toUpperCase(),
        nombre: String(d.nombre || '').trim(),
        profesorId: d.profesorId,
        creditos: num(d.creditos),
        aula: String(d.aula || '').trim(),
        cupo: num(d.cupo),
        descripcion: String(d.descripcion || '').trim(),
        estatus: 'activa',
        horario: []
      };
      if (datos.codigo.length < 3) { U.toast('El código de la materia es demasiado corto.', 'crit'); return; }
      if (datos.nombre.length < 4) { U.toast('Escribe el nombre completo de la materia.', 'crit'); return; }
      if (!datos.profesorId) { U.toast('Asigna una persona docente.', 'crit'); return; }
      if (datos.cupo < 1) { U.toast('El cupo debe ser al menos de una persona.', 'crit'); return; }
      if (d.dia && d.inicio && d.fin) {
        if (String(d.fin) <= String(d.inicio)) { U.toast('La hora de fin debe ser posterior a la de inicio.', 'crit'); return; }
        datos.horario.push({ dia: d.dia, inicio: d.inicio, fin: d.fin });
      }
      tras(M.crearMateria(datos), 'Materia creada.');
    },
    'dir:pedirArchivar': function (args) {
      var m = Q.materia(args.id);
      if (!m) return;
      U.confirmar({
        titulo: 'Archivar ' + m.nombre,
        texto: 'La materia sale del horario semanal y de la oferta del ciclo. Las calificaciones ya capturadas se conservan.',
        textoOk: 'Archivar',
        peligro: true,
        accion: 'dir:archivarMateria',
        args: { id: m.id }
      });
    },
    'dir:archivarMateria': function (args) {
      tras(M.archivarMateria(args.id), 'Materia archivada.');
    },

    /* --- finanzas --- */
    'dir:filtroPagoEstado': function (args, ev, el) { estado.fPagoEstado = el.value; App.refrescar(); },
    'dir:filtroPagoAlumno': function (args, ev, el) { estado.fPagoAlumno = el.value; App.refrescar(); },
    'dir:modalPago': function (args) {
      var p = null;
      DB.pagos.forEach(function (x) { if (x.id === args.id) p = x; });
      if (!p) { U.toast('No encontramos ese movimiento.', 'crit'); return; }
      modalPago(p);
    },
    'dir:guardarPago': function (args) {
      var d = (args && args.datos) || {};
      if (!String(d.referencia || '').trim()) { U.toast('Captura la referencia del pago.', 'crit'); return; }
      tras(M.registrarPago(args.id, {
        metodo: d.metodo || METODOS[0],
        referencia: String(d.referencia).trim()
      }), 'Pago registrado.');
    },
    'dir:modalColegiaturas': function () { modalColegiaturas(); },
    'dir:generarColegiaturas': function (args) {
      var d = (args && args.datos) || {};
      if (!d.periodo) { U.toast('Elige el periodo.', 'crit'); return; }
      var antes = DB.pagos.length;
      /* Quiénes ya tenían cargo de ese periodo antes de generar: ésos se omiten. */
      var yaTenian = DB.alumnos.filter(function (a) {
        return a.estatus !== 'baja' && DB.pagos.some(function (p) {
          return p.alumnoId === a.id && p.periodo === d.periodo;
        });
      }).length;
      var r = M.generarColegiaturas(d.periodo);
      if (!r || !r.ok) {
        U.toast((r && r.error) || 'No se pudieron generar las colegiaturas.', 'crit');
        return;
      }
      var creados = (typeof r.generados === 'number') ? r.generados : (DB.pagos.length - antes);
      var omitidos = (typeof r.omitidos === 'number') ? r.omitidos : yaTenian;
      U.cerrarModal();
      U.toast(mesLargo(d.periodo) + ': ' + creados + (creados === 1 ? ' colegiatura generada' : ' colegiaturas generadas') +
        ' y ' + omitidos + (omitidos === 1 ? ' omitida' : ' omitidas'), creados ? 'ok' : 'aviso');
      App.refrescar();
    },

    /* --- reseñas --- */
    'dir:filtroResenaProfesor': function (args, ev, el) { estado.fResProfesor = el.value; App.refrescar(); },
    'dir:filtroResenaEstado': function (args) {
      var v = args && args.v;
      if (!v) return;
      estado.fResEstado = v;
      App.refrescar();
    },
    'dir:verResenasDe': function (args) {
      estado.fResProfesor = args.id;
      estado.fResEstado = 'pendiente';
      App.ir('#/direccion/resenas');
    },
    'dir:pedirOcultar': function (args) {
      var r = null;
      DB.resenas.forEach(function (x) { if (x.id === args.id) r = x; });
      if (!r) return;
      var pr = Q.profesor(r.profesorId);
      U.confirmar({
        titulo: 'Ocultar esta reseña',
        texto: 'Dejará de aparecer en el perfil público de ' + (pr ? pr.nombre : 'la persona docente') +
          ' y ya no contará en su valoración visible. La reseña no se borra: queda en el expediente ' +
          'y sólo la persona docente puede volver a publicarla.',
        textoOk: 'Ocultar reseña',
        peligro: true,
        accion: 'dir:ocultarResena',
        args: { id: r.id }
      });
    },
    'dir:ocultarResena': function (args) {
      tras(M.moderarResena(args.id, 'oculta'), 'Reseña retirada del sitio público.');
    },

    /* --- avisos --- */
    'dir:publicarAviso': function (args) {
      var d = (args && args.datos) || {};
      var titulo = String(d.titulo || '').trim();
      var cuerpo = String(d.cuerpo || '').trim();
      if (titulo.length < 4) { U.toast('El título del aviso es demasiado corto.', 'crit'); return; }
      if (cuerpo.length < 10) { U.toast('Escribe el cuerpo del aviso.', 'crit'); return; }
      var v = d.ambito || 'escuela';
      tras(M.publicarAviso({
        titulo: titulo,
        cuerpo: cuerpo,
        ambito: v === 'escuela' ? 'escuela' : 'materia',
        materiaId: v === 'escuela' ? null : v,
        prioridad: d.prioridad === 'alta' ? 'alta' : 'normal',
        autorId: DB.direccion.id,
        autorRol: 'direccion',
        fecha: isoHoy()
      }), 'Aviso publicado.');
    },

    /* --- colegio --- */
    'dir:guardarEscuela': function (args) {
      var d = (args && args.datos) || {};
      var nombre = String(d.nombre || '').trim();
      if (nombre.length < 3) { U.toast('El colegio necesita un nombre.', 'crit'); return; }
      if (num(d.colegiaturaMensual) < 0) { U.toast('La colegiatura no puede ser negativa.', 'crit'); return; }
      tras(M.actualizarEscuela({
        nombre: nombre,
        lema: String(d.lema || '').trim(),
        ciclo: String(d.ciclo || '').trim(),
        direccion: String(d.direccion || '').trim(),
        ciudad: String(d.ciudad || '').trim(),
        telefono: String(d.telefono || '').trim(),
        email: String(d.email || '').trim(),
        sitio: String(d.sitio || '').trim(),
        horarioAtencion: String(d.horarioAtencion || '').trim(),
        colegiaturaMensual: num(d.colegiaturaMensual),
        recargoPct: num(d.recargoPct),
        mision: String(d.mision || '').trim(),
        acercaDe: String(d.acercaDe || '').trim()
      }), 'Datos del colegio actualizados en el sitio público.');
    },
    'dir:foto': function (args, ev, el) {
      U.leerArchivo(el, function (archivo) {
        if (!archivo || !archivo.url) { U.toast('No se pudo leer la imagen.', 'crit'); return; }
        tras(M.subirFoto('direccion', DB.direccion.id, archivo.url), 'Fotografía actualizada.');
      });
    },
    'dir:pedirReinicio': function () {
      U.confirmar({
        titulo: 'Reiniciar la demostración',
        texto: 'Se borra todo lo capturado en este navegador —alumnos, materias, calificaciones, pagos, ' +
          'reseñas y avisos nuevos— y se vuelve a sembrar el Colegio Altamira original. ' +
          'Los cambios que hayas hecho se pierden y no hay manera de recuperarlos.',
        textoOk: 'Sí, reiniciar todo',
        peligro: true,
        accion: 'app:reiniciarDemo'
      });
    }
  };

  /* ============================================================== VISTA ==== */

  return {
    titulo: 'Dirección general',

    nav: [
      { id: 'resumen', texto: 'Resumen', icono: 'casa' },
      { id: 'alumnos', texto: 'Alumnos', icono: 'usuarios' },
      { id: 'profesores', texto: 'Profesores', icono: 'birrete' },
      { id: 'materias', texto: 'Materias', icono: 'libro' },
      { id: 'finanzas', texto: 'Finanzas', icono: 'dinero' },
      { id: 'academico', texto: 'Académico', icono: 'grafica' },
      { id: 'resenas', texto: 'Reseñas', icono: 'estrella' },
      { id: 'avisos', texto: 'Avisos', icono: 'campana' },
      { id: 'colegio', texto: 'Colegio', icono: 'engrane' }
    ],

    render: function (ctx) {
      var sec = (ctx && ctx.seccion) || 'resumen';
      var params = (ctx && ctx.params) || {};
      if (estado.seccion !== sec) { estado.seccion = sec; estado.foco = null; }

      if (sec === 'alumnos') return params.id ? expediente(params.id) : seccionAlumnos();
      if (sec === 'profesores') return params.id ? fichaProfesor(params.id) : seccionProfesores();
      if (sec === 'materias') return seccionMaterias();
      if (sec === 'finanzas') return seccionFinanzas();
      if (sec === 'academico') return seccionAcademico();
      if (sec === 'resenas') return seccionResenas();
      if (sec === 'avisos') return seccionAvisos();
      if (sec === 'colegio') return seccionColegio();
      return seccionResumen();
    },

    /* Devuelve el cursor al buscador tras repintar. */
    montado: function () {
      if (!estado.foco) return;
      var el = document.getElementById(estado.foco);
      if (!el) return;
      el.focus();
      if (el.setSelectionRange && el.type !== 'number') {
        var n = el.value.length;
        el.setSelectionRange(n, n);
      }
    },

    acciones: acciones
  };

})();


/* ===== src/90-app.js ===== */
/* ============================================================================
   90-app.js — Cascarón de la aplicación.
   Declara: const App, const Acciones. Arranca al final del archivo.
   Contiene: enrutador de hash, delegación de eventos, riel + barra superior,
   pantalla de acceso y acciones globales.
   ========================================================================== */

const App = {};
const Acciones = {};

(function () {

  /* ------------------------------------------------------------------ estado */

  var ZONAS = ['publico', 'acceso', 'alumno', 'profesor', 'direccion'];
  var PANELES = { alumno: true, profesor: true, direccion: true };
  var ROL_LEGIBLE = { alumno: 'Estudiante', profesor: 'Docente', direccion: 'Dirección' };
  var LLAVE_TEMA = 'altamira.tema';

  var VISTAS = {};          // se arma en el arranque
  var menuAbierto = false;  // cajón del riel en pantallas angostas

  /* -------------------------------------------------------------- utilidades */

  function esFn(v) { return typeof v === 'function'; }

  // Ejecuta y devuelve `alt` si algo truena. Evita que un selector deje muerto el cascarón.
  function intentar(fn, alt) {
    try { return fn(); } catch (e) { return alt; }
  }

  // Escape sin depender de U: sólo se usa en la pantalla de error.
  function escSeguro(v) {
    return String(v == null ? '' : v)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function elementoDe(nodo) {
    var n = nodo;
    while (n && n.nodeType !== 1) { n = n.parentNode; }
    return n;
  }

  function masCercano(nodo, selector) {
    var el = elementoDe(nodo);
    return (el && el.closest) ? el.closest(selector) : null;
  }

  function leerArgs(el) {
    var crudo = el.dataset ? el.dataset.args : el.getAttribute('data-args');
    if (!crudo) return {};
    try {
      var o = JSON.parse(crudo);
      return (o && typeof o === 'object') ? o : {};
    } catch (e) {
      return {};
    }
  }

  // Atributos de acción listos para interpolar en una cadena de HTML.
  function acc(nombre, args) {
    var mapa = { 'data-accion': nombre };
    if (args) mapa['data-args'] = args;
    return ' ' + U.attr(mapa);
  }

  function capitalizar(txt) {
    var t = String(txt || '');
    return t ? t.charAt(0).toUpperCase() + t.slice(1) : '';
  }

  function navDe(vista) {
    var nav = (vista && Array.isArray(vista.nav)) ? vista.nav : [];
    return nav.filter(function (it) { return it && it.id; });
  }

  function itemPorId(nav, id) {
    for (var i = 0; i < nav.length; i++) {
      if (nav[i].id === id) return nav[i];
    }
    return null;
  }

  function idQueCoincide(nav, patron) {
    for (var i = 0; i < nav.length; i++) {
      if (patron.test(String(nav[i].id))) return nav[i].id;
    }
    return null;
  }

  /* --------------------------------------------------------------- enrutador */

  function decodificar(txt) {
    return intentar(function () {
      return decodeURIComponent(String(txt).replace(/\+/g, ' '));
    }, String(txt));
  }

  function parsearParams(cadena) {
    var params = {};
    if (!cadena) return params;
    cadena.split('&').forEach(function (par) {
      if (!par) return;
      var i = par.indexOf('=');
      var clave = i < 0 ? par : par.slice(0, i);
      var valor = i < 0 ? '' : par.slice(i + 1);
      if (!clave) return;
      params[decodificar(clave)] = decodificar(valor);
    });
    return params;
  }

  // "#/alumno/materias?id=mat-01" -> {zona, seccion, params}
  function parsearHash(hash) {
    var crudo = String(hash || '');
    if (crudo.charAt(0) === '#') crudo = crudo.slice(1);
    var corte = crudo.indexOf('?');
    var ruta = corte < 0 ? crudo : crudo.slice(0, corte);
    var consulta = corte < 0 ? '' : crudo.slice(corte + 1);
    var segmentos = ruta.split('/').filter(function (s) { return s !== ''; });
    return {
      zona: segmentos[0] || '',
      seccion: segmentos[1] || '',
      params: parsearParams(consulta)
    };
  }

  // Devuelve la ruta a la que hay que mandar al visitante, o null si la actual sirve.
  function destinoValido(hash) {
    var h = parsearHash(hash);
    var ses = intentar(function () { return Sesion.actual(); }, null);
    if (!h.zona) return '#/publico';
    if (ZONAS.indexOf(h.zona) < 0) return '#/publico';
    if (PANELES[h.zona]) {
      if (!ses) return '#/acceso';
      if (ses.rol !== h.zona) return PANELES[ses.rol] ? '#/' + ses.rol : '#/publico';
      // Sesión que apunta a alguien que ya no está en DB: de vuelta al acceso.
      if (!intentar(function () { return Sesion.persona(); }, null)) return '#/acceso';
    }
    return null;
  }

  function seccionValida(vista, zona, seccion) {
    if (!vista) return seccion;
    var nav = navDe(vista);
    if (seccion) {
      if (itemPorId(nav, seccion)) return seccion;
      if (Array.isArray(vista.secciones) && vista.secciones.indexOf(seccion) >= 0) return seccion;
      // El sitio público tiene páginas de detalle fuera del nav (perfil docente).
      if (zona === 'publico') return seccion;
    }
    return nav.length ? nav[0].id : '';
  }

  function construirCtx(h) {
    var ses = intentar(function () { return Sesion.actual(); }, null);
    var vista = VISTAS[h.zona] || null;
    return {
      zona: h.zona,
      rol: PANELES[h.zona] ? h.zona : (ses ? ses.rol : null),
      id: ses ? ses.id : null,
      persona: intentar(function () { return Sesion.persona(); }, null),
      seccion: seccionValida(vista, h.zona, h.seccion),
      params: h.params
    };
  }

  function resolver() {
    var destino = destinoValido(location.hash);
    var h = parsearHash(destino || location.hash);
    return { redirigir: destino, ctx: construirCtx(h) };
  }

  /* --------------------------------------------------------------- API de App */

  App.ctx = function () {
    return resolver().ctx;
  };

  // Acepta "#/alumno/tareas", "/alumno/tareas" o "alumno/tareas".
  App.ir = function (ruta) {
    var r = String(ruta == null ? '' : ruta);
    if (r.charAt(0) !== '#') r = '#' + (r.charAt(0) === '/' ? r : '/' + r);
    fijarMenu(false);
    if (location.hash === r) { pintar(false); return; }
    location.hash = r;
  };

  App.refrescar = function () {
    pintar(true);
  };

  /* ----------------------------------------------------------------- pintado */

  function pintar(conservarScroll) {
    var raiz = document.getElementById('raiz');
    if (!raiz) return;
    try {
      pintarInterno(raiz, conservarScroll);
    } catch (e) {
      raiz.innerHTML = pantallaError(e && e.message ? e.message : e);
    }
  }

  function pintarInterno(raiz, conservarScroll) {
    var contenidoPrevio = document.querySelector('.contenido');
    var yContenido = contenidoPrevio ? contenidoPrevio.scrollTop : 0;
    var yVentana = window.pageYOffset || document.documentElement.scrollTop || 0;

    var r = resolver();
    if (r.redirigir && location.hash !== r.redirigir) {
      location.hash = r.redirigir;   // el evento hashchange vuelve a pintar
      return;
    }

    var ctx = r.ctx;
    if (!PANELES[ctx.zona]) menuAbierto = false;

    raiz.innerHTML = dibujar(ctx);
    ponerTitulo(ctx);

    if (conservarScroll) {
      var contenido = document.querySelector('.contenido');
      if (contenido) contenido.scrollTop = yContenido;
      window.scrollTo(0, yVentana);
    } else {
      window.scrollTo(0, 0);
    }

    var vista = VISTAS[ctx.zona];
    if (vista && esFn(vista.montado)) {
      try {
        vista.montado(ctx);
      } catch (e) {
        intentar(function () { return U.toast('No se pudo terminar de cargar la sección', 'crit'); }, null);
      }
    }
  }

  function dibujar(ctx) {
    if (ctx.zona === 'acceso') return pantallaAcceso();
    var vista = VISTAS[ctx.zona];
    if (!vista) return pantallaError('No hay una vista registrada para «' + ctx.zona + '».');
    if (ctx.zona === 'publico') return vista.render(ctx);
    return cascaron(ctx, vista);
  }

  function ponerTitulo(ctx) {
    var extra = '';
    if (ctx.zona === 'acceso') {
      extra = 'Acceso a la demostración';
    } else {
      var vista = VISTAS[ctx.zona];
      var item = vista ? itemPorId(navDe(vista), ctx.seccion) : null;
      extra = (item && item.texto) ? item.texto : (vista && vista.titulo ? vista.titulo : '');
    }
    document.title = DB.escuela.nombre + ((extra && extra !== DB.escuela.nombre) ? ' · ' + extra : '');
  }

  /* ------------------------------------------------------- cascarón con sesión */

  function cascaron(ctx, vista) {
    var nav = navDe(vista);
    var activo = itemPorId(nav, ctx.seccion) || nav[0] || null;
    var cuerpo = vista.render(ctx);
    return '' +
      '<div class="shell">' +
        riel(ctx, vista, nav) +
        '<div class="principal">' +
          topbar(ctx, vista, activo) +
          '<main class="contenido"><div class="contenedor">' + cuerpo + '</div></main>' +
        '</div>' +
      '</div>' +
      '<button type="button" class="velo' + (menuAbierto ? '' : ' oculto') + '" id="velo"' +
        acc('app:cerrarMenu') + ' aria-label="Cerrar el menú"></button>';
  }

  function riel(ctx, vista, nav) {
    var escuela = DB.escuela;
    var conteos = conteosNav(ctx, nav);

    var items = nav.map(function (item) {
      var esActivo = item.id === ctx.seccion;
      var n = conteos[item.id] || 0;
      return '<button type="button" class="riel-nav-item"' +
          acc('app:ir', { ruta: '#/' + ctx.zona + '/' + item.id }) +
          (esActivo ? ' aria-current="page"' : '') + '>' +
          U.icono(item.icono || 'punto', 18) +
          '<span class="truncar">' + U.esc(item.texto || item.id) + '</span>' +
          (n > 0 ? '<span class="conteo">' + n + '</span>' : '') +
        '</button>';
    }).join('');

    return '<aside class="riel' + (menuAbierto ? ' abierto' : '') + '" id="riel">' +
        '<div class="riel-marca">' +
          '<button type="button" class="fila crece"' + acc('app:ir', { ruta: '#/publico' }) +
            ' style="border:0;background:none;padding:0;font:inherit;color:inherit;cursor:pointer;text-align:left"' +
            ' title="Ver el sitio público">' +
            '<span class="sello">' + U.esc(escuela.sello) + '</span>' +
            '<span class="crece truncar">' +
              '<span class="nombre truncar" style="display:block">' + U.esc(escuela.nombre) + '</span>' +
              '<span class="ciclo" style="display:block">Ciclo ' + U.esc(escuela.ciclo) + '</span>' +
            '</span>' +
          '</button>' +
        '</div>' +
        '<nav class="riel-nav" aria-label="Secciones">' +
          '<span class="etiqueta">' + U.esc(vista.titulo || 'Panel') + '</span>' +
          items +
        '</nav>' +
        '<div class="riel-pie">' +
          '<div class="riel-persona">' +
            (ctx.persona ? U.avatar(ctx.persona, 'sm') : '') +
            '<div class="crece truncar">' +
              '<div class="nom truncar">' + U.esc(ctx.persona ? ctx.persona.nombre : '') + '</div>' +
              '<div class="rol truncar">' + U.esc(rolLegible(ctx)) + '</div>' +
            '</div>' +
          '</div>' +
          '<div class="fila gap-1 mt-1">' +
            '<button type="button" class="btn btn-fantasma btn-sm crece"' + acc('app:tema') +
              ' title="Cambiar entre tema claro y oscuro">' +
              U.icono(iconoTema(), 15) + '<span>Tema</span>' +
            '</button>' +
            '<button type="button" class="btn btn-fantasma btn-sm"' + acc('app:salir') + '>' +
              U.icono('salir', 15) + '<span>Salir</span>' +
            '</button>' +
          '</div>' +
        '</div>' +
      '</aside>';
  }

  function topbar(ctx, vista, activo) {
    var titulo = (activo && activo.texto) ? activo.texto : (vista.titulo || DB.escuela.nombre);
    var sub;
    if (activo && activo.sub) sub = activo.sub;
    else if (vista.titulo && vista.titulo !== titulo) sub = vista.titulo;
    else sub = DB.escuela.nombre + ' · ciclo ' + DB.escuela.ciclo;

    return '<header class="topbar">' +
        '<button type="button" class="btn btn-fantasma btn-icono btn-menu"' + acc('app:menu') +
          ' aria-label="Abrir el menú">' + U.icono('menu', 18) + '</button>' +
        '<div class="crece">' +
          '<h1 class="truncar">' + U.esc(titulo) + '</h1>' +
          '<div class="sub truncar">' + U.esc(sub) + '</div>' +
        '</div>' +
        '<button type="button" class="btn btn-fantasma btn-sm"' + acc('app:ir', { ruta: '#/publico' }) + '>' +
          U.icono('casa', 15) + '<span class="nowrap">Sitio público</span>' +
        '</button>' +
        (ctx.persona ? U.avatar(ctx.persona, 'sm') : '') +
      '</header>';
  }

  function rolLegible(ctx) {
    if (ctx.zona === 'direccion' && ctx.persona && ctx.persona.cargo) return ctx.persona.cargo;
    return ROL_LEGIBLE[ctx.rol] || '';
  }

  // Conteos vivos junto a la entrada de nav que corresponde en cada panel.
  function conteosNav(ctx, nav) {
    var mapa = {};
    nav.forEach(function (item) {
      if (typeof item.conteo === 'number' && item.conteo > 0) mapa[item.id] = item.conteo;
    });

    var destino = null;
    var n = 0;
    if (ctx.zona === 'alumno') {
      destino = idQueCoincide(nav, /tarea|entrega|pendien/i);
      n = intentar(function () { return contarPorEntregar(ctx.id); }, 0);
    } else if (ctx.zona === 'profesor') {
      destino = idQueCoincide(nav, /rese|reseñ|opini|valorac/i);
      n = intentar(function () { return (Q.resenasDeProfesor(ctx.id, 'pendiente') || []).length; }, 0);
    } else if (ctx.zona === 'direccion') {
      destino = idQueCoincide(nav, /riesg|alerta/i) || idQueCoincide(nav, /alumn/i);
      n = intentar(function () { return (Q.riesgo() || []).length; }, 0);
    }
    // El conteo que la propia vista declaró en su nav manda sobre el calculado aquí.
    if (destino && n > 0 && !Object.prototype.hasOwnProperty.call(mapa, destino)) mapa[destino] = n;
    return mapa;
  }

  function contarPorEntregar(alumnoId) {
    var n = 0;
    (Q.tareasDeAlumno(alumnoId) || []).forEach(function (fila) {
      var e = fila && fila.entrega;
      if (e && (e.estado === 'pendiente' || e.estado === 'atrasada')) n++;
    });
    return n;
  }

  /* -------------------------------------------------------- pantalla de acceso */

  function pantallaAcceso() {
    var escuela = DB.escuela;

    var deDireccion = DB.direccion ? [tarjetaCuenta('direccion', DB.direccion, {
      a: U.esc(DB.direccion.cargo || 'Dirección general'),
      b: U.esc(DB.direccion.email || '')
    })] : [];

    var deProfesores = DB.profesores.map(function (p) {
      return tarjetaCuenta('profesor', p, detalleProfesor(p));
    });

    var deAlumnos = DB.alumnos.map(function (a) {
      return tarjetaCuenta('alumno', a, detalleAlumno(a));
    });

    var total = deDireccion.length + deProfesores.length + deAlumnos.length;

    return '<div class="acceso">' +
        '<div class="acceso-interior">' +
          '<div class="entre mb-3">' +
            '<button type="button" class="btn btn-fantasma btn-sm"' + acc('app:ir', { ruta: '#/publico' }) + '>' +
              U.icono('flecha-izq', 15) + '<span>Volver al sitio</span>' +
            '</button>' +
            '<button type="button" class="btn btn-fantasma btn-sm btn-icono"' + acc('app:tema') +
              ' aria-label="Cambiar entre tema claro y oscuro">' + U.icono(iconoTema(), 16) + '</button>' +
          '</div>' +

          '<div class="fila gap-2 mb-2">' +
            '<span class="sello sello-lg">' + U.esc(escuela.sello) + '</span>' +
            '<div>' +
              '<div class="destacado" style="font-size:1.06rem;font-weight:600">' + U.esc(escuela.nombre) + '</div>' +
              '<div class="silencio">Ciclo ' + U.esc(escuela.ciclo) + ' · Portal escolar</div>' +
            '</div>' +
          '</div>' +

          '<h1 class="acceso-tit">Elige una cuenta para entrar</h1>' +
          '<p class="silencio mb-2">' + total + ' cuentas de ejemplo, listas con su información completa. ' +
            'Puedes cambiar de cuenta cuando quieras desde el botón de salir.</p>' +

          '<div class="aviso-demo mb-3">' + U.icono('info', 17) +
            '<div><strong>Esto es una demostración.</strong> No hay contraseñas: al pulsar una cuenta entras ' +
            'directo. Todos los nombres, calificaciones y pagos son ficticios y viven sólo en este navegador.</div>' +
          '</div>' +

          grupoCuentas('Dirección', deDireccion) +
          grupoCuentas('Profesores', deProfesores) +
          grupoCuentas('Alumnos', deAlumnos) +

          '<div class="separador"></div>' +
          '<div class="fila envuelve gap-1">' +
            '<button type="button" class="btn btn-sm"' + acc('app:reiniciarDemo') + '>' +
              U.icono('alerta', 15) + '<span>Reiniciar los datos de la demostración</span>' +
            '</button>' +
            '<span class="silencio" style="font-size:.8rem">Devuelve todo a su estado original.</span>' +
          '</div>' +
        '</div>' +
      '</div>';
  }

  function grupoCuentas(titulo, tarjetas) {
    if (!tarjetas.length) return '';
    return '<div class="seccion">' +
        '<span class="etiqueta">' + U.esc(titulo) + ' · ' + tarjetas.length + '</span>' +
        '<div class="cuentas mt-1">' + tarjetas.join('') + '</div>' +
      '</div>';
  }

  function tarjetaCuenta(rol, persona, detalle) {
    return '<button type="button" class="cuenta"' + acc('app:entrar', { rol: rol, id: persona.id }) + '>' +
        U.avatar(persona, 'md') +
        '<div class="crece">' +
          '<div class="nom truncar">' + U.esc(persona.nombre) + '</div>' +
          '<div class="det truncar">' + detalle.a + '</div>' +
          (detalle.b ? '<div class="det truncar">' + detalle.b + '</div>' : '') +
        '</div>' +
        U.icono('flecha-der', 16) +
      '</button>';
  }

  function detalleProfesor(p) {
    var materias = intentar(function () { return Q.materiasDeProfesor(p.id) || []; }, []);
    var nombres = materias.map(function (m) { return m.nombre; }).join(' · ');
    return {
      a: 'Clave ' + U.esc(p.clave) + ' · ' + materias.length + (materias.length === 1 ? ' materia' : ' materias'),
      b: nombres ? U.esc(nombres) : 'Sin materias asignadas'
    };
  }

  function detalleAlumno(a) {
    var promedio = intentar(function () { return Q.promedioGeneral(a.id); }, null);
    return {
      a: 'Matrícula ' + U.esc(a.matricula) + ' · Promedio ' + U.notaTexto(promedio),
      b: (a.estatus && a.estatus !== 'activo')
        ? U.badge(capitalizar(a.estatus), a.estatus === 'baja' ? 'crit' : 'aviso')
        : ''
    };
  }

  /* -------------------------------------------------------- pantalla de error */

  function pantallaError(mensaje) {
    return '<div class="acceso"><div class="acceso-interior">' +
        '<div class="panel">' +
          '<div class="panel-cab"><div>' +
            '<h3 class="panel-tit">No se pudo dibujar esta sección</h3>' +
            '<p class="panel-sub">La demostración sigue viva. Vuelve al sitio o reinicia los datos para dejarla como nueva.</p>' +
          '</div></div>' +
          '<div class="panel-cuerpo">' +
            '<div class="caja-suave mono" style="font-size:.8rem">' + escSeguro(mensaje) + '</div>' +
            '<div class="fila envuelve gap-1 mt-2">' +
              '<button type="button" class="btn btn-primario" data-accion="app:ir" ' +
                'data-args=\'{"ruta":"#/publico"}\'>Ir al sitio público</button>' +
              '<button type="button" class="btn btn-peligro" data-accion="app:reiniciarDemo">' +
                'Reiniciar la demostración</button>' +
            '</div>' +
          '</div>' +
        '</div>' +
      '</div></div>';
  }

  /* --------------------------------------------------------------- menú y tema */

  function fijarMenu(abierto) {
    menuAbierto = !!abierto;
    var elRiel = document.getElementById('riel');
    var elVelo = document.getElementById('velo');
    if (elRiel) {
      if (menuAbierto) elRiel.classList.add('abierto');
      else elRiel.classList.remove('abierto');
    }
    if (elVelo) {
      if (menuAbierto) elVelo.classList.remove('oculto');
      else elVelo.classList.add('oculto');
    }
  }

  function temaActual() {
    var t = document.documentElement.getAttribute('data-theme');
    if (t === 'dark' || t === 'light') return t;
    var oscuro = intentar(function () {
      return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    }, false);
    return oscuro ? 'dark' : 'light';
  }

  function iconoTema() {
    return temaActual() === 'dark' ? 'ojo-cerrado' : 'ojo';
  }

  function restaurarTema() {
    var t = intentar(function () { return window.localStorage.getItem(LLAVE_TEMA); }, null);
    if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
  }

  function guardarTema(t) {
    intentar(function () { window.localStorage.setItem(LLAVE_TEMA, t); return true; }, false);
  }

  /* ----------------------------------------------------------------- acciones */

  var GLOBALES = {

    'app:nada': function () { },

    'app:ir': function (args) {
      App.ir(args && args.ruta ? args.ruta : '#/publico');
    },

    'app:menu': function () {
      fijarMenu(!menuAbierto);
    },

    'app:cerrarMenu': function () {
      fijarMenu(false);
    },

    'app:cerrarModal': function () {
      U.cerrarModal();
    },

    'app:entrar': function (args) {
      if (!args || !args.rol || !args.id) return;
      var entro = Sesion.entrar(args.rol, args.id);
      var persona = Sesion.persona();
      if (entro === false || !persona) {
        U.toast('Esa cuenta ya no está disponible', 'crit');
        App.ir('#/acceso');
        return;
      }
      U.toast('Entraste como ' + persona.nombre, 'ok');
      App.ir('#/' + args.rol);
    },

    'app:salir': function () {
      U.confirmar({
        titulo: 'Cerrar la sesión',
        texto: 'Vuelves al sitio público. Los datos de la demostración se conservan tal como están.',
        textoOk: 'Cerrar sesión',
        accion: 'app:salirConfirmado'
      });
    },

    'app:salirConfirmado': function () {
      U.cerrarModal();
      Sesion.salir();
      U.toast('Sesión cerrada');
      App.ir('#/publico');
    },

    'app:reiniciarDemo': function () {
      U.confirmar({
        titulo: 'Reiniciar la demostración',
        texto: 'Se descartan todos los cambios que hiciste y vuelven los datos originales. No se puede deshacer.',
        textoOk: 'Reiniciar todo',
        peligro: true,
        accion: 'app:reiniciarConfirmado'
      });
    },

    'app:reiniciarConfirmado': function () {
      U.cerrarModal();
      Store.reiniciar();
      U.toast('Demostración reiniciada', 'ok');
      App.ir('#/publico');
    },

    'app:tema': function () {
      var siguiente = temaActual() === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', siguiente);
      guardarTema(siguiente);
      App.refrescar();   // vuelve a pintar para que el icono coincida con el tema
    }
  };

  function mezclarAcciones(origen) {
    if (!origen || typeof origen !== 'object') return;
    Object.keys(origen).forEach(function (clave) {
      if (esFn(origen[clave])) Acciones[clave] = origen[clave];
    });
  }

  function armarAcciones() {
    [VistaPublica, VistaAlumno, VistaProfesor, VistaDireccion].forEach(function (vista) {
      mezclarAcciones(vista && vista.acciones);
    });
    mezclarAcciones(GLOBALES);   // las globales van al final: el cascarón siempre responde
  }

  function despachar(nombre, args, ev, el) {
    if (!nombre) return;
    if (!Object.prototype.hasOwnProperty.call(Acciones, nombre)) return;
    var manejador = Acciones[nombre];
    if (!esFn(manejador)) return;
    try {
      manejador(args || {}, ev, el);
    } catch (e) {
      intentar(function () { return U.toast('No se pudo completar la acción', 'crit'); }, null);
    }
  }

  /* -------------------------------------------------------- delegación global */

  function alClic(ev) {
    var el = masCercano(ev.target, '[data-accion]');
    if (!el || el.disabled) return;
    if (el.tagName.toLowerCase() === 'a') {
      var href = el.getAttribute('href');
      if (!href || href === '#') ev.preventDefault();
    }
    despachar(el.getAttribute('data-accion'), leerArgs(el), ev, el);
  }

  function alCambio(ev) {
    var el = masCercano(ev.target, '[data-cambio]');
    if (!el) return;
    despachar(el.getAttribute('data-cambio'), leerArgs(el), ev, el);
  }

  function alEntrada(ev) {
    var el = masCercano(ev.target, '[data-entrada]');
    if (!el) return;
    despachar(el.getAttribute('data-entrada'), leerArgs(el), ev, el);
  }

  function alEnvio(ev) {
    var form = masCercano(ev.target, 'form[data-envio]');
    if (!form) return;
    ev.preventDefault();
    var args = leerArgs(form);
    args.datos = datosDeFormulario(form);
    despachar(form.getAttribute('data-envio'), args, ev, form);
  }

  function alTecla(ev) {
    if (ev.key !== 'Enter' || ev.defaultPrevented) return;
    var el = masCercano(ev.target, '[data-accion]');
    if (!el || el.disabled) return;
    var etiqueta = el.tagName.toLowerCase();
    // Botones y enlaces ya disparan clic por su cuenta; los campos tienen su propio Enter.
    if (etiqueta === 'button' || etiqueta === 'a' || etiqueta === 'input' ||
        etiqueta === 'textarea' || etiqueta === 'select') return;
    ev.preventDefault();
    despachar(el.getAttribute('data-accion'), leerArgs(el), ev, el);
  }

  // FormData + las casillas sin marcar como false (FormData las omite).
  function datosDeFormulario(form) {
    var datos = {};
    var fd = new FormData(form);
    fd.forEach(function (valor, clave) {
      if (Object.prototype.hasOwnProperty.call(datos, clave)) {
        if (!Array.isArray(datos[clave])) datos[clave] = [datos[clave]];
        datos[clave].push(valor);
      } else {
        datos[clave] = valor;
      }
    });
    var casillas = form.querySelectorAll('input[type="checkbox"]');
    for (var i = 0; i < casillas.length; i++) {
      var c = casillas[i];
      if (!c.name) continue;
      if (!c.checked) {
        // Sólo cuenta como false si ninguna casilla marcada dejó ya un valor con ese nombre
        // (en un grupo de casillas, la desmarcada no debe borrar a sus compañeras).
        if (!Object.prototype.hasOwnProperty.call(datos, c.name)) datos[c.name] = false;
      } else if (c.value === '' || c.value === 'on') {
        datos[c.name] = true;
      }
    }
    return datos;
  }

  function registrarEventos() {
    document.addEventListener('click', alClic);
    document.addEventListener('change', alCambio);
    document.addEventListener('input', alEntrada);
    document.addEventListener('submit', alEnvio);
    document.addEventListener('keydown', alTecla);
    // Al ensanchar la ventana el riel vuelve a ser fijo: el velo se quedaría tapando el contenido.
    window.addEventListener('resize', function () {
      if (menuAbierto && window.innerWidth > 900) fijarMenu(false);
    });
  }

  /* ----------------------------------------------------------------- arranque */

  function arrancar() {
    Store.cargar();
    restaurarTema();
    VISTAS = {
      publico: VistaPublica,
      alumno: VistaAlumno,
      profesor: VistaProfesor,
      direccion: VistaDireccion
    };
    armarAcciones();
    registrarEventos();
    Store.suscribir(App.refrescar);
    window.addEventListener('hashchange', function () {
      fijarMenu(false);
      pintar(false);
    });
    pintar(false);   // pintar() ya lleva su propio try/catch y pantalla de error
  }

  arrancar();

})();
</script>
