<title>Colegio Altamira</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* ============================================================================
   Colegio Altamira — hoja de estilo única
   Identidad: añil de tinta + latón de sello sobre papel frío.
   Display: Fraunces · Interfaz: IBM Plex Sans · Datos: IBM Plex Mono
   ========================================================================== */

/* ---------- 1. Tokens: claro (estado base, siempre completo) -------------- */
:root {
  color-scheme: light;

  --fondo:          #E9EDF2;
  --superficie:     #FFFFFF;
  --superficie-2:   #F4F6F9;
  --superficie-3:   #E7ECF2;
  --tinta:          #0E1D2B;
  --tinta-2:        #46586B;
  --tinta-3:        #6F8095;
  --linea:          #D8E0E9;
  --linea-fuerte:   #B9C6D4;

  --marca:          #1B4B7A;
  --marca-ink:      #123A61;
  --marca-contraste:#FFFFFF;
  --marca-suave:    #E2EBF4;

  --acento:         #A9762A;
  --acento-suave:   #F5EBD8;

  --ok:             #16704F;
  --ok-suave:       #DDEFE7;
  --aviso:          #9A6410;
  --aviso-suave:    #F8EBD4;
  --crit:           #A9302A;
  --crit-suave:     #F8E1DF;
  --info:           #1B4B7A;
  --info-suave:     #E2EBF4;

  --serie-1: #1B4B7A;
  --serie-2: #16704F;
  --serie-3: #A9762A;
  --serie-4: #6E3A63;
  --serie-5: #2C7793;
  --serie-6: #9C4A3D;

  --sombra-1: 0 1px 2px rgba(14,29,43,.06), 0 1px 3px rgba(14,29,43,.05);
  --sombra-2: 0 4px 14px rgba(14,29,43,.10), 0 1px 3px rgba(14,29,43,.06);
  --sombra-3: 0 18px 48px rgba(14,29,43,.20);

  --r-sm: 4px;
  --r-md: 8px;
  --r-lg: 14px;
  --r-full: 999px;

  --riel-w: 246px;
  --topbar-h: 62px;

  --f-display: "Fraunces", "Iowan Old Style", Georgia, serif;
  --f-ui: "IBM Plex Sans", ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
}

/* ---------- 2. Tokens: oscuro por preferencia del sistema ----------------- */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;

    --fondo:        #0A141E;
    --superficie:   #121F2C;
    --superficie-2: #172737;
    --superficie-3: #1E3143;
    --tinta:        #E7EEF6;
    --tinta-2:      #A2B5C8;
    --tinta-3:      #7A8EA3;
    --linea:        #24384C;
    --linea-fuerte: #35506B;

    --marca:        #7DB0DF;
    --marca-ink:    #A9CCEC;
    --marca-contraste:#08131E;
    --marca-suave:  #16324B;

    --acento:       #DCAE5C;
    --acento-suave: #3A2E17;

    --ok:           #5CC79B;
    --ok-suave:     #123329;
    --aviso:        #E0AC57;
    --aviso-suave:  #3A2B12;
    --crit:         #EE8C82;
    --crit-suave:   #3C1D1A;
    --info:         #7DB0DF;
    --info-suave:   #16324B;

    --serie-1: #7DB0DF;
    --serie-2: #5CC79B;
    --serie-3: #DCAE5C;
    --serie-4: #C08CBA;
    --serie-5: #6ABCD8;
    --serie-6: #E89184;

    --sombra-1: 0 1px 2px rgba(0,0,0,.36);
    --sombra-2: 0 4px 16px rgba(0,0,0,.44);
    --sombra-3: 0 18px 48px rgba(0,0,0,.60);
  }
}

/* ---------- 3. Tokens: oscuro elegido explícitamente ---------------------- */
:root[data-theme="dark"] {
  color-scheme: dark;

  --fondo:        #0A141E;
  --superficie:   #121F2C;
  --superficie-2: #172737;
  --superficie-3: #1E3143;
  --tinta:        #E7EEF6;
  --tinta-2:      #A2B5C8;
  --tinta-3:      #7A8EA3;
  --linea:        #24384C;
  --linea-fuerte: #35506B;

  --marca:        #7DB0DF;
  --marca-ink:    #A9CCEC;
  --marca-contraste:#08131E;
  --marca-suave:  #16324B;

  --acento:       #DCAE5C;
  --acento-suave: #3A2E17;

  --ok:           #5CC79B;
  --ok-suave:     #123329;
  --aviso:        #E0AC57;
  --aviso-suave:  #3A2B12;
  --crit:         #EE8C82;
  --crit-suave:   #3C1D1A;
  --info:         #7DB0DF;
  --info-suave:   #16324B;

  --serie-1: #7DB0DF;
  --serie-2: #5CC79B;
  --serie-3: #DCAE5C;
  --serie-4: #C08CBA;
  --serie-5: #6ABCD8;
  --serie-6: #E89184;

  --sombra-1: 0 1px 2px rgba(0,0,0,.36);
  --sombra-2: 0 4px 16px rgba(0,0,0,.44);
  --sombra-3: 0 18px 48px rgba(0,0,0,.60);
}

/* ---------- 4. Base ------------------------------------------------------- */
*, *::before, *::after { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: var(--fondo);
  color: var(--tinta);
  font-family: var(--f-ui);
  font-size: 15px;
  line-height: 1.55;
  font-feature-settings: "cv05" 1;
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3, h4 { margin: 0; font-weight: 600; text-wrap: balance; letter-spacing: -.011em; }
h1 { font-size: 1.55rem; line-height: 1.2; }
h2 { font-size: 1.2rem;  line-height: 1.25; }
h3 { font-size: 1.02rem; line-height: 1.3; }
h4 { font-size: .92rem;  line-height: 1.35; }
p  { margin: 0 0 .8em; }
p:last-child { margin-bottom: 0; }
a { color: var(--marca); text-decoration-color: color-mix(in srgb, var(--marca) 40%, transparent); text-underline-offset: 2px; }
a:hover { text-decoration-color: currentColor; }
img { max-width: 100%; display: block; }
hr { border: 0; border-top: 1px solid var(--linea); margin: 1.2rem 0; }
small { font-size: .82em; }

::selection { background: var(--marca-suave); color: var(--tinta); }

:where(button, a, input, select, textarea, [tabindex]):focus-visible {
  outline: 2px solid var(--marca);
  outline-offset: 2px;
  border-radius: var(--r-sm);
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

/* ---------- 5. Utilidades ------------------------------------------------- */
.oculto { display: none !important; }
.txt-c { text-align: center; }
.txt-d { text-align: right; }
.mt-0{margin-top:0}.mt-1{margin-top:.5rem}.mt-2{margin-top:1rem}.mt-3{margin-top:1.6rem}
.mb-0{margin-bottom:0}.mb-1{margin-bottom:.5rem}.mb-2{margin-bottom:1rem}.mb-3{margin-bottom:1.6rem}
.gap-1{gap:.5rem}.gap-2{gap:1rem}.gap-3{gap:1.5rem}
.ancho-total { width: 100%; }
.nowrap { white-space: nowrap; }
.truncar { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.crece { flex: 1 1 auto; min-width: 0; }
.mono { font-family: var(--f-mono); font-size: .88em; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.num  { font-variant-numeric: tabular-nums; text-align: right; }
.silencio { color: var(--tinta-3); }
.etiqueta {
  font-size: .68rem; font-weight: 600; letter-spacing: .1em; text-transform: uppercase;
  color: var(--tinta-3);
}
.destacado { font-family: var(--f-display); font-optical-sizing: auto; }

.fila { display: flex; align-items: center; gap: .6rem; }
.fila.envuelve { flex-wrap: wrap; }
.pila { display: flex; flex-direction: column; gap: .6rem; }
.entre { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
.centro { display: flex; align-items: center; justify-content: center; }

.rejilla { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 1.1rem; }
.col-3  { grid-column: span 3; }
.col-4  { grid-column: span 4; }
.col-6  { grid-column: span 6; }
.col-8  { grid-column: span 8; }
.col-12 { grid-column: span 12; }
@media (max-width: 1080px) { .col-3 { grid-column: span 6; } .col-4 { grid-column: span 6; } }
@media (max-width: 780px)  { .col-3, .col-4, .col-6, .col-8 { grid-column: span 12; } }

/* ---------- 6. Sello y marca --------------------------------------------- */
.sello {
  display: inline-flex; align-items: center; justify-content: center;
  width: 40px; height: 40px; flex: none;
  border-radius: 11px;
  background: var(--marca);
  color: var(--marca-contraste);
  font-family: var(--f-display);
  font-weight: 600;
  font-size: 1.02rem;
  letter-spacing: .01em;
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--acento) 45%, transparent);
}
.sello-lg { width: 68px; height: 68px; border-radius: 18px; font-size: 1.7rem; }

.cinta {
  display: inline-flex; align-items: center; gap: .4rem;
  padding: .22rem .6rem;
  border-radius: var(--r-full);
  background: var(--acento-suave);
  color: var(--acento);
  font-size: .72rem; font-weight: 600; letter-spacing: .04em; text-transform: uppercase;
}

/* ---------- 7. Cascarón de la app ---------------------------------------- */
.shell { display: flex; min-height: 100vh; }

.riel {
  width: var(--riel-w); flex: none;
  background: var(--superficie);
  border-right: 1px solid var(--linea);
  display: flex; flex-direction: column;
  position: sticky; top: 0; height: 100vh;
  z-index: 40;
}
.riel-marca {
  display: flex; align-items: center; gap: .65rem;
  padding: 1rem 1.1rem;
  border-bottom: 1px solid var(--linea);
  min-height: var(--topbar-h);
}
.riel-marca .nombre { font-family: var(--f-display); font-weight: 600; font-size: 1.02rem; line-height: 1.1; }
.riel-marca .ciclo { font-size: .72rem; color: var(--tinta-3); letter-spacing: .04em; }

.riel-nav { padding: .8rem .6rem; overflow-y: auto; flex: 1 1 auto; }
.riel-nav .etiqueta { padding: .6rem .5rem .3rem; display: block; }
.riel-nav-item {
  display: flex; align-items: center; gap: .65rem;
  width: 100%;
  padding: .52rem .6rem;
  margin-bottom: 1px;
  border: 0; border-radius: var(--r-md);
  background: transparent; color: var(--tinta-2);
  font: inherit; font-size: .9rem; font-weight: 500;
  text-align: left; cursor: pointer;
  text-decoration: none;
  transition: background .12s ease, color .12s ease;
}
.riel-nav-item svg { flex: none; opacity: .82; }
.riel-nav-item:hover { background: var(--superficie-2); color: var(--tinta); }
.riel-nav-item[aria-current="page"] {
  background: var(--marca-suave); color: var(--marca-ink); font-weight: 600;
}
.riel-nav-item[aria-current="page"] svg { opacity: 1; }
.riel-nav-item .conteo {
  margin-left: auto; font-family: var(--f-mono); font-size: .74rem;
  background: var(--superficie-3); color: var(--tinta-2);
  padding: 0 .38rem; border-radius: var(--r-full);
}
.riel-pie { border-top: 1px solid var(--linea); padding: .7rem; }
.riel-persona {
  display: flex; align-items: center; gap: .6rem; padding: .4rem .35rem; min-width: 0;
}
.riel-persona .nom { font-size: .85rem; font-weight: 600; }
.riel-persona .rol { font-size: .72rem; color: var(--tinta-3); }

.principal { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }

.topbar {
  position: sticky; top: 0; z-index: 30;
  min-height: var(--topbar-h);
  display: flex; align-items: center; gap: .8rem;
  padding: .6rem 1.4rem;
  background: color-mix(in srgb, var(--fondo) 88%, transparent);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--linea);
}
.topbar h1 { font-size: 1.12rem; }
.topbar .sub { font-size: .78rem; color: var(--tinta-3); }

.contenido { padding: 1.4rem; flex: 1 1 auto; }
.contenedor { max-width: 1180px; margin: 0 auto; }

.btn-menu { display: none; }
@media (max-width: 900px) {
  .riel {
    position: fixed; inset: 0 auto 0 0;
    transform: translateX(-100%);
    transition: transform .2s ease;
    box-shadow: var(--sombra-3);
  }
  .riel.abierto { transform: none; }
  .btn-menu { display: inline-flex; }
  .contenido { padding: 1rem; }
  .topbar { padding: .6rem 1rem; }
}

.velo {
  position: fixed; inset: 0; z-index: 35;
  background: rgba(6, 16, 26, .48);
  border: 0;
}

/* ---------- 8. Secciones y paneles --------------------------------------- */
.seccion { margin-bottom: 1.6rem; }
.seccion:last-child { margin-bottom: 0; }
.seccion-cab {
  display: flex; align-items: flex-end; justify-content: space-between;
  gap: 1rem; flex-wrap: wrap; margin-bottom: .8rem;
}
.seccion-cab h2 { font-family: var(--f-display); font-optical-sizing: auto; font-weight: 600; }
.seccion-cab .sub { font-size: .85rem; color: var(--tinta-3); margin-top: .1rem; }

.panel {
  background: var(--superficie);
  border: 1px solid var(--linea);
  border-radius: var(--r-lg);
  overflow: hidden;
}
.panel-cab {
  display: flex; align-items: center; justify-content: space-between; gap: 1rem;
  padding: .85rem 1.1rem;
  border-bottom: 1px solid var(--linea);
  flex-wrap: wrap;
}
.panel-tit { font-size: .96rem; font-weight: 600; margin: 0; }
.panel-sub { font-size: .78rem; color: var(--tinta-3); margin: .1rem 0 0; }
.panel-acc { display: flex; align-items: center; gap: .45rem; flex-wrap: wrap; }
.panel-cuerpo { padding: 1.1rem; }
.panel-cuerpo.sin-relleno { padding: 0; }
.panel-pie {
  padding: .7rem 1.1rem; border-top: 1px solid var(--linea);
  background: var(--superficie-2); font-size: .82rem; color: var(--tinta-2);
}

.tarjeta {
  background: var(--superficie); border: 1px solid var(--linea);
  border-radius: var(--r-md); padding: .9rem 1rem;
}
.tarjeta-plana { background: var(--superficie-2); border-radius: var(--r-md); padding: .85rem .95rem; }
.caja-suave {
  background: var(--superficie-2); border-radius: var(--r-md);
  padding: .8rem .95rem; border: 1px solid var(--linea);
}
.separador { height: 1px; background: var(--linea); margin: .9rem 0; }

.lista { list-style: none; margin: 0; padding: 0; }
.lista-item {
  display: flex; align-items: center; gap: .8rem;
  padding: .72rem 1.1rem;
  border-bottom: 1px solid var(--linea);
}
.lista-item:last-child { border-bottom: 0; }
.lista-item .crece { min-width: 0; }
.lista-item .t { font-size: .9rem; font-weight: 550; }
.lista-item .d { font-size: .79rem; color: var(--tinta-3); }
a.lista-item, button.lista-item {
  width: 100%; background: none; border-left: 0; border-right: 0; border-top: 0;
  font: inherit; color: inherit; text-align: left; cursor: pointer; text-decoration: none;
}
a.lista-item:hover, button.lista-item:hover { background: var(--superficie-2); }

/* ---------- 9. KPI -------------------------------------------------------- */
.kpi {
  background: var(--superficie); border: 1px solid var(--linea);
  border-radius: var(--r-lg); padding: .95rem 1.05rem;
  display: flex; flex-direction: column; gap: .1rem; height: 100%;
}
.kpi-etiqueta {
  font-size: .7rem; font-weight: 600; letter-spacing: .09em; text-transform: uppercase;
  color: var(--tinta-3); display: flex; align-items: center; gap: .38rem;
}
.kpi-valor {
  font-family: var(--f-display); font-optical-sizing: auto;
  font-size: 1.95rem; font-weight: 600; line-height: 1.12; letter-spacing: -.02em;
  font-variant-numeric: tabular-nums; margin-top: .15rem;
}
.kpi-valor .unidad { font-size: .95rem; font-weight: 500; color: var(--tinta-3); margin-left: .12rem; }
.kpi-sub { font-size: .8rem; color: var(--tinta-2); }
.kpi-pie { margin-top: auto; padding-top: .55rem; font-size: .76rem; color: var(--tinta-3); }
.kpi.v-ok    .kpi-valor { color: var(--ok); }
.kpi.v-aviso .kpi-valor { color: var(--aviso); }
.kpi.v-crit  .kpi-valor { color: var(--crit); }
.kpi.v-marca .kpi-valor { color: var(--marca-ink); }

/* ---------- 10. Tablas ---------------------------------------------------- */
.tabla-envoltura { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.tabla { width: 100%; border-collapse: collapse; font-size: .875rem; }
.tabla th {
  text-align: left; font-weight: 600; font-size: .7rem; letter-spacing: .08em;
  text-transform: uppercase; color: var(--tinta-3);
  padding: .6rem .8rem; border-bottom: 1px solid var(--linea);
  background: var(--superficie-2); white-space: nowrap; position: sticky; top: 0;
}
.tabla td { padding: .62rem .8rem; border-bottom: 1px solid var(--linea); vertical-align: middle; }
.tabla tbody tr:last-child td { border-bottom: 0; }
.tabla tbody tr:hover td { background: var(--superficie-2); }
.tabla th.num, .tabla td.num { text-align: right; }
.tabla th.centro-col, .tabla td.centro-col { text-align: center; }
.tabla td.mono { font-family: var(--f-mono); font-size: .82rem; }
.tabla .fila-atenuada td { opacity: .58; }

.nota-alta  { color: var(--ok);    font-weight: 600; }
.nota-media { color: var(--aviso); font-weight: 600; }
.nota-baja  { color: var(--crit);  font-weight: 600; }

/* ---------- 11. Botones --------------------------------------------------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: .4rem;
  padding: .46rem .85rem;
  border: 1px solid var(--linea-fuerte);
  border-radius: var(--r-md);
  background: var(--superficie);
  color: var(--tinta);
  font: inherit; font-size: .86rem; font-weight: 550;
  cursor: pointer; text-decoration: none; white-space: nowrap;
  transition: background .12s ease, border-color .12s ease, color .12s ease;
}
.btn:hover { background: var(--superficie-2); border-color: var(--tinta-3); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn svg { flex: none; }

.btn-primario { background: var(--marca); border-color: var(--marca); color: var(--marca-contraste); }
.btn-primario:hover { background: var(--marca-ink); border-color: var(--marca-ink); color: var(--marca-contraste); }

.btn-suave { background: var(--marca-suave); border-color: transparent; color: var(--marca-ink); }
.btn-suave:hover { background: color-mix(in srgb, var(--marca-suave) 70%, var(--marca) 12%); border-color: transparent; }

.btn-fantasma { background: transparent; border-color: transparent; color: var(--tinta-2); }
.btn-fantasma:hover { background: var(--superficie-2); border-color: transparent; color: var(--tinta); }

.btn-peligro { background: var(--crit-suave); border-color: transparent; color: var(--crit); }
.btn-peligro:hover { background: var(--crit); border-color: var(--crit); color: var(--superficie); }

.btn-sm { padding: .28rem .58rem; font-size: .78rem; border-radius: var(--r-sm); }
.btn-bloque { width: 100%; }
.btn-icono { padding: .42rem; border-radius: var(--r-md); }
.btn-icono.btn-sm { padding: .28rem; }

/* ---------- 12. Insignias ------------------------------------------------- */
.badge {
  display: inline-flex; align-items: center; gap: .3rem;
  padding: .13rem .5rem;
  border-radius: var(--r-full);
  font-size: .72rem; font-weight: 600; line-height: 1.5;
  white-space: nowrap;
  background: var(--superficie-3); color: var(--tinta-2);
}
.badge-ok     { background: var(--ok-suave);    color: var(--ok); }
.badge-aviso  { background: var(--aviso-suave); color: var(--aviso); }
.badge-crit   { background: var(--crit-suave);  color: var(--crit); }
.badge-info   { background: var(--info-suave);  color: var(--info); }
.badge-marca  { background: var(--marca-suave); color: var(--marca-ink); }
.badge-neutro { background: var(--superficie-3);color: var(--tinta-2); }

.chip {
  display: inline-flex; align-items: center; gap: .3rem;
  padding: .2rem .6rem; border-radius: var(--r-full);
  border: 1px solid var(--linea); background: var(--superficie-2);
  font-size: .78rem; color: var(--tinta-2);
}

/* ---------- 13. Avatares -------------------------------------------------- */
.avatar {
  display: inline-flex; align-items: center; justify-content: center;
  flex: none; overflow: hidden;
  width: 38px; height: 38px; border-radius: var(--r-full);
  background: var(--marca); color: #fff;
  font-weight: 600; font-size: .82rem; letter-spacing: .01em;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.16);
  user-select: none;

   30-store.js — Núcleo de datos de Colegio Altamira.

/* Fecha fija de la demostración: viernes 14 de noviembre de 2025, 9:00 h.
   Todo cálculo relativo (vencimientos, días restantes, sellos de captura)
   se hace contra HOY para que la demo sea idéntica en cualquier equipo. */
const HOY = new Date(2025, 10, 14, 9, 0, 0);

/* Estado vivo de la aplicación. Lo puebla Store.cargar() al final del archivo. */
var DB;

/* ---------------------------------------------------------------- Store --- */
const Store = (function () {

  var CLAVE_DB = 'altamira.db.v3';
  var suscriptores = [];
  var COLECCIONES = [
    'alumnos', 'profesores', 'materias', 'inscripciones', 'evaluaciones',
    'calificaciones', 'asistencias', 'tareas', 'entregas', 'materiales',
    'avisos', 'pagos', 'resenas', 'bitacora'
  ];

  function clonar(valor) { return JSON.parse(JSON.stringify(valor)); }

  /* Garantiza que DB tenga todas las piezas aunque el respaldo venga incompleto. */
  function sanear(datos) {
    if (!datos.escuela || typeof datos.escuela !== 'object') datos.escuela = clonar(SEMILLA.escuela);
    if (!datos.direccion || typeof datos.direccion !== 'object') datos.direccion = clonar(SEMILLA.direccion);
    if (typeof datos.contador !== 'number' || !isFinite(datos.contador)) datos.contador = SEMILLA.contador;
    datos.version = SEMILLA.version;
    COLECCIONES.forEach(function (llave) {
      if (!Array.isArray(datos[llave])) datos[llave] = clonar(SEMILLA[llave] || []);
    });
    return datos;
  }

  return {

    clave: CLAVE_DB,
    clonar: clonar,

    /* Fecha (Date) a cadena 'AAAA-MM-DD' en hora local. Sin argumento, usa HOY. */
    iso: function (fecha) {
      var d = (fecha instanceof Date && isFinite(fecha.getTime())) ? fecha : HOY;
      var mes = d.getMonth() + 1;
      var dia = d.getDate();
      return d.getFullYear() + '-' + (mes < 10 ? '0' + mes : mes) + '-' + (dia < 10 ? '0' + dia : dia);
    },

    cargar: function () {
      var crudo = null;
      var datos = null;
      try { crudo = window.localStorage.getItem(CLAVE_DB); }
      catch (e) { crudo = null; }               /* modo privado o marco restringido */
      if (crudo) {
        try { datos = JSON.parse(crudo); }
        catch (e) { datos = null; }             /* respaldo corrupto: se re-siembra */
      }
      if (!datos || typeof datos !== 'object' || datos.version !== SEMILLA.version) {
        datos = clonar(SEMILLA);
      }
      DB = sanear(datos);
      return DB;
    },

    guardar: function () {
      try { window.localStorage.setItem(CLAVE_DB, JSON.stringify(DB)); }
      catch (e) { /* sin almacenamiento: la demo sigue funcionando en memoria */ }
      suscriptores.slice().forEach(function (fn) {
        try { fn(DB); }
        catch (e) { /* un suscriptor con error no debe tumbar a los demás */ }
      });
    },

    reiniciar: function () {
      try { window.localStorage.removeItem(CLAVE_DB); }
      catch (e) { /* nada que borrar */ }
      DB = sanear(clonar(SEMILLA));
      Sesion.salir();
      Store.guardar();
      return { ok: true };
    },

    suscribir: function (fn) {
      if (typeof fn !== 'function') return function () {};
      suscriptores.push(fn);
      return function () {
        var i = suscriptores.indexOf(fn);
        if (i >= 0) suscriptores.splice(i, 1);
      };
    },

    uid: function (pfx) {
      return String(pfx || 'id') + '-' + (DB.contador++);
    },

    bitacora: function (texto) {
      var s = Sesion.actual();
      DB.bitacora.unshift({
        id: Store.uid('bit'),
        fecha: Store.iso(HOY),
        actorId: s ? s.id : 'sistema',
        texto: String(texto || '')
      });
      if (DB.bitacora.length > 80) DB.bitacora.length = 80;
    }
  };
})();

/* --------------------------------------------------------------- Sesion --- */
const Sesion = (function () {

  var CLAVE = 'altamira.sesion';
  var cache = null;
  var leida = false;

  function persistir(s) {
    try {
      if (s) window.localStorage.setItem(CLAVE, JSON.stringify(s));
      else window.localStorage.removeItem(CLAVE);
    } catch (e) { /* sin almacenamiento: la sesión vive sólo en memoria */ }
  }

  return {

    actual: function () {
      if (!leida) {
        leida = true;
        cache = null;
        try {
          var crudo = window.localStorage.getItem(CLAVE);
          if (crudo) {
            var s = JSON.parse(crudo);
            if (s && s.rol && s.id) cache = { rol: String(s.rol), id: String(s.id) };
          }
        } catch (e) { cache = null; }
      }
      /* Si la persona ya no existe (demo reiniciada), la sesión se cae sola. */
      if (cache && !Q.persona(cache.rol, cache.id)) {
        cache = null;
        persistir(null);
      }
      return cache;
    },

    entrar: function (rol, id) {
      if (!Q.persona(rol, id)) return false;
      cache = { rol: String(rol), id: String(id) };
      leida = true;
      persistir(cache);
      return true;
    },

    salir: function () {
      cache = null;
      leida = true;
      persistir(null);
      return true;
    },

    persona: function () {
      var s = Sesion.actual();
      return s ? Q.persona(s.rol, s.id) : null;
    }
  };
})();

  function frase(lista) {

          Store.bitacora('Borró la calificación de «' + ev.nombre + '» de ' +
            (materia ? materia.nombre : 'la materia') + ' a ' + alumno.nombre + '.');
          Store.guardar();
        }
        return bien({ valor: null });
      }

      var n = aNumero(valor);
      if (isNaN(n)) return mal('La calificación debe ser un número entre 0 y 10.');
      if (n < 0 || n > 10) return mal('La calificación debe estar entre 0 y 10.');
      n = Q.red1(n);

      var quien = actorId(materia ? materia.profesorId : 'dir-01');
      var cal = Q.nota(alumnoId, evaluacionId);
      if (cal) {
        cal.valor = n;
        cal.capturadaEl = hoyISO();
        cal.capturadaPor = quien;
      } else {
        DB.calificaciones.push({
          id: Store.uid('cal'),
          alumnoId: alumnoId,
          evaluacionId: evaluacionId,
          valor: n,
          capturadaEl: hoyISO(),
          capturadaPor: quien
        });
      }
      Store.bitacora('Capturó ' + n.toFixed(1) + ' en «' + ev.nombre + '» de ' +
        (materia ? materia.nombre : 'la materia') + ' a ' + alumno.nombre + '.');
      Store.guardar();
      return bien({ valor: n });
    },

    /* ---------------------------------------------------------- evaluaciones */
    crearEvaluacion: function (materiaId, datos) {
      var d = datos || {};
      var materia = Q.materia(materiaId);
      if (!materia) return mal('No se encontró la materia.');
      if (vacio(d.nombre)) return mal('Escribe el nombre de la evaluación.');

      var tipo = texto(d.tipo) || 'parcial';
      if (TIPOS_EVAL.indexOf(tipo) < 0) return mal('El tipo de evaluación no es válido.');

      var peso = aNumero(d.peso);
      if (isNaN(peso)) return mal('Escribe el peso de la evaluación.');
      if (peso > 1) peso = peso / 100;           /* admite 25 además de 0.25 */
      if (peso <= 0 || peso > 1) return mal('El peso debe ser mayor que 0 y hasta 100%.');

      var ev = {
        id: Store.uid('ev'),

        nombre: texto(d.nombre),
        tipo: tipo,
        peso: Math.round(peso * 100) / 100,

      };
      DB.evaluaciones.push(ev);
      Store.bitacora('Creó la evaluación «' + ev.nombre + '» en ' + materia.nombre + '.');

      return bien({ id: ev.id });

      }
      if (d.peso !== undefined) {
        var peso = aNumero(d.peso);
        if (isNaN(peso)) return mal('El peso debe ser un número.');
        if (peso > 1) peso = peso / 100;
        if (peso <= 0 || peso > 1) return mal('El peso debe ser mayor que 0 y hasta 100%.');
        ev.peso = Math.round(peso * 100) / 100;
      }
      if (d.fecha !== undefined) {
        if (!esISO(d.fecha)) return mal('La fecha debe tener el formato AAAA-MM-DD.');

      var materia = Q.materia(ev.materiaId);

        (materia ? materia.nombre : 'una materia') + '.');

    eliminarEvaluacion: function (id) {

      Store.bitacora('Eliminó la evaluación «' + ev.nombre + '» de ' +
        (materia ? materia.nombre : 'una materia') + ' y sus calificaciones.');

    },

    /* --------------------------------------------------------------- materias */
    crearMateria: function (datos) {
      var d = datos || {};
      if (vacio(d.nombre)) return mal('Escribe el nombre de la materia.');
      var codigo = texto(d.codigo).toUpperCase();
      if (codigo === '') return mal('Escribe la clave de la materia.');
      var repetida = DB.materias.filter(function (m) {
        return texto(m.codigo).toUpperCase() === codigo;
      })[0];
      if (repetida) return mal('Ya existe una materia con la clave ' + codigo + '.');

      var profesor = Q.profesor(texto(d.profesorId));
      if (!profesor) return mal('Elige una persona docente válida.');

      var creditos = aNumero(d.creditos);
      if (isNaN(creditos) || creditos <= 0) creditos = 5;
      var cupo = aNumero(d.cupo);
      if (isNaN(cupo) || cupo <= 0) cupo = 24;

      var horario = aHorario(d.horario);
      if (!horario && !vacio(d.dia) && !vacio(d.inicio)) {
        horario = [{ dia: texto(d.dia), inicio: texto(d.inicio), fin: texto(d.fin) }];
      }

      var materia = {
        id: Store.uid('mat'),
        codigo: codigo,
        nombre: texto(d.nombre),
        profesorId: profesor.id,
        creditos: Math.round(creditos),
        aula: texto(d.aula) || 'Por asignar',
        cupo: Math.round(cupo),
        horario: horario || [],
        descripcion: texto(d.descripcion),
        color: texto(d.color) || colorDe(DB.materias.length),
        estatus: 'activa'
      };
      DB.materias.push(materia);
      Store.bitacora('Dio de alta la materia ' + materia.codigo + ' — ' + materia.nombre + '.');
      Store.guardar();
      return bien({ id: materia.id });
    },

    actualizarMateria: function (id, datos) {
      var d = datos || {};
      var materia = Q.materia(id);
      if (!materia) return mal('No se encontró la materia.');

      if (d.codigo !== undefined) {
        var codigo = texto(d.codigo).toUpperCase();
        if (codigo === '') return mal('La clave de la materia no puede quedar vacía.');
        var choque = DB.materias.filter(function (m) {
          return m.id !== id && texto(m.codigo).toUpperCase() === codigo;
        })[0];
        if (choque) return mal('Ya existe otra materia con la clave ' + codigo + '.');
        materia.codigo = codigo;
      }
      if (d.nombre !== undefined) {
        if (vacio(d.nombre)) return mal('El nombre de la materia no puede quedar vacío.');
        materia.nombre = texto(d.nombre);
      }
      if (d.profesorId !== undefined) {
        var profesor = Q.profesor(texto(d.profesorId));
        if (!profesor) return mal('Elige una persona docente válida.');
        materia.profesorId = profesor.id;
      }
      if (d.creditos !== undefined) {
        var creditos = aNumero(d.creditos);
        if (isNaN(creditos) || creditos <= 0) return mal('Los créditos deben ser un número mayor que 0.');
        materia.creditos = Math.round(creditos);
      }
      if (d.cupo !== undefined) {
        var cupo = aNumero(d.cupo);
        if (isNaN(cupo) || cupo <= 0) return mal('El cupo debe ser un número mayor que 0.');
        var inscritos = Q.alumnosDeMateria(id).length;
        if (cupo < inscritos) return mal('El cupo no puede ser menor que las ' + inscritos + ' personas ya inscritas.');
        materia.cupo = Math.round(cupo);
      }
      if (d.aula !== undefined) materia.aula = texto(d.aula);
      if (d.descripcion !== undefined) materia.descripcion = texto(d.descripcion);
      if (d.color !== undefined && !vacio(d.color)) materia.color = texto(d.color);
      if (d.estatus !== undefined) {
        var estatus = texto(d.estatus);
        if (['activa', 'archivada'].indexOf(estatus) < 0) return mal('El estatus de la materia no es válido.');
        materia.estatus = estatus;
      }
      var horario = aHorario(d.horario);
      if (horario) materia.horario = horario;

      Store.bitacora('Actualizó la materia ' + materia.codigo + ' — ' + materia.nombre + '.');
      Store.guardar();
      return bien({ id: materia.id });
    },

    archivarMateria: function (id) {
      var materia = Q.materia(id);
      if (!materia) return mal('No se encontró la materia.');
      if (materia.estatus === 'archivada') return mal('Esa materia ya está archivada.');
      materia.estatus = 'archivada';
      Store.bitacora('Archivó la materia ' + materia.codigo + ' — ' + materia.nombre + '.');
      Store.guardar();
      return bien();

    /* ---------------------------------------------------------- inscripciones */
    inscribir: function (alumnoId, materiaId) {
      var alumno = Q.alumno(alumnoId);
      var materia = Q.materia(materiaId);
      if (!alumno) return mal('No se encontró a esa persona.');
      if (!materia) return mal('No se encontró la materia.');
      if (materia.estatus !== 'activa') return mal('Esa materia está archivada.');
      if (alumno.estatus === 'baja') return mal('No se puede inscribir a alguien dado de baja.');

      var ya = DB.inscripciones.filter(function (i) {
        return i.alumnoId === alumnoId && i.materiaId === materiaId;
      })[0];
      if (ya) return mal(alumno.nombre + ' ya está inscrita o inscrito en ' + materia.nombre + '.');

      var inscritos = Q.alumnosDeMateria(materiaId).length;
      if (materia.cupo && inscritos >= materia.cupo) {
        return mal('La materia ya alcanzó su cupo de ' + materia.cupo + '.');
      }

      DB.inscripciones.push({ id: Store.uid('ins'), alumnoId: alumnoId, materiaId: materiaId });

      var tieneAsistencia = DB.asistencias.filter(function (a) {
        return a.alumnoId === alumnoId && a.materiaId === materiaId;
      })[0];
      if (!tieneAsistencia) {
        DB.asistencias.push({
          id: Store.uid('as'), alumnoId: alumnoId, materiaId: materiaId, presentes: 0, totales: 0
        });
      }

      /* Entregas pendientes sólo de lo que todavía no vence. */
      var hoy = hoyISO();
      DB.tareas.forEach(function (t) {
        if (t.materiaId !== materiaId || texto(t.vence) < hoy) return;
        if (Q.entrega(t.id, alumnoId)) return;
        DB.entregas.push({
          id: Store.uid('ent'), tareaId: t.id, alumnoId: alumnoId,
          estado: 'pendiente', fecha: null, calificacion: null
        });
      });

      Store.bitacora('Inscribió a ' + alumno.nombre + ' en ' + materia.nombre + '.');
      Store.guardar();
      return bien();
    },

    desinscribir: function (alumnoId, materiaId) {
      var alumno = Q.alumno(alumnoId);
      var materia = Q.materia(materiaId);
      if (!alumno) return mal('No se encontró a esa persona.');
      if (!materia) return mal('No se encontró la materia.');

      var fuera = quitar(DB.inscripciones, function (i) {
        return i.alumnoId === alumnoId && i.materiaId === materiaId;
      });
      if (!fuera) return mal(alumno.nombre + ' no está inscrita o inscrito en ' + materia.nombre + '.');

      var evs = {};
      DB.evaluaciones.forEach(function (e) { if (e.materiaId === materiaId) evs[e.id] = true; });
      var tars = {};
      DB.tareas.forEach(function (t) { if (t.materiaId === materiaId) tars[t.id] = true; });

      quitar(DB.calificaciones, function (c) { return c.alumnoId === alumnoId && evs[c.evaluacionId]; });
      quitar(DB.entregas, function (e) { return e.alumnoId === alumnoId && tars[e.tareaId]; });
      quitar(DB.asistencias, function (a) { return a.alumnoId === alumnoId && a.materiaId === materiaId; });

      Store.bitacora('Dio de baja a ' + alumno.nombre + ' de ' + materia.nombre + '.');
      Store.guardar();
      return bien();
    },

      if (url.length > 4000000) return mal('La imagen es demasiado grande: elige una de menos de 3 MB.');
      persona.foto = url;
      Store.bitacora('Actualizó la fotografía de ' + persona.nombre + '.');
      Store.guardar();
      return bien();
    },

    subirCV: function (profesorId, archivo) {
      var profesor = Q.profesor(profesorId);
      if (!profesor) return mal('No se encontró a esa persona docente.');
      if (!archivo || vacio(archivo.nombre)) return mal('Elige un archivo antes de guardar.');
      profesor.cv = {
        nombre: texto(archivo.nombre),
        tamano: texto(archivo.tamano) || '—',
        actualizado: hoyISO(),
        url: archivo.url || null
      };
      Store.bitacora('Subió el currículum «' + profesor.cv.nombre + '».');
      Store.guardar();
      return bien();
    },

    /* ---------------------------------------------------------------- tareas */
    crearTarea: function (materiaId, datos) {
      var d = datos || {};
      var materia = Q.materia(materiaId);
      if (!materia) return mal('No se encontró la materia.');
      if (vacio(d.titulo)) return mal('Escribe el título de la tarea.');
      if (!esISO(d.vence)) return mal('Elige la fecha de entrega (AAAA-MM-DD).');

      var puntos = aNumero(d.puntos);
      if (isNaN(puntos) || puntos <= 0) puntos = 10;

      var tarea = {
        id: Store.uid('tar'),
        materiaId: materiaId,
        titulo: texto(d.titulo),
        descripcion: texto(d.descripcion),
        tipo: texto(d.tipo) || 'tarea',
        vence: texto(d.vence),
        puntos: Math.round(puntos),
        publicadaEl: hoyISO(),
        archivo: d.archivo && !vacio(d.archivo.nombre)
          ? { nombre: texto(d.archivo.nombre), tamano: texto(d.archivo.tamano) || '—' }
          : null
      };
      DB.tareas.push(tarea);

      var inscritos = Q.alumnosDeMateria(materiaId);
      inscritos.forEach(function (a) {
        DB.entregas.push({
          id: Store.uid('ent'),
          tareaId: tarea.id,
          alumnoId: a.id,
          estado: 'pendiente',
          fecha: null,
          calificacion: null
        });
      });

      Store.bitacora('Publicó la tarea «' + tarea.titulo + '» en ' + materia.nombre +
        ' para ' + inscritos.length + ' personas.');
      Store.guardar();
      return bien({ id: tarea.id, entregas: inscritos.length });
    },

    marcarEntrega: function (tareaId, alumnoId, estado, calificacion) {
      var tarea = Q.tarea(tareaId);
      var alumno = Q.alumno(alumnoId);
      if (!tarea) return mal('No se encontró la tarea.');
      if (!alumno) return mal('No se encontró a esa persona.');

      var nuevo = texto(estado);
      if (ESTADOS_ENTREGA.indexOf(nuevo) < 0) return mal('El estado de la entrega no es válido.');

      var cal = calificacion;
      if (cal === '' || cal === null || cal === undefined) {
        cal = null;
      } else {
        var n = aNumero(cal);
        if (isNaN(n)) return mal('La calificación debe ser un número entre 0 y 10.');
        if (n < 0 || n > 10) return mal('La calificación debe estar entre 0 y 10.');
        cal = Q.red1(n);
      }

      var entrega = Q.entrega(tareaId, alumnoId);
      if (!entrega) {
        entrega = {
          id: Store.uid('ent'), tareaId: tareaId, alumnoId: alumnoId,
          estado: 'pendiente', fecha: null, calificacion: null
        };
        DB.entregas.push(entrega);
      }

      entrega.estado = nuevo;
      entrega.calificacion = cal;
      if (nuevo === 'entregada' || nuevo === 'revisada') {
        if (!entrega.fecha) entrega.fecha = hoyISO();
      } else if (nuevo === 'pendiente') {
        entrega.fecha = null;
      }

      Store.bitacora('Marcó como «' + nuevo + '» la entrega de «' + tarea.titulo +
        '» de ' + alumno.nombre + (cal === null ? '' : ' con ' + cal.toFixed(1)) + '.');
      Store.guardar();
      return bien();
    },

    /* ------------------------------------------------------------- materiales */
    subirMaterial: function (materiaId, datos) {
      var d = datos || {};
      var materia = Q.materia(materiaId);
      if (!materia) return mal('No se encontró la materia.');
      if (vacio(d.titulo)) return mal('Escribe el título del material.');

      var tipo = texto(d.tipo) || 'pdf';
      if (TIPOS_MATERIAL.indexOf(tipo) < 0) return mal('El tipo de material no es válido.');

      var material = {
        id: Store.uid('mtr'),
        materiaId: materiaId,
        titulo: texto(d.titulo),
        tipo: tipo,
        descripcion: texto(d.descripcion),
        subidoEl: hoyISO(),
        tamano: texto(d.tamano) || '—',
        autorId: actorId(materia.profesorId),
        url: d.url || null
      };
      DB.materiales.push(material);
      Store.bitacora('Subió «' + material.titulo + '» a ' + materia.nombre + '.');
      Store.guardar();
      return bien({ id: material.id });
    },

    eliminarMaterial: function (id) {
      var material = DB.materiales.filter(function (m) { return m.id === id; })[0];
      if (!material) return mal('No se encontró el material.');
      var materia = Q.materia(material.materiaId);
      quitar(DB.materiales, function (m) { return m.id === id; });
      Store.bitacora('Eliminó «' + material.titulo + '» de ' +
        (materia ? materia.nombre : 'una materia') + '.');
      Store.guardar();
      return bien();
    },

    /* ----------------------------------------------------------------- avisos */
    publicarAviso: function (datos) {
      var d = datos || {};
      if (vacio(d.titulo)) return mal('Escribe el título del aviso.');
      if (vacio(d.cuerpo)) return mal('Escribe el contenido del aviso.');

      var ambito = texto(d.ambito) || 'escuela';
      if (['escuela', 'materia'].indexOf(ambito) < 0) return mal('El ámbito del aviso no es válido.');

      var materiaId = null;
      if (ambito === 'materia') {
        var materia = Q.materia(texto(d.materiaId));
        if (!materia) return mal('Elige la materia del aviso.');
        materiaId = materia.id;
      }

      var prioridad = texto(d.prioridad) || 'normal';
      if (['normal', 'alta'].indexOf(prioridad) < 0) prioridad = 'normal';

      var s = Sesion.actual();
      var aviso = {
        id: Store.uid('av'),
        autorId: s ? s.id : DB.direccion.id,
        autorRol: s ? s.rol : 'direccion',
        ambito: ambito,
        materiaId: materiaId,
        titulo: texto(d.titulo),
        cuerpo: texto(d.cuerpo),
        fecha: hoyISO(),
        prioridad: prioridad
      };
      DB.avisos.unshift(aviso);
      Store.bitacora('Publicó el aviso «' + aviso.titulo + '».');
      Store.guardar();
      return bien({ id: aviso.id });
    },

    /* ------------------------------------------------------------------ pagos */
    registrarPago: function (pagoId, datos) {
      var d = datos || {};
      var pago = DB.pagos.filter(function (p) { return p.id === pagoId; })[0];
      if (!pago) return mal('No se encontró el pago.');
      if (pago.estado === 'pagado') return mal('Ese pago ya está registrado como pagado.');

      pago.estado = 'pagado';
      pago.pagadoEl = hoyISO();
      pago.metodo = texto(d.metodo) || 'Transferencia SPEI';
      if (!vacio(d.referencia)) pago.referencia = texto(d.referencia);
      pago.recargo = 0;

      var alumno = Q.alumno(pago.alumnoId);
      Store.bitacora('Registró el pago de «' + pago.concepto + '»' +
        (alumno ? ' de ' + alumno.nombre : '') + '.');
      Store.guardar();
      return bien({ id: pago.id });
    },

    generarColegiaturas: function (periodo) {
      var per = texto(periodo);
      var m = /^(\d{4})-(\d{2})([a-z]?)$/.exec(per);
      if (!m) return mal('El periodo debe tener el formato AAAA-MM.');
      var mesIndice = parseInt(m[2], 10) - 1;
      if (mesIndice < 0 || mesIndice > 11) return mal('El mes del periodo no es válido.');

      var concepto = 'Colegiatura de ' + MESES[mesIndice] + ' ' + m[1];
      var vence = m[1] + '-' + m[2] + '-05';
      var base = Number(DB.escuela.colegiaturaMensual) || 0;
      if (base <= 0) return mal('Define primero la colegiatura mensual en los datos de la escuela.');

      var generados = 0;
      Q.alumnosActivos().forEach(function (a) {
        var ya = DB.pagos.filter(function (p) {
          return p.alumnoId === a.id && texto(p.periodo) === per;
        })[0];
        if (ya) return;
        var beca = Number(a.becaPct) || 0;
        DB.pagos.push({
          id: Store.uid('pag'),
          alumnoId: a.id,
          concepto: concepto,
          periodo: per,
          monto: Math.round(base * (1 - beca / 100)),
          vence: vence,
          estado: 'pendiente',
          pagadoEl: null,
          metodo: null,
          referencia: 'ALT-' + per.replace('-', '') + '-' + texto(a.matricula).replace('A-', ''),
          recargo: 0
        });
        generados++;
      });

      if (!generados) return mal('Ese periodo ya está generado para todas las personas activas.');
      Store.bitacora('Generó ' + generados + ' recibos de «' + concepto + '».');
      Store.guardar();
      return bien({ generados: generados, concepto: concepto });
    },

    /* ---------------------------------------------------------------- reseñas */
    crearResena: function (datos) {
      var d = datos || {};
      var profesor = Q.profesor(texto(d.profesorId));
      var alumno = Q.alumno(texto(d.alumnoId));
      if (!profesor) return mal('No se encontró a esa persona docente.');
      if (!alumno) return mal('No se encontró a esa persona inscrita.');
      if (Q.resenaDe(alumno.id, profesor.id)) {
        return mal('Ya escribiste una reseña para ' + profesor.nombre + '.');
      }

      var estrellas = aNumero(d.estrellas);
      if (isNaN(estrellas)) return mal('Elige cuántas estrellas das.');
      estrellas = Math.round(estrellas);
      if (estrellas < 1 || estrellas > 5) return mal('Las estrellas van de 1 a 5.');

      var comentario = texto(d.comentario);
      if (comentario.length < 10) return mal('Escribe un comentario de al menos 10 caracteres.');
      if (comentario.length > 800) return mal('El comentario no debe pasar de 800 caracteres.');

      var materiaId = null;
      if (!vacio(d.materiaId)) {
        var materia = Q.materia(texto(d.materiaId));
        if (!materia) return mal('Elige una materia válida.');
        materiaId = materia.id;
      }

      var entrada = d.criterios || d;
      var criterios = {};
      var errorCriterio = null;
      CRITERIOS.forEach(function (k) {
        var v = aNumero(entrada[k]);
        if (isNaN(v)) v = estrellas;
        v = Math.round(v);
        if (v < 1 || v > 5) errorCriterio = 'Los criterios se califican del 1 al 5.';
        criterios[k] = v;
      });
      if (errorCriterio) return mal(errorCriterio);

      var resena = {
        id: Store.uid('res'),
        profesorId: profesor.id,
        alumnoId: alumno.id,
        materiaId: materiaId,
        estrellas: estrellas,
        criterios: criterios,
        comentario: comentario,
        fecha: hoyISO(),
        estado: 'pendiente',
        anonima: aBool(d.anonima),
        respuesta: null
      };
      DB.resenas.push(resena);
      Store.bitacora('Envió una reseña de ' + profesor.nombre + '; queda pendiente de moderación.');
      Store.guardar();
      return bien({ id: resena.id });
    },

    moderarResena: function (id, estado) {
      var resena = DB.resenas.filter(function (r) { return r.id === id; })[0];
      if (!resena) return mal('No se encontró la reseña.');
      var nuevo = texto(estado);
      if (['publica', 'oculta'].indexOf(nuevo) < 0) return mal('Sólo se puede publicar u ocultar una reseña.');
      if (resena.estado === nuevo) return mal('La reseña ya está en ese estado.');
      resena.estado = nuevo;
      var profesor = Q.profesor(resena.profesorId);
      Store.bitacora((nuevo === 'publica' ? 'Publicó' : 'Ocultó') + ' una reseña de ' +
        (profesor ? profesor.nombre : 'una persona docente') + '.');
      Store.guardar();
      return bien();
    },

    responderResena: function (id, texto_) {
      var resena = DB.resenas.filter(function (r) { return r.id === id; })[0];
      if (!resena) return mal('No se encontró la reseña.');
      var cuerpo = texto(texto_);
      if (cuerpo === '') return mal('Escribe una respuesta antes de enviarla.');
      if (cuerpo.length > 600) return mal('La respuesta no debe pasar de 600 caracteres.');
      resena.respuesta = { texto: cuerpo, fecha: hoyISO() };
      var profesor = Q.profesor(resena.profesorId);
      Store.bitacora('Respondió una reseña de ' +
        (profesor ? profesor.nombre : 'una persona docente') + '.');
      Store.guardar();
      return bien();
    },

    /* ---------------------------------------------------------------- escuela */
    actualizarEscuela: function (datos) {
      var d = datos || {};
      var cadenas = ['nombre', 'lema', 'ciclo', 'direccion', 'ciudad', 'telefono', 'email',
        'sitio', 'horarioAtencion', 'acercaDe', 'mision', 'sello', 'diasHabiles', 'moneda'];
      if (d.nombre !== undefined && vacio(d.nombre)) return mal('El nombre de la escuela no puede quedar vacío.');

      if (d.colegiaturaMensual !== undefined) {
        var cuota = aNumero(d.colegiaturaMensual);
        if (isNaN(cuota) || cuota <= 0) return mal('La colegiatura debe ser un número mayor que 0.');
        DB.escuela.colegiaturaMensual = Math.round(cuota);
      }
      if (d.recargoPct !== undefined) {
        var recargo = aNumero(d.recargoPct);
        if (isNaN(recargo) || recargo < 0 || recargo > 50) return mal('El recargo debe estar entre 0 y 50%.');
        DB.escuela.recargoPct = Math.round(recargo);
      }
      if (d.fundacion !== undefined) {
        var anio = aNumero(d.fundacion);
        if (isNaN(anio) || anio < 1800 || anio > 2100) return mal('El año de fundación no es válido.');
        DB.escuela.fundacion = Math.round(anio);
      }
      cadenas.forEach(function (k) {
        if (d[k] !== undefined) DB.escuela[k] = texto(d[k]);
      });

      Store.bitacora('Actualizó los datos generales del colegio.');
      Store.guardar();
      return bien();
    },

    /* ------------------------------------------------------------- asistencia */
    actualizarAsistencia: function (alumnoId, materiaId, presentes, totales) {
      var alumno = Q.alumno(alumnoId);
      var materia = Q.materia(materiaId);
      if (!alumno) return mal('No se encontró a esa persona.');
      if (!materia) return mal('No se encontró la materia.');

      var p = aNumero(presentes);
      var t = aNumero(totales);
      if (isNaN(p) || isNaN(t)) return mal('Las sesiones deben ser números.');
      p = Math.round(p);
      t = Math.round(t);
      if (p < 0 || t < 0) return mal('Las sesiones no pueden ser negativas.');
      if (p > t) return mal('Las asistencias no pueden ser más que las sesiones impartidas.');

      var fila = DB.asistencias.filter(function (a) {
        return a.alumnoId === alumnoId && a.materiaId === materiaId;
      })[0];
      if (fila) {
        fila.presentes = p;
        fila.totales = t;
      } else {
        DB.asistencias.push({
          id: Store.uid('as'), alumnoId: alumnoId, materiaId: materiaId, presentes: p, totales: t
        });
      }

      Store.bitacora('Ajustó la asistencia de ' + alumno.nombre + ' en ' + materia.nombre +
        ' a ' + p + ' de ' + t + '.');
      Store.guardar();
      return bien({ pct: t > 0 ? Math.round(p / t * 100) : 0 });
    }
  };

  /* Ninguna mutación lanza: un error inesperado se devuelve como {ok:false}. */
  Object.keys(api).forEach(function (nombre) {
    var original = api[nombre];
    api[nombre] = function () {
      try {
        var r = original.apply(api, arguments);
        return (r && typeof r === 'object') ? r : { ok: true };
      } catch (e) {
        return { ok: false, error: 'No se pudo completar la operación. Inténtalo de nuevo.' };
      }
    };
  });

  return api;
})();

  /* --- gráficas ---------------------------------------------------------- */

  function sinDatos(o, texto) {
    return vacio({
      icono: 'grafica',
      titulo: (o && o.vacio) || 'Sin datos que graficar',
      texto: texto || 'Todavía no hay información suficiente para esta gráfica.'
    });
  }

  function abreSvg(w, h, etiqueta) {
    return '<svg class="grafica" viewBox="0 0 ' + r2(w) + ' ' + r2(h) + '" ' +
      'preserveAspectRatio="xMidYMid meet" role="img" aria-label="' + esc(etiqueta) + '">';
  }

  /* Barras horizontales con etiqueta a la izquierda y valor al final. */
  function barras(o) {
    o = o || {};
    var series = (o.series || []).filter(Boolean);
    if (!series.length) return sinDatos(o);

    var valores = series.map(function (s) { return Number(s.valor) || 0; });
    var conMeta = typeof o.meta === 'number' && isFinite(o.meta);
    var max = Number(o.max);
    if (!isFinite(max) || max <= 0) {
      max = Math.max.apply(null, valores.concat(conMeta ? [Number(o.meta)] : []));
    }
    if (!isFinite(max) || max <= 0) max = 1;

    var textos = valores.map(function (v) { return fmt(v, o.formato); });
    var anchoValor = Math.max(38, Math.max.apply(null, textos.map(function (t) { return t.length; })) * 6.2 + 8);
    var W = 340;
    var anchoEtiqueta = 94;
    var x0 = anchoEtiqueta + 8;
    var largoMax = W - anchoValor - x0;
    if (largoMax < 60) { anchoEtiqueta = 70; x0 = 78; largoMax = W - anchoValor - x0; }

    var padTop = 6;
    var padBot = conMeta ? 20 : 6;
    var altoFila = 26;
    var H = padTop + series.length * altoFila + padBot;
    if (o.alto && Number(o.alto) > padTop + padBot + series.length * 14) {
      H = Number(o.alto);
      altoFila = (H - padTop - padBot) / series.length;
    }

    var cuerpo = series.map(function (s, i) {
      var cy = padTop + i * altoFila + altoFila / 2;
      var w = Math.max(0, Math.min(1, valores[i] / max)) * largoMax;
      var et = recorta(s.etiqueta, 22);
      var ajuste = et.length * 5.7 > anchoEtiqueta
        ? ' textLength="' + anchoEtiqueta + '" lengthAdjust="spacingAndGlyphs"' : '';
      return '<rect x="' + x0 + '" y="' + r2(cy - 6) + '" width="' + r2(largoMax) + '" height="12" rx="3" ' +
          'fill="var(--superficie-3)"/>' +
        (w > 0.6 ? '<rect x="' + x0 + '" y="' + r2(cy - 6) + '" width="' + r2(w) + '" height="12" rx="3" ' +
          'fill="' + esc(colorSerie(i, s.color)) + '"/>' : '') +
        '<text x="' + anchoEtiqueta + '" y="' + r2(cy + 3.8) + '" text-anchor="end"' + ajuste + '>' +
          escT(et) + '</text>' +
        /* El valor va al final del carril, no de la barra: así nunca lo cruza la línea de meta. */
        '<text class="val" x="' + r2(x0 + largoMax + 7) + '" y="' + r2(cy + 3.8) + '">' + escT(textos[i]) + '</text>';
    }).join('');

    var meta = '';
    if (conMeta) {
      var xm = r2(x0 + Math.max(0, Math.min(1, Number(o.meta) / max)) * largoMax);
      meta = '<line class="meta" x1="' + xm + '" y1="' + padTop + '" x2="' + xm + '" y2="' + r2(H - padBot + 3) + '"/>' +
        '<text x="' + xm + '" y="' + r2(H - 4) + '" text-anchor="middle">meta ' + escT(fmt(o.meta, o.formato)) + '</text>';
    }

    var resumen = series.map(function (s, i) { return recorta(s.etiqueta, 24) + ': ' + textos[i]; }).join(', ');
    return abreSvg(W, H, 'Gráfica de barras. ' + resumen) + cuerpo + meta + '</svg>';
  }

  /* Columnas verticales con eje inferior. */
  function columnas(o) {
    o = o || {};
    var series = (o.series || []).filter(Boolean);
    if (!series.length) return sinDatos(o);

    var valores = series.map(function (s) { return Number(s.valor) || 0; });
    var max = Number(o.max);
    if (!isFinite(max) || max <= 0) max = Math.max.apply(null, valores);
    if (!isFinite(max) || max <= 0) max = 1;

    var W = 340, padL = 10, padR = 10, padT = 22;
    var n = series.length;
    var hueco = (W - padL - padR) / n;
    var etiquetas = series.map(function (s) { return String(s.etiqueta === null || s.etiqueta === undefined ? '' : s.etiqueta); });
    var largoMax = Math.max.apply(null, etiquetas.map(function (e) { return e.length; }));
    var rotar = largoMax * 5.6 > hueco - 4;
    var padBot = rotar ? 46 : 26;
    var H = Number(o.alto) > 90 ? Number(o.alto) : 190;
    var base = H - padBot;
    var util = base - padT;
    var ancho = Math.min(34, hueco * 0.62);

    var cuerpo = series.map(function (s, i) {
      var cx = padL + i * hueco + hueco / 2;
      var alto = Math.max(0, Math.min(1, valores[i] / max)) * util;
      var y = base - alto;
      var texto = fmt(valores[i], o.formato);
      var et = rotar ? recorta(etiquetas[i], 13) : etiquetas[i];
      var etiqueta = rotar
        ? '<text x="' + r2(cx) + '" y="' + r2(base + 13) + '" text-anchor="end" ' +
          'transform="rotate(-38 ' + r2(cx) + ' ' + r2(base + 13) + ')">' + escT(et) + '</text>'
        : '<text x="' + r2(cx) + '" y="' + r2(base + 15) + '" text-anchor="middle">' + escT(et) + '</text>';
      return (alto > 0.6 ? '<rect x="' + r2(cx - ancho / 2) + '" y="' + r2(y) + '" width="' + r2(ancho) +
          '" height="' + r2(alto) + '" rx="3" fill="' + esc(colorSerie(i, s.color)) + '"/>' : '') +
        /* El valor sólo se pinta si cabe dentro del hueco de la columna. */
        (texto.length * 5.8 <= hueco ? '<text class="val" x="' + r2(cx) + '" y="' + r2(y - 6) +
          '" text-anchor="middle">' + escT(texto) + '</text>' : '') + etiqueta;
    }).join('');

    var eje = '<line class="eje" x1="' + padL + '" y1="' + r2(base) + '" x2="' + (W - padR) + '" y2="' + r2(base) + '"/>';
    var resumen = series.map(function (s, i) { return etiquetas[i] + ': ' + fmt(valores[i], o.formato); }).join(', ');
    return abreSvg(W, H, 'Gráfica de columnas. ' + resumen) + eje + cuerpo + '</svg>';
  }

  /* Línea con área en degradado, rejilla y puntos marcados. */
  function linea(o) {
    o = o || {};
    var pts = (o.puntos || []).filter(Boolean);
    if (!pts.length) return sinDatos(o);

    var vals = pts.map(function (p) { return Number(p.valor) || 0; });
    var mx = (o.max !== null && o.max !== undefined && isFinite(o.max)) ? Number(o.max) : Math.max.apply(null, vals);
    var mn = (o.min !== null && o.min !== undefined && isFinite(o.min)) ? Number(o.min) : Math.min.apply(null, vals);
    if (!isFinite(mx)) mx = 1;
    if (!isFinite(mn)) mn = 0;
    if (mx - mn < 0.0001) { mx = mx + 1; mn = Math.max(0, mn - 1); }
    if (mx - mn < 0.0001) mx = mn + 1;

    var etiquetasY = [0, 1, 2, 3].map(function (k) { return fmt(mn + (mx - mn) * k / 3, o.formato); });
    var padL = Math.max(28, Math.max.apply(null, etiquetasY.map(function (t) { return t.length; })) * 6.2 + 10);
    var W = 360, padR = 14, padT = 18, padBot = 26;
    var H = Number(o.alto) > 90 ? Number(o.alto) : 180;
    var base = H - padBot, techo = padT;
    var util = W - padL - padR;

    function px(i) { return pts.length === 1 ? padL + util / 2 : padL + util * i / (pts.length - 1); }
    function py(v) { return base - ((v - mn) / (mx - mn)) * (base - techo); }

    var rejilla = [0, 1, 2, 3].map(function (k) {
      var y = r2(py(mn + (mx - mn) * k / 3));
      return '<line class="rejilla-lin" x1="' + padL + '" y1="' + y + '" x2="' + (W - padR) + '" y2="' + y + '"/>' +
        '<text x="' + r2(padL - 7) + '" y="' + r2(y + 3.6) + '" text-anchor="end">' + escT(etiquetasY[k]) + '</text>';
    }).join('');

    var trazo = pts.map(function (p, i) {
      return (i ? 'L' : 'M') + r2(px(i)) + ' ' + r2(py(vals[i]));
    }).join(' ');
    var area = trazo + ' L' + r2(px(pts.length - 1)) + ' ' + r2(base) + ' L' + r2(px(0)) + ' ' + r2(base) + ' Z';

    var idGrad = nuevoId('degradado');
    var defs = '<defs><linearGradient id="' + idGrad + '" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0" stop-color="var(--marca)" stop-opacity="0.30"/>' +
      '<stop offset="1" stop-color="var(--marca)" stop-opacity="0"/></linearGradient></defs>';

    var meta = '';
    if (typeof o.meta === 'number' && isFinite(o.meta) && o.meta >= mn && o.meta <= mx) {
      var ym = r2(py(Number(o.meta)));
      meta = '<line class="meta" x1="' + padL + '" y1="' + ym + '" x2="' + (W - padR) + '" y2="' + ym + '"/>';
    }

    var ultimo = pts.length - 1;
    var marcas = pts.map(function (p, i) {
      var x = r2(px(i)), y = r2(py(vals[i]));
      var esUlt = i === ultimo;
      return '<circle cx="' + x + '" cy="' + y + '" r="' + (esUlt ? 4.6 : 3) + '" ' +
        'fill="' + (esUlt ? 'var(--marca)' : 'var(--superficie)') + '" stroke="var(--marca)" stroke-width="1.6"/>';
    }).join('');

    var xUlt = px(ultimo);
    var valorUlt = '<text class="val" x="' + r2(ultimo === 0 ? xUlt : xUlt + 2) + '" y="' + r2(py(vals[ultimo]) - 10) +
      '" text-anchor="' + (ultimo === 0 ? 'middle' : 'end') + '">' + escT(fmt(vals[ultimo], o.formato)) + '</text>';

    var ejeX = pts.map(function (p, i) {
      if (pts.length > 9 && i % 2 === 1) return '';
      return '<text x="' + r2(px(i)) + '" y="' + r2(H - 8) + '" text-anchor="middle">' +
        escT(recorta(p.etiqueta, 9)) + '</text>';
    }).join('');

    var resumen = pts.map(function (p, i) { return recorta(p.etiqueta, 14) + ': ' + fmt(vals[i], o.formato); }).join(', ');
    /* Con un solo punto no hay trazo ni área que dibujar: sólo el marcador. */
    var trazos = pts.length < 2 ? '' :
      '<path d="' + area + '" fill="url(#' + idGrad + ')" stroke="none"/>' +
      '<path d="' + trazo + '" fill="none" stroke="var(--marca)" stroke-width="2.2" ' +
      'stroke-linecap="round" stroke-linejoin="round"/>';

    return abreSvg(W, H, 'Gráfica de línea. ' + resumen) + defs + rejilla + meta +
      trazos + marcas + valorUlt + ejeX + '</svg>';
  }

  /* Anillo de progreso. */
  function anillo(pct, o) {
    o = o || {};
    var p = Number(pct);
    if (!isFinite(p)) p = 0;
    p = Math.max(0, Math.min(100, p));
    var tam = Number(o.tam) > 0 ? Number(o.tam) : 132;
    var radio = 52, circ = 2 * Math.PI * radio;
    var lleno = circ * p / 100;
    var etiqueta = (o.etiqueta === null || o.etiqueta === undefined) ? Math.round(p) + '%' : String(o.etiqueta);
    var yValor = o.sub ? 62 : 70;

    return '<svg class="grafica" viewBox="0 0 128 128" preserveAspectRatio="xMidYMid meet" ' +
      'style="width:' + tam + 'px;height:' + tam + 'px;margin:0 auto" role="img" ' +
      'aria-label="' + esc(etiqueta + (o.sub ? '. ' + o.sub : '')) + '">' +
      '<circle cx="64" cy="64" r="' + radio + '" fill="none" stroke="var(--superficie-3)" stroke-width="11"/>' +
      (p > 0 ? '<circle cx="64" cy="64" r="' + radio + '" fill="none" stroke="' + colorVar(o.variante) + '" ' +
        'stroke-width="11" stroke-linecap="round" stroke-dasharray="' + r2(lleno) + ' ' + r2(circ - lleno) + '" ' +
        'transform="rotate(-90 64 64)"/>' : '') +
      '<text x="64" y="' + yValor + '" text-anchor="middle" ' +
        'style="fill:var(--tinta);font-family:var(--f-display);font-size:27px;font-weight:600">' +
        escT(etiqueta) + '</text>' +
      (o.sub ? '<text x="64" y="82" text-anchor="middle" style="font-size:11px">' + escT(recorta(o.sub, 22)) + '</text>' : '') +
      '</svg>';
  }

  /* Dona con hueco al centro y leyenda debajo. */
  function dona(o) {
    o = o || {};
    var todos = (o.segmentos || []).filter(Boolean);
    if (!todos.length) return sinDatos(o);
    var centro = o.centro || {};
    var tam = Number(o.tam) > 0 ? Number(o.tam) : 156;
    var radio = 46, circ = 2 * Math.PI * radio;
    var visibles = todos.filter(function (s) { return (Number(s.valor) || 0) > 0; });
    var total = visibles.reduce(function (a, s) { return a + (Number(s.valor) || 0); }, 0);

    var arcos = '';
    if (total > 0) {
      var acumulado = 0;
      arcos = todos.map(function (s, i) {
        var v = Number(s.valor) || 0;
        if (v <= 0) return '';
        var frac = v / total;
        var largo = Math.max(0.5, frac * circ - (visibles.length > 1 ? 2.2 : 0));
        var pieza = '<circle cx="64" cy="64" r="' + radio + '" fill="none" stroke="' + esc(colorSerie(i, s.color)) + '" ' +
          'stroke-width="20" stroke-dasharray="' + r2(largo) + ' ' + r2(circ - largo) + '" ' +
          'stroke-dashoffset="' + r2(-acumulado) + '" transform="rotate(-90 64 64)"/>';
        acumulado += frac * circ;
        return pieza;
      }).join('');
    }

    var resumen = todos.map(function (s) {
      return String(s.etiqueta) + ': ' + fmt(s.valor, o.formato);
    }).join(', ');

    var svg = '<svg class="grafica" viewBox="0 0 128 128" preserveAspectRatio="xMidYMid meet" ' +
      'style="width:' + tam + 'px;height:' + tam + 'px" role="img" aria-label="' + esc('Gráfica de dona. ' + resumen) + '">' +
      '<circle cx="64" cy="64" r="' + radio + '" fill="none" stroke="var(--superficie-3)" stroke-width="20"/>' +
      arcos +
      (centro.valor !== null && centro.valor !== undefined
        ? '<text x="64" y="' + (centro.sub ? 62 : 69) + '" text-anchor="middle" ' +
          'style="fill:var(--tinta);font-family:var(--f-display);font-size:23px;font-weight:600">' +
          escT(centro.valor) + '</text>' : '') +
      (centro.sub ? '<text x="64" y="80" text-anchor="middle" style="font-size:10.5px">' +
        escT(recorta(centro.sub, 20)) + '</text>' : '') +
      '</svg>';

    var leyenda = '<div class="leyenda">' + todos.map(function (s, i) {
      return '<span class="leyenda-item"><span class="punto" style="background:' + esc(colorSerie(i, s.color)) + '"></span>' +
        escT(s.etiqueta) + ' <strong>' + escT(fmt(s.valor, o.formato)) + '</strong></span>';
    }).join('') + '</div>';

    return '<div><div class="centro">' + svg + '</div>' + leyenda + '</div>';
  }

  /* --- formularios ------------------------------------------------------- */

  function opcionesHtml(opciones, valor, placeholder) {
    var html = '';
    var hayValor = valor !== null && valor !== undefined && valor !== '';
    if (placeholder) {
      html += '<option value=""' + (hayValor ? '' : ' selected') + '>' + escT(placeholder) + '</option>';
    }
    html += (opciones || []).map(function (op) {
      var v = (op && typeof op === 'object') ? op.valor : op;
      var t = (op && typeof op === 'object') ? (op.texto === undefined ? op.valor : op.texto) : op;
      var sel = hayValor && String(valor) === String(v) ? ' selected' : '';
      return '<option value="' + esc(v) + '"' + sel + '>' + escT(t) + '</option>';
    }).join('');
    return html;
  }

  var TIPOS_INPUT = {
    texto: 'text', numero: 'number', fecha: 'date', hora: 'time',
    correo: 'email', tel: 'tel', archivo: 'file', color: 'color', clave: 'password'
  };

  function campo(o) {
    o = o || {};
    var tipo = o.tipo || 'texto';
    var id = o.id || nuevoId('campo');
    var nombre = o.nombre || id;
    var extra = attr(o.attrs) +
      (o.cambio ? ' data-cambio="' + esc(o.cambio) + '"' : '') +
      (o.entrada ? ' data-entrada="' + esc(o.entrada) + '"' : '') +
      (o.deshabilitado ? ' disabled' : '') +
      (o.soloLectura ? ' readonly' : '') +
      (o.requerido ? ' required' : '');
    var marca = o.requerido ? ' <span class="campo-req">*</span>' : '';
    var ayuda = o.ayuda ? '<div class="campo-ayuda" id="' + id + '-ayuda">' + escT(o.ayuda) + '</div>' : '';
    var descrito = o.ayuda ? ' aria-describedby="' + id + '-ayuda"' : '';
    var control, interior;

    if (tipo === 'checa') {
      interior = '<label class="checa" for="' + id + '">' +
        '<input type="checkbox" id="' + id + '" name="' + esc(nombre) + '" value="1"' +
        (o.valor ? ' checked' : '') + descrito + extra + '>' +
        '<span>' + escT(o.etiqueta) + marca + '</span></label>' + ayuda;
    } else {
      if (tipo === 'area') {
        control = '<textarea class="area" id="' + id + '" name="' + esc(nombre) + '" rows="' + (o.filas || 4) + '"' +
          (o.placeholder ? ' placeholder="' + esc(o.placeholder) + '"' : '') + descrito + extra + '>' +
          escT(o.valor) + '</textarea>';
      } else if (tipo === 'selec') {
        control = '<select class="selec" id="' + id + '" name="' + esc(nombre) + '"' + descrito + extra + '>' +
          opcionesHtml(o.opciones, o.valor, o.placeholder) + '</select>';
      } else {
        var t = TIPOS_INPUT[tipo] || 'text';
        control = '<input class="entrada' + (o.mono ? ' mono' : '') + '" type="' + t + '" id="' + id + '" ' +
          'name="' + esc(nombre) + '"' +
          (t === 'file' ? '' : ' value="' + esc(o.valor) + '"') +
          (o.placeholder && t !== 'file' && t !== 'color' ? ' placeholder="' + esc(o.placeholder) + '"' : '') +
          (o.min !== undefined && o.min !== null ? ' min="' + esc(o.min) + '"' : '') +
          (o.max !== undefined && o.max !== null ? ' max="' + esc(o.max) + '"' : '') +
          (o.paso !== undefined && o.paso !== null ? ' step="' + esc(o.paso) + '"' : '') +
          (t === 'file' && o.acepta ? ' accept="' + esc(o.acepta) + '"' : '') +
          descrito + extra + '>';
      }
      interior = '<label class="campo-etiqueta" for="' + id + '">' + escT(o.etiqueta) + marca + '</label>' +
        control + ayuda;
    }

    return '<div class="col-' + (o.col || 12) + '"><div class="campo">' + interior + '</div></div>';
  }

  function form(o) {
    o = o || {};
    var acciones = o.acciones
      ? juntar(o.acciones)
      : '<button type="submit" class="btn btn-primario">Guardar</button>';
    return '<form id="' + esc(o.id || nuevoId('form')) + '"' +
      (o.accion ? ' data-envio="' + esc(o.accion) + '"' : '') + attr(o.attrs) +
      ' class="form-rejilla' + (o.clase ? ' ' + esc(o.clase) : '') + '">' +
      juntar(o.campos) +
      '<div class="col-12 form-acciones">' + acciones + '</div>' +
      '</form>';
  }

  /* --- navegación -------------------------------------------------------- */

  function pestanas(items, activo, accion) {
    var lista = (items || []).filter(Boolean);
    return '<div class="pestanas" role="tablist">' + lista.map(function (it) {
      var esActiva = String(it.id) === String(activo);
      return '<button type="button" class="pestana' + (esActiva ? ' pestana-activa' : '') + '" ' +
        'role="tab" aria-selected="' + (esActiva ? 'true' : 'false') + '"' +
        (accion ? ' data-accion="' + esc(accion) + '"' + attr({ 'data-args': { id: it.id } }) : '') + '>' +
        (it.icono ? icono(it.icono, 15) : '') + escT(it.texto) +
        (it.conteo === null || it.conteo === undefined ? '' : '<span class="conteo">' + escT(it.conteo) + '</span>') +
        '</button>';
    }).join('') + '</div>';
  }

  function migas(items) {
    var lista = (items || []).filter(Boolean);
    if (!lista.length) return '';
    return '<nav class="migas" aria-label="Ruta">' + lista.map(function (it, i) {
      var sep = i ? '<span class="sep" aria-hidden="true">/</span>' : '';
      var ultimo = i === lista.length - 1;
      if (ultimo || !it.ruta) {
        return sep + '<span class="actual"' + (ultimo ? ' aria-current="page"' : '') + '>' + escT(it.texto) + '</span>';
      }
      return sep + '<a href="' + esc(it.ruta) + '">' + escT(it.texto) + '</a>';
    }).join('') + '</nav>';
  }

  /* --- avisos flotantes -------------------------------------------------- */

  var ICONO_TOAST = { ok: 'cheque', crit: 'alerta', aviso: 'alerta', info: 'info' };

  function toast(mensaje, variante) {
    var zona = document.getElementById('toasts');
    if (!zona) return;
    while (zona.children.length >= 3) zona.removeChild(zona.firstElementChild);
    var el = document.createElement('div');
    el.className = 'toast' + (variante ? ' v-' + variante : '');
    el.setAttribute('role', variante === 'crit' ? 'alert' : 'status');
    el.innerHTML = icono(ICONO_TOAST[variante] || 'info', 16) + '<span>' + escT(mensaje) + '</span>';
    zona.appendChild(el);
    window.setTimeout(function () {
      if (!el.parentNode) return;
      el.className += ' saliendo';
      window.setTimeout(function () {
        if (el.parentNode) el.parentNode.removeChild(el);
      }, 260);
    }, 3600);
  }

  /* --- modal ------------------------------------------------------------- */

  var modalAbierto = null;
  var focoPrevio = null;
  var overflowPrevio = '';

  function enfocables(raiz) {
    var sel = 'a[href], button:not([disabled]), input:not([disabled]):not([type="hidden"]), ' +
      'select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])';
    return Array.prototype.slice.call(raiz.querySelectorAll(sel));
  }

  function modal(o) {
    o = o || {};
    var contenedor = document.getElementById('modales');
    if (!contenedor) return;
    if (!modalAbierto) {
      focoPrevio = document.activeElement;
      overflowPrevio = document.body.style.overflow;
    }
    contenedor.innerHTML = '';

    var ancho = o.ancho === 'ancho' ? ' ancho' : (o.ancho === 'angosto' ? ' angosto' : '');
    var fondo = document.createElement('div');
    fondo.className = 'modal-fondo';
    fondo.innerHTML =
      '<div class="modal' + ancho + '" role="dialog" aria-modal="true" ' +
        'aria-label="' + esc(o.titulo || 'Ventana') + '">' +
        '<div class="modal-cab"><div>' +
          '<h3>' + escT(o.titulo || '') + '</h3>' +
          (o.sub ? '<div class="sub">' + escT(o.sub) + '</div>' : '') +
        '</div>' +
        '<button type="button" class="btn btn-fantasma btn-icono" data-accion="app:cerrarModal" ' +
          'data-cerrar-modal="1" aria-label="Cerrar">' + icono('equis', 18) + '</button>' +
        '</div>' +
        '<div class="modal-cuerpo">' + (o.cuerpo || '') + '</div>' +
        (o.acciones ? '<div class="modal-pie">' + juntar(o.acciones) + '</div>' : '') +
      '</div>';

    contenedor.appendChild(fondo);
    document.body.style.overflow = 'hidden';
    modalAbierto = fondo;

    fondo.addEventListener('mousedown', function (ev) {
      if (ev.target === fondo) cerrarModal();
    });
    /* Todos los controles de cierre, no sólo el primero: la «Cancelar» de
       U.confirmar también lleva data-cerrar-modal. */
    Array.prototype.forEach.call(fondo.querySelectorAll('[data-cerrar-modal]'), function (b) {
      b.addEventListener('click', function () { cerrarModal(); });
    });

    var cuerpo = fondo.querySelector('.modal-cuerpo');
    var candidatos = cuerpo ? enfocables(cuerpo) : [];
    if (!candidatos.length) candidatos = enfocables(fondo);
    if (candidatos.length && candidatos[0].focus) {
      try { candidatos[0].focus(); } catch (e) { /* sin foco disponible */ }
    }
  }

  function cerrarModal() {
    var contenedor = document.getElementById('modales');
    if (contenedor) contenedor.innerHTML = '';
    if (!modalAbierto) return;
    modalAbierto = null;
    document.body.style.overflow = overflowPrevio;
    if (focoPrevio && focoPrevio.focus && document.body.contains(focoPrevio)) {
      try { focoPrevio.focus(); } catch (e) { /* el elemento ya no existe */ }
    }
    focoPrevio = null;
  }

  function confirmar(o) {
    o = o || {};
    var idOk = nuevoId('ok');
    modal({
      titulo: o.titulo || 'Confirmar',
      ancho: 'angosto',
      cuerpo: '<p>' + escT(o.texto || '¿Deseas continuar?') + '</p>',
      acciones:
        '<button type="button" class="btn" data-accion="app:cerrarModal" data-cerrar-modal="1">' +
          escT(o.textoCancelar || 'Cancelar') + '</button>' +
        '<button type="button" id="' + idOk + '" class="btn ' + (o.peligro ? 'btn-peligro' : 'btn-primario') + '"' +
          (o.accion ? ' data-accion="' + esc(o.accion) + '"' : '') +
          attr({ 'data-args': o.args || {} }) + '>' +
          escT(o.textoOk || 'Aceptar') + '</button>'
    });
    var propio = modalAbierto;
    var boton = document.getElementById(idOk);
    if (boton) {
      boton.addEventListener('click', function () {
        /* Cierra después de que la acción global haya corrido. */
        window.setTimeout(function () {
          if (modalAbierto === propio) cerrarModal();
        }, 0);
      });
    }
  }

  /* Escape y trampa de foco: se registran una sola vez. */
  document.addEventListener('keydown', function (ev) {
    if (!modalAbierto) return;
    if (ev.key === 'Escape') {
      ev.preventDefault();
      cerrarModal();
      return;
    }
    if (ev.key !== 'Tab') return;
    var lista = enfocables(modalAbierto);
    if (!lista.length) return;
    var primero = lista[0], ultimo = lista[lista.length - 1];
    if (ev.shiftKey && document.activeElement === primero) {
      ev.preventDefault();
      ultimo.focus();
    } else if (!ev.shiftKey && document.activeElement === ultimo) {
      ev.preventDefault();
      primero.focus();
    }
  });

  /* --- archivos ---------------------------------------------------------- */

  function leerArchivo(input, cb) {
    if (!input || !input.files || !input.files.length || typeof cb !== 'function') return;
    var archivo = input.files[0];
    var lector = new FileReader();
    lector.onload = function () {
      cb({
        nombre: archivo.name,
        tamano: tamano(archivo.size),
        tipo: archivo.type || '',
        url: String(lector.result)
      });
    };
    lector.readAsDataURL(archivo);
  }

  return {
    esc: esc,
    attr: attr,
    icono: icono,
    avatar: avatar,
    badge: badge,
    chip: chip,
    kpi: kpi,
    tabla: tabla,
    barras: barras,
    columnas: columnas,
    linea: linea,
    anillo: anillo,
    dona: dona,
    estrellas: estrellas,
    estrellasInput: estrellasInput,
    moneda: moneda,
    fecha: fecha,
    notaTexto: notaTexto,
    claseNota: claseNota,
    seccion: seccion,
    panel: panel,
    vacio: vacio,
    campo: campo,
    form: form,
    pestanas: pestanas,
    migas: migas,
    toast: toast,
    modal: modal,
    cerrarModal: cerrarModal,
    confirmar: confirmar,
    leerArchivo: leerArchivo,
    tamano: tamano,
    iniciales: iniciales,
    progreso: progreso
  };
})();
